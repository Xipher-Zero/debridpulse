# DebridPulse: AllDebrid download manager
# Generic bridge-network example. Adapt host paths, UID/GID and timezone.

services:
  debridpulse:
    image: ghcr.io/xipher-zero/debridpulse:v1.0.11.1
    build: .
    container_name: debridpulse
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /mnt/user/appdata/debridpulse/data:/app/data
      - /mnt/user/appdata/debridpulse/config:/app/config
      - /mnt/user/downloads:/download
    environment:
      - PUID=99
      - PGID=100
      - CONFIG_PATH=/app/config/config.json
      - DB_PATH=/app/data/debridpulse.db
      - TZ=Europe/Berlin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
