  <!-- A few bright points around the line, sparse and never on it: one line each.
       translate(x y) is where it sits (viewBox 72 x 16; the line runs at y 10, the beat
       from x 25 to 46), scale its size, opacity its brightness. They are coloured by the
       theme in force, as the line is (the application draws this file as a mask). -->
  <use class="beat" href="#spark" transform="translate(10.5 5.4) scale(.8)" opacity=".45"/>
  <use class="beat" href="#spark" transform="translate(21 13.9) scale(.65)" opacity=".6"/>
  <use class="beat" href="#spark" transform="translate(29.2 3.4) scale(.9)" opacity=".75"/>
  <use class="beat" href="#spark" transform="translate(45.5 14) scale(.7)" opacity=".7"/>
  <use class="beat" href="#spark" transform="translate(50.5 4.2) scale(1)" opacity=".85"/>
  <use class="beat" href="#spark" transform="translate(64 6.3) scale(.75)" opacity=".5"/>
  <!-- The bright point travelling the line, well after the beat, with its own glow. -->
  <circle class="beat" cx="55" cy="10" r="4.2" fill="url(#point-glow)"/>
  <circle class="beat" cx="55" cy="10" r="1.55" fill="#E3C4FF"/>
