<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 16" fill="none" role="img" aria-label="DownloadPulse waveform">
  <defs>
    <!-- One EKG beat on a long baseline that fades in from the start and out
         toward the end, drawn as a calligraphic brush stroke, and the bright
         point travelling the line after the beat (the original mock-ups'
         title artwork). -->
    <linearGradient id="pulse" x1="0" y1="8" x2="72" y2="8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B45CFF" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#B45CFF" stop-opacity=".85"/>
      <stop offset="0.58" stop-color="#7A4DFF"/>
      <stop offset="1" stop-color="#3D94FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="point-glow" cx="55" cy="10" r="4.2" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C98BFF" stop-opacity=".75"/>
      <stop offset="1" stop-color="#C98BFF" stop-opacity="0"/>
    </radialGradient>
    <!-- One spark: a soft glow and a bright core, at the origin, unit size (see the sparks below). -->
    <radialGradient id="spark-glow">
      <stop stop-color="#F1E4FF" stop-opacity=".7"/>
      <stop offset="1" stop-color="#F1E4FF" stop-opacity="0"/>
    </radialGradient>
    <g id="spark">
      <circle r="1.25" fill="url(#spark-glow)"/>
      <circle r=".38" fill="#F1E4FF"/>
    </g>
    <!-- The waveform's halo alone, for the application, which colours the
         waveform through this file as a mask (ui-shell.css #page-title::after)
         and lays the halo under it: opened as #glow (DownloadPulse Dark's soft
         glow) or #glow-light (Light's shade and glow), the drawing shows only
         the glow at 105 x 19. Opened without a fragment the file is drawn as
         itself. -->
    <filter id="halo" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.53"/>
      <feComponentTransfer><feFuncA type="linear" slope=".34"/></feComponentTransfer>
    </filter>
    <filter id="halo-light" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.26"/>
      <feOffset dy="1.68"/>
      <feComponentTransfer result="shade"><feFuncA type="linear" slope=".18"/></feComponentTransfer>
      <feMerge result="shaded"><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
      <feGaussianBlur in="shaded" stdDeviation="2.95"/>
      <feComponentTransfer><feFuncA type="linear" slope=".25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="shade"/></feMerge>
    </filter>
    <style>#glow:target ~ .beat { filter: url(#halo); } #glow-light:target ~ .beat { filter: url(#halo-light); }</style>
  </defs>
  <g id="glow"/>
  <g id="glow-light"/>
