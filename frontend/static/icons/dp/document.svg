<svg xmlns="http://www.w3.org/2000/svg" width="122" height="122" viewBox="0 0 122 122" fill="none">
  <defs>
    <!-- Borderless dark tile with the original blue/purple ambient glow -->
    <radialGradient id="tileGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(61 58) rotate(90) scale(61)">
      <stop offset="0" stop-color="#173B75"/>
      <stop offset="0.52" stop-color="#102654"/>
      <stop offset="1" stop-color="#0E142D"/>
    </radialGradient>

    <!-- Subtle blue bloom within the tile -->
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(58 56) rotate(90) scale(50)">
      <stop stop-color="#2368D9" stop-opacity=".28"/>
      <stop offset=".7" stop-color="#1B4AA5" stop-opacity=".09"/>
      <stop offset="1" stop-color="#1B4AA5" stop-opacity="0"/>
    </radialGradient>

    <!-- File face gradient -->
    <linearGradient id="fileFill" x1="43" y1="36" x2="78" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6FA9FF"/>
      <stop offset=".5" stop-color="#4C8FFF"/>
      <stop offset="1" stop-color="#3678ED"/>
    </linearGradient>

    <linearGradient id="foldFill" x1="65" y1="36" x2="78" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7D5FF"/>
      <stop offset="1" stop-color="#73A9FF"/>
    </linearGradient>

    <!-- Glow around the page icon -->
    <filter id="fileGlow" x="-45%" y="-40%" width="190%" height="190%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4.2" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.10
                0 0 0 0 0.38
                0 0 0 0 1
                0 0 0 .72 0" result="blueGlow"/>
      <feMerge>
        <feMergeNode in="blueGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gentle inner highlight -->
    <filter id="softHighlight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <!-- No stroke / no border -->
  <rect x="8" y="8" width="106" height="106" rx="24" fill="url(#tileGlow)"/>
  <rect x="8" y="8" width="106" height="106" rx="24" fill="url(#ambient)"/>

  <!-- Document icon -->
  <g filter="url(#fileGlow)">
    <path d="M42 36.5C42 34.57 43.57 33 45.5 33H64.7L80 48.3V81.5C80 83.43 78.43 85 76.5 85H45.5C43.57 85 42 83.43 42 81.5V36.5Z"
          fill="url(#fileFill)"/>

    <!-- folded corner -->
    <path d="M64.5 33V45.7C64.5 47.52 65.98 49 67.8 49H80L64.5 33Z"
          fill="url(#foldFill)"/>

    <!-- crisp fold separation -->
    <path d="M64.5 33V45.7C64.5 47.52 65.98 49 67.8 49H80"
          stroke="#2A65C8" stroke-opacity=".58" stroke-width="1.4"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- soft upper-left sheen -->
    <path d="M46 37.5H61.5" stroke="#A9CCFF" stroke-opacity=".34" stroke-width="2.2"
          stroke-linecap="round" filter="url(#softHighlight)"/>
  </g>
</svg>
