name: Stage 9 Apply

on:
  push:
    branches:
      - '1.0.12'
    paths:
      - 'backend/tests/test_route_provider_provenance.py'
      - 'backend/tests/test_route_provider_provenance_audit.py'
      - '.github/workflows/stage9-apply.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: '1.0.12'
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Inspect source shape
        run: |
          git diff --check 7133b7567d40662c27de24eeb0866cb6cd6e64ee..HEAD
          python -m compileall -q backend/transfers/repository.py backend/services/db_maintenance.py backend/db/migrations/v112.py backend/tests/test_route_provider_provenance.py backend/tests/test_route_provider_provenance_audit.py

      - name: Install focused test dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt

      - name: Run complete Stage 9 focused and surrounding regression gate
        run: |
          cd backend
          python -m pytest \
            tests/test_route_provider_provenance.py \
            tests/test_route_provider_provenance_audit.py \
            tests/test_initial_provider_routing.py \
            tests/test_application_runtime.py::test_database_wipe_backs_up_canonical_state_and_preserves_pause \
            tests/test_universal_lifecycle.py \
            tests/test_universal_migration.py \
            tests/test_provider_applicability.py \
            tests/test_alldebrid_host_runtime.py \
            tests/test_general_http_stage5_runtime.py \
            -q --tb=short
