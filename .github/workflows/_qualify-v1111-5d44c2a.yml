name: Qualify v1.0.11.1 5d44c2a

on:
  push:
    branches:
      - audit/v1.0.11.1-f500727-qualification
    paths:
      - .github/workflows/_qualify-v1111-5d44c2a.yml

permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

env:
  CANDIDATE_SHA: 5d44c2a52b88f027501c8091913e4a8d546910b9
  CANDIDATE_VERSION: 1.0.11.1
  IMAGE_TAG: local/debridpulse:qual-5d44c2a
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  source-gates:
    name: Source regression dependency static-security gates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 5d44c2a52b88f027501c8091913e4a8d546910b9
          fetch-depth: 2
      - name: Prove exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$CANDIDATE_VERSION"
          test -z "$(git status --porcelain)"
          echo "QUALIFYING_SHA=$(git rev-parse HEAD)"
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install test and audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff pip-audit bandit
      - name: Diff and frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          find frontend/static -maxdepth 1 -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Python undefined-name and compile gates
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          ruff check api auth core db services main.py --select F821,F822,F823
          cd ..
          python -m compileall -q backend
      - name: Frontend architecture integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "1.0.11.1"
          for retired in \
            ui-presentation-loader.js \
            ui-shell-runtime.js \
            ui-page-finalization.js \
            ui-page-finalization.css \
            ui-visual-behavior-fixes.js \
            ui-help-chrome.js \
            ui-settings-auth-resilience.js \
            ui-settings-authentication.js \
            ui-settings-authentication-polish.js \
            ui-settings-authentication-polish.css \
            ui-settings-authentication-oidc.js \
            ui-settings-authentication-callback.js \
            ui-dashboard-batch5.css \
            ui-dashboard-polish.css \
            ui-dashboard-polish-final.css \
            ui-dashboard-final.css \
            ui-settings-authentication-oidc.css; do
            test ! -e "frontend/static/$retired"
            if grep -q "$retired" frontend/static/index.html frontend/static/style-v11.css 2>/dev/null; then
              echo "Retired frontend layer still referenced: $retired"
              exit 1
            fi
          done
          ! grep -q 'window.nav =' frontend/static/ui-accessibility-runtime.js
          test "$(grep -o 'new MutationObserver' frontend/static/ui-accessibility-runtime.js | wc -l)" = 3
          ! grep -q 'MutationObserver' frontend/static/ui-error-semantics.js
          ! grep -Eq 'window\.(progress|badge|toast|updateOperatorTitle|updateThemeToggle|toggleTheme)[[:space:]]*=' \
            frontend/static/operator-title.js \
            frontend/static/ui-error-semantics.js \
            frontend/static/ui-accessibility-runtime.js
          grep -q 'dp-terminal-error-progress' frontend/static/app.js
          grep -q 'window.DPIcons.statusBadge' frontend/static/app.js
          grep -q 'window.DPIcons.toast' frontend/static/app.js
          grep -q 'window.DPIcons.renderThemeGlyph' frontend/static/app.js
          grep -q 'window.DPSettingsPage = Object.freeze({load});' frontend/static/ui-settings-page.js
          grep -q 'window.DPStatisticsLifecycle = Object.freeze({load: loadDetailedStats, install});' frontend/static/ui-statistics.js
          grep -q 'window.DPHelpPage = Object.freeze({load, activateTab});' frontend/static/ui-help-page.js
          grep -q 'debridpulse:help-rendered' frontend/static/ui-help-page.js
          grep -q 'debridpulse:help-rendered' frontend/static/ui-help-license-documents.js
          ! grep -q 'DOMContentLoaded' frontend/static/ui-help-page.js
          ! grep -q 'DOMContentLoaded' frontend/static/ui-help-license-documents.js
          ! grep -q 'requestAnimationFrame' frontend/static/ui-help-license-documents.js
          test -f frontend/static/icons/lucide/scale.svg
          test ! -e scripts/_canonicalize_frontend_runtime_css.py
          test ! -e scripts/_repair_canonical_contract_tests.py
          test ! -e .github/workflows/_canonicalize-runtime-css.yml
          test ! -e .github/workflows/_audit-v1111-frontend.yml
          test ! -e v1111-frontend-census.txt
          test ! -e v1111-pytest-failures.txt

          # Accepted Downloads structure is static and directly owned.
          python - <<'PY'
          from pathlib import Path
          html = Path('frontend/static/index.html').read_text()
          runtime = Path('frontend/static/ui-downloads-runtime.js').read_text()
          css = Path('frontend/static/ui-downloads-page.css').read_text()
          operator = Path('frontend/static/operator-title.js').read_text()
          app = Path('frontend/static/app.js').read_text()
          view = html[html.index('id="view-torrents"'):html.index('<!-- Events -->')]
          assert 'Download Queue' in view
          assert 'class="bulk-bar dp-downloads-bulk-card dp-downloads-bulk-integrated" id="bulk-bar"' in view
          assert view.index('id="torrent-search"') < view.index('id="bulk-bar"') < view.index('class="dp-downloads-table-wrap"')
          assert 'id="torrent-page-size"' not in view
          assert 'Most of them followed instructions.' in runtime
          for bad in ("bar.replaceChildren(header)", "insertBefore(bar", "bar.classList.add('dp-card'"):
              assert bad not in runtime, bad
          assert 'Canonical integrated multi-selection strip' not in css
          assert 'data-dp-downloads-runtime' not in operator
          assert '/ui-downloads-runtime.js?v=24' in html

          # ADC startup/debug surfaces are physically absent, not suppressed.
          for fragment in ('debug-status','dash-health-bar','dash-health-recovery','dash-health-deadlock','dash-health-aging'):
              assert fragment not in html, fragment
              assert fragment not in app, fragment
          assert 'function dbg(' not in app
          assert 'dbg(' not in app
          assert 'function updateHealthBar(' not in app
          assert 'function runRecovery(' in app
          assert "'/recovery/run'" in app
          PY
      - name: Full regression suite from zero
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python -m pytest tests/ -q --tb=short --junitxml=/tmp/debridpulse-pytest.xml
          python - <<'PY'
          from xml.etree import ElementTree as ET
          root = ET.parse('/tmp/debridpulse-pytest.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
          tests = sum(int(s.attrib.get('tests', 0)) for s in suites)
          failures = sum(int(s.attrib.get('failures', 0)) for s in suites)
          errors = sum(int(s.attrib.get('errors', 0)) for s in suites)
          skipped = sum(int(s.attrib.get('skipped', 0)) for s in suites)
          print(f'PYTEST_TOTAL={tests} FAILURES={failures} ERRORS={errors} SKIPPED={skipped}')
          if failures or errors:
              raise SystemExit(1)
          PY
      - name: pip-audit
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          pip-audit -r requirements.txt --progress-spinner off
      - name: Bandit high-confidence high-severity gate
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt

  container-runtime:
    name: Release image runtime non-root and vulnerability gates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 5d44c2a52b88f027501c8091913e4a8d546910b9
          fetch-depth: 2
      - name: Prove exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$CANDIDATE_VERSION"
          test -z "$(git status --porcelain)"
      - name: Build release image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            --build-arg APP_VERSION="$CANDIDATE_VERSION" \
            --build-arg VCS_REF="$CANDIDATE_SHA" \
            --tag "$IMAGE_TAG" .
          test "$(docker image inspect "$IMAGE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$CANDIDATE_SHA"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$CANDIDATE_VERSION"
      - name: Root startup and release smoke
        shell: bash
        run: |
          set -euo pipefail
          c=debridpulse-qual-root-5d44c2a
          trap 'docker rm -f "$c" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$c" -e PUID=0 -e PGID=0 -e CONFIG_PATH=/app/config/config.json -e DB_PATH=/app/data/debridpulse.db "$IMAGE_TAG"
          healthy=0
          for _ in $(seq 1 30); do
            if docker exec "$c" curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then healthy=1; break; fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$c")" != true ]; then break; fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then docker logs "$c" || true; exit 1; fi
          health="$(docker exec "$c" curl -fsS http://127.0.0.1:8080/api/health)"
          test "$(jq -r '.version // empty' <<<"$health")" = "$CANDIDATE_VERSION"
          docker exec "$c" test -f /app/LICENSE
          docker exec "$c" test -f /app/NOTICE
          docker exec "$c" test -f /app/licenses/python-runtime.json
          docker exec "$c" test -f /app/licenses/bencode2-MIT.txt
          docker exec "$c" grep -q 'Chris Moore' /app/NOTICE
          docker exec "$c" grep -q '^VERSION_CODENAME=trixie$' /etc/os-release
          docker exec "$c" dpkg-query -W 7zip 7zip-rar aria2 gosu
          docker exec "$c" test -f /usr/share/doc/7zip-rar/copyright
          docker exec "$c" test -f /usr/share/doc/7zip-rar/unRarLicense.txt
          docker exec "$c" sh -c '7z i | grep -qi rar'
      - name: Non-root runtime and writable paths
        shell: bash
        run: |
          set -euo pipefail
          c=debridpulse-qual-nonroot-5d44c2a
          trap 'docker rm -f "$c" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$c" -e PUID=12345 -e PGID=12345 -e CONFIG_PATH=/app/config/config.json -e DB_PATH=/app/data/debridpulse.db "$IMAGE_TAG"
          healthy=0
          for _ in $(seq 1 30); do
            if docker exec "$c" curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then healthy=1; break; fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then docker logs "$c" || true; exit 1; fi
          test "$(docker exec "$c" awk '/^Uid:/{print $2}' /proc/1/status)" = 12345
          test "$(docker exec "$c" awk '/^Gid:/{print $2}' /proc/1/status)" = 12345
          docker exec --user 12345:12345 "$c" sh -c 'set -eu; touch /app/data/.smoke /app/config/.smoke /download/.smoke; rm -f /app/data/.smoke /app/config/.smoke /download/.smoke'
      - name: Report runtime vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: local/debridpulse:qual-5d44c2a
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: false
          exit-code: '0'
      - name: Block fixable high or critical runtime vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: local/debridpulse:qual-5d44c2a
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 5d44c2a52b88f027501c8091913e4a8d546910b9
          fetch-depth: 2
      - name: Prove exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$CANDIDATE_VERSION"
          test -z "$(git status --porcelain)"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
