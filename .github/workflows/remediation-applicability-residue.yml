name: Applicability Residue Remediation

on:
  push:
    branches: [1.0.12]
    paths:
      - '.github/workflows/remediation-applicability-residue.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Remove implicit applicability fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/transfers/applicability.py')
          source = path.read_text(encoding='utf-8')

          old_generic = '''    facts = item.applicability
    if facts is None:
        # Compatibility for existing providers that have only the canonical
        # request-type declaration. Explicit applicability replaces this legacy
        # URL-generic interpretation and can therefore be specialized-only.
        return view.scheme in {str(kind).casefold() for kind in item.request_types}
    try:
'''
          new_generic = '''    facts = item.applicability
    if facts is None:
        # Applicability is an explicit provider contract. Missing facts must not
        # be reinterpreted from request_types, which would create a second URL
        # classifier and let undeclared providers enter generic competition.
        return False
    try:
'''
          if source.count(old_generic) != 1:
              raise SystemExit(f'generic fallback anchor mismatch: {source.count(old_generic)}')
          source = source.replace(old_generic, new_generic, 1)

          old_static = '''        explicit_url_kind = payload_marks_url or any(
            item.applicability is not None
            and (
                kind in {
                    str(scheme).casefold() for scheme in item.applicability.generic_schemes
                }
                or any(
                    kind in {str(scheme).casefold() for scheme in claim.schemes}
                    for claim in item.applicability.specialized_hosts
                )
            )
            for item in inputs
        )
        if explicit_url_kind:
            return ()
        return tuple(
            ApplicabilityMatch(item.provider_id, ApplicabilityClass.STATIC)
            for item in inputs
        )
'''
          new_static = '''        declared = tuple(item for item in inputs if item.applicability is not None)
        explicit_url_kind = payload_marks_url or any(
            kind in {
                str(scheme).casefold() for scheme in item.applicability.generic_schemes
            }
            or any(
                kind in {str(scheme).casefold() for scheme in claim.schemes}
                for claim in item.applicability.specialized_hosts
            )
            for item in declared
        )
        if explicit_url_kind:
            return ()
        return tuple(
            ApplicabilityMatch(item.provider_id, ApplicabilityClass.STATIC)
            for item in declared
        )
'''
          if source.count(old_static) != 1:
              raise SystemExit(f'static fallback anchor mismatch: {source.count(old_static)}')
          path.write_text(source.replace(old_static, new_static, 1), encoding='utf-8')

          test = Path('backend/tests/test_applicability_explicit_contract.py')
          test.write_text('''from transfers.applicability import (\n    ApplicabilityClass,\n    ProviderApplicability,\n    ProviderApplicabilityInput,\n    classify_provider_applicability,\n)\nfrom transfers.models import TransferRequest\n\n\ndef test_missing_applicability_cannot_be_inferred_from_url_request_types() -> None:\n    undeclared = ProviderApplicabilityInput(\n        "undeclared-http", frozenset({"http", "https"}), True, None\n    )\n    request = TransferRequest("https", "https://example.test/file")\n    assert classify_provider_applicability(request, (undeclared,)) == ()\n\n\ndef test_missing_applicability_cannot_fall_back_to_opaque_static_routing() -> None:\n    undeclared = ProviderApplicabilityInput(\n        "undeclared-opaque", frozenset({"parcel"}), True, None\n    )\n    declared = ProviderApplicabilityInput(\n        "declared-opaque", frozenset({"parcel"}), True, ProviderApplicability()\n    )\n    request = TransferRequest("parcel", "opaque-payload")\n    assert classify_provider_applicability(request, (undeclared,)) == ()\n    matches = classify_provider_applicability(request, (declared, undeclared))\n    assert [(match.provider_id, match.classification) for match in matches] == [\n        ("declared-opaque", ApplicabilityClass.STATIC)\n    ]\n\n\ndef test_static_magnet_routing_remains_independent_of_url_applicability_facts() -> None:\n    static = ProviderApplicabilityInput(\n        "static", frozenset({"magnet"}), True, None\n    )\n    request = TransferRequest("magnet", "magnet:?xt=urn:btih:" + "a" * 40)\n    matches = classify_provider_applicability(request, (static,))\n    assert [(match.provider_id, match.classification) for match in matches] == [\n        ("static", ApplicabilityClass.STATIC)\n    ]\n''', encoding='utf-8')
          PY
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt ruff
      - name: Applicability and two-provider routing regression gate
        run: |
          set -euo pipefail
          PYTHONPATH=backend pytest -q \
            backend/tests/test_applicability_explicit_contract.py \
            backend/tests/test_provider_applicability.py \
            backend/tests/test_initial_provider_routing.py \
            backend/tests/test_item11_multi_provider_slice.py \
            backend/tests/test_two_provider_canonical_architecture.py \
            backend/tests/test_audit_remediation_group_a.py
          ruff check backend/transfers/applicability.py backend/tests/test_applicability_explicit_contract.py
          python -m py_compile backend/transfers/applicability.py backend/tests/test_applicability_explicit_contract.py
          git diff --check
      - name: Prove current production providers declare applicability
        run: |
          set -euo pipefail
          grep -q 'def applicability' backend/providers/general_http/provider.py
          grep -q 'ProviderApplicability' backend/providers/alldebrid/definition.py
          ! grep -n 'Compatibility for existing providers' backend/transfers/applicability.py
      - name: Commit coherent applicability residue remediation
        run: |
          set -euo pipefail
          rm .github/workflows/remediation-applicability-residue.yml
          git config user.name debridpulse-remediation
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'refactor: require explicit applicability contracts'
          git push origin HEAD:1.0.12
