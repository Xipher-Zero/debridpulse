name: Audit Final Contract Migrator

on:
  push:
    branches:
      - 'audit/v1.0.11.1-post-release-remediation'

permissions:
  contents: write

jobs:
  migrate-stale-contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: audit/v1.0.11.1-post-release-remediation

      - name: Migrate release ownership assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          version_path = Path('backend/tests/test_release_version_surface.py')
          version_lines = version_path.read_text(encoding='utf-8').splitlines()
          output = []
          replaced = 0
          skip_comment = False
          for line in version_lines:
              stripped = line.strip()
              if stripped == '# Normal end-user deployments track the promoted main image via latest,':
                  skip_comment = True
                  continue
              if skip_comment and stripped == '# while staging/release branches retain immutable SHA publication only.':
                  continue
              if stripped.startswith('assert "type=raw,value=latest,enable=') and stripped.endswith('in workflow'):
                  output.extend([
                      '    # Fork Image is now immutable-only. Mutable aliases are owned by the',
                      '    # exact-SHA Release Promotion gate after all independent qualifiers pass.',
                      '    promotion = read(ROOT / ".github" / "workflows" / "release-promotion.yml")',
                      '    assert "type=raw,value=latest" not in workflow',
                      '    assert "type=ref,event=tag" not in workflow',
                      '    assert \'target_tag="latest"\' in promotion',
                      '    assert \'target_tag="$GITHUB_REF_NAME"\' in promotion',
                      '    assert \'"Fork Image"\' in promotion',
                  ])
                  replaced += 1
                  skip_comment = False
                  continue
              if skip_comment:
                  raise SystemExit('unexpected release-version comment structure')
              output.append(line)
          if replaced != 1:
              raise SystemExit(f'expected one stale latest assertion, replaced {replaced}')
          version_path.write_text('\n'.join(output) + '\n', encoding='utf-8')

          scope_path = Path('backend/tests/test_v1_scope.py')
          scope_text = scope_path.read_text(encoding='utf-8')
          start = scope_text.index('def test_release_workflow_accepts_public_v1_tags():')
          end = scope_text.index('\n\ndef test_operator_tab_title_uses_short_active_identity_and_queue_average():', start)
          replacement_lines = [
              'def test_release_workflow_accepts_public_v1_tags():',
              '    image_workflow = (REPO_ROOT / ".github/workflows/fork-image.yml").read_text()',
              '    promotion_workflow = (REPO_ROOT / ".github/workflows/release-promotion.yml").read_text()',
              '    release_helper = (REPO_ROOT / "release.py").read_text()',
              '    assert "- \'v*\'" in image_workflow',
              '    assert "- \'v*\'" in promotion_workflow',
              '    assert \'target_tag="$GITHUB_REF_NAME"\' in promotion_workflow',
              '    assert "type=ref,event=tag" not in image_workflow',
              '    assert "DB_PATH=/app/data/debridpulse.db" in image_workflow',
              '    version = (REPO_ROOT / "VERSION").read_text().strip()',
              '    parsed = Version(version)',
              '    assert parsed.release[:2] == (1, 0)',
              '    assert \'tag = f"v{version}"\' in release_helper',
              '    assert "internal-v{version}" not in release_helper',
              '',
          ]
          replacement = '\n'.join(replacement_lines)
          scope_path.write_text(scope_text[:start] + replacement + scope_text[end:], encoding='utf-8')
          PY
          git diff --check

      - name: Commit migrated contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tests/test_release_version_surface.py backend/tests/test_v1_scope.py
          git diff --cached --check
          git commit -m 'test(release): align legacy contracts with promotion gate'
          git push origin HEAD:audit/v1.0.11.1-post-release-remediation
