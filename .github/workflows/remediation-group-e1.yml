name: Remediation Group E1

on:
  push:
    branches: [1.0.12]
    paths:
      - '.github/remediation-group-e1.py'
      - '.github/remediation-group-e1-testfix.py'
      - '.github/remediation-group-e1-corrective.py'
      - '.github/remediation-group-e1-corrective2.py'
      - '.github/remediation-group-e1-corrective3.py'
      - '.github/workflows/remediation-group-e1.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply E1 shell and Downloads canonicalization
        run: |
          python .github/remediation-group-e1.py
          python .github/remediation-group-e1-testfix.py
          python .github/remediation-group-e1-corrective.py
          python .github/remediation-group-e1-corrective2.py
          python .github/remediation-group-e1-corrective3.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt ruff
      - name: E1 ownership and surrounding UI contracts
        run: |
          set -euo pipefail
          PYTHONPATH=backend pytest -q \
            backend/tests/test_uiarch001_e1_ownership.py \
            backend/tests/test_ui_runtime_architecture_contract.py \
            backend/tests/test_ui_downloads_correction_batch_contract.py \
            backend/tests/test_ui_downloads_final_contract.py \
            backend/tests/test_ui_downloads_structural_contract.py \
            backend/tests/test_ui_downloads_polish_contract.py \
            backend/tests/test_ui_desktop_downloads_batch_contract.py \
            backend/tests/test_ui_shell_contract.py \
            backend/tests/test_ui_shell_seam_contract.py \
            backend/tests/test_ui_shell_signal_field_contract.py \
            backend/tests/test_ui_provider_status_contract.py \
            backend/tests/test_v1111_canonical_frontend_contract.py \
            backend/tests/test_ui_dashboard_contract.py \
            backend/tests/test_ui_activity_log_page_contract.py \
            backend/tests/test_ui_statistics_contract.py \
            backend/tests/test_ui_lucide_canonicalization_contract.py \
            backend/tests/test_dashboard_sparkline_canonical_owner.py \
            backend/tests/test_ui_feature_icon_contract.py \
            backend/tests/test_ui_detail_overlay_cleanup_contract.py
      - name: Inspect residual correction-runtime contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          tests = Path('backend/tests')
          patterns = (
              re.compile(r'''\bread\(\s*["']ui-(?:downloads-)?runtime\.js["']\s*\)'''),
              re.compile(r'''STATIC\s*/\s*["']ui-(?:downloads-)?runtime\.js["']\s*\)\.read_text'''),
              re.compile(r'''^\s*(?:RUNTIME|PRESENTATION_RUNTIME|DOWNLOADS_RUNTIME)\s*=\s*STATIC\s*/\s*["']ui-(?:downloads-)?runtime\.js["']''', re.M),
          )
          hits = []
          for path in sorted(tests.glob('*.py')):
              source = path.read_text(encoding='utf-8')
              for pattern in patterns:
                  for match in pattern.finditer(source):
                      line = source.count('\n', 0, match.start()) + 1
                      hits.append(f'{path}:{line}:{match.group(0)}')
          if hits:
              raise SystemExit('Residual tests still actively depend on retired E1 runtimes:\n' + '\n'.join(hits))
          PY
      - name: Frontend syntax and ownership static gate
        run: |
          set -euo pipefail
          for file in frontend/static/*.js; do node --check "$file"; done
          git diff --check
          test ! -e frontend/static/ui-runtime.js
          test ! -e frontend/static/ui-downloads-runtime.js
          ! grep -R -n -E 'ui-downloads-runtime\.js|ui-runtime\.js' frontend/static --exclude='*.map'
          ! grep -n -E 'MutationObserver|createElement\(.script.|bindThemeToggle|decorateNavigation' frontend/static/operator-title.js
          grep -q 'function renderTorrentPagination(' frontend/static/app.js
          grep -q 'function setFilter(' frontend/static/app.js
          grep -q 'dp-downloads-detail-row' frontend/static/app.js
          ! grep -q 'draggable="true"' frontend/static/app.js
      - name: Commit coherent E1 canonicalization
        run: |
          set -euo pipefail
          rm .github/remediation-group-e1.py .github/remediation-group-e1-testfix.py .github/remediation-group-e1-corrective.py .github/remediation-group-e1-corrective2.py .github/remediation-group-e1-corrective3.py .github/workflows/remediation-group-e1.yml
          rm -f .github/e1-focused-gate-failure.txt
          git config user.name debridpulse-remediation
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'refactor: canonicalize shell and downloads ownership'
          git push origin HEAD:1.0.12
