name: Universal Lucide Canonicalization Diagnostic

on:
  push:
    branches:
      - ci-ops/lucide-universal-232e562

permissions:
  contents: read

env:
  TARGET_BRANCH: staging/v1.0.11-ui
  EXPECTED_BASE: 232e562ddf8a31a808e68f8e582068b1da42c11a
  HELPER_BRANCH: ci-ops/lucide-universal-232e562

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install test dependencies
        run: |
          cd backend
          python -m pip install -r requirements-dev.txt

      - name: Prepare and apply migration on locked base
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$HELPER_BRANCH:.github/scripts/apply_lucide_universal.py" > /tmp/apply_lucide_universal.py
          git show "origin/$HELPER_BRANCH:.github/scripts/prepare_lucide_helper.py" > /tmp/prepare_lucide_helper.py
          python -m py_compile /tmp/prepare_lucide_helper.py
          python /tmp/prepare_lucide_helper.py /tmp/apply_lucide_universal.py
          python -m py_compile /tmp/apply_lucide_universal.py
          git fetch origin "$TARGET_BRANCH"
          actual_base="$(git rev-parse "origin/$TARGET_BRANCH")"
          test "$actual_base" = "$EXPECTED_BASE"
          git checkout --detach "$EXPECTED_BASE"
          python /tmp/apply_lucide_universal.py

      - name: Verify backend version remains 1.0.10
        run: test "$(tr -d '\r\n' < VERSION)" = "1.0.10"

      - name: Verify generated diff whitespace
        run: git diff --check

      - name: Verify JavaScript syntax
        run: |
          node --check frontend/static/ui-lucide-runtime.js
          node --check frontend/static/app.js
          node --check frontend/static/operator-title.js
          node --check frontend/static/ui-runtime.js
          node --check frontend/static/ui-downloads-runtime.js
          node --check frontend/static/auth-ux.js

      - name: Verify exact changed-file set
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r changed; do
            [ -z "$changed" ] && continue
            case "$changed" in
              frontend/static/ui-lucide-runtime.js|\
              frontend/static/ui-lucide-iconography.css|\
              frontend/static/app.js|\
              frontend/static/index.html|\
              frontend/static/operator-title.js|\
              frontend/static/ui-runtime.js|\
              frontend/static/ui-downloads-runtime.js|\
              frontend/static/auth-ux.js|\
              frontend/static/ui-transfer-contract.css|\
              frontend/static/style.css|\
              frontend/static/style-v11.css|\
              docs/UI_ICON_SYSTEM.md|\
              backend/tests/test_*.py)
                ;;
              *)
                echo "Unexpected changed path: $changed"
                exit 1
                ;;
            esac
          done < <(git ls-files -m -o --exclude-standard)

      - name: Run backend and UI contract tests
        run: |
          cd backend
          python -m pytest tests/ -q

      - name: Verify staged candidate diff
        shell: bash
        run: |
          set -euo pipefail
          git add frontend/static/ui-lucide-runtime.js \
                  frontend/static/ui-lucide-iconography.css \
                  frontend/static/app.js \
                  frontend/static/index.html \
                  frontend/static/operator-title.js \
                  frontend/static/ui-runtime.js \
                  frontend/static/ui-downloads-runtime.js \
                  frontend/static/auth-ux.js \
                  frontend/static/ui-transfer-contract.css \
                  frontend/static/style.css \
                  frontend/static/style-v11.css \
                  docs/UI_ICON_SYSTEM.md \
                  backend/tests
          git diff --cached --check
