name: Item 7 Changelog Maintenance

on:
  push:
    branches: ["1.0.12"]
    paths:
      - ".github/workflows/item7-changelog-maintenance.yml"

permissions:
  contents: write

jobs:
  patch-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Item 7 changelog entry
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          old = "- Added deterministic static and runtime-derived specialized-claim proofs while keeping provider runtime payload interpretation, freshness and host knowledge outside the universal classifier. AllDebrid dynamic host-support fetching/parsing/persistence remains explicitly deferred to Roadmap Item 7."
          new = "- Added deterministic static and runtime-derived specialized-claim proofs while keeping provider runtime payload interpretation, freshness and host knowledge outside the universal classifier.\n- Added AllDebrid-owned dynamic supported-host retrieval through the existing paced v4.1 client, provider-local domain/regex/availability/quota interpretation, opaque Item 2 last-known-good persistence, maintenance-only approximately 24-hour refresh, restart and disable/re-enable recovery, and neutral HTTP(S) `SPECIALIZED` claim publication. Ordinary URL, magnet, and torrent submission never refreshes host inventory; magnet/torrent remain provider-declared `STATIC` request-type capabilities."
          if old not in text:
              raise SystemExit("expected Item 6 changelog sentence not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit changelog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "item7: document AllDebrid dynamic host plumbing"
          git push origin HEAD:1.0.12
