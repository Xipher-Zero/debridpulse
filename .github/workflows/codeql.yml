# CodeQL static analysis — runs on main, the current release branch, staging/audit candidates, release tags, and weekly.
# Scans Python backend, browser JavaScript, and GitHub Actions workflow files.
name: CodeQL

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '1.0.11'
      - '1.0.12'
      - '1.0.13'
      - '1.0.14'
      - 'audit/**'
    tags:
      - 'v*'
      - 'internal-v*'
  pull_request:
    branches:
      - main
      - '1.0.11'
      - '1.0.12'
      - '1.0.13'
      - '1.0.14'
      - 'staging/**'
  schedule:
    - cron: '17 20 * * 4'   # Thursday 20:17 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:${{ matrix.language }}"

  # This required gate passed for a 1.0.14 push (first attempt or a re-run):
  # Testing Alias re-evaluates 1.0.14-testing from all six gates of the branch
  # tip, moving it only to a fully qualified tip, one evaluation at a time.
  # Its outcome is the "1.0.14-testing" commit status, never this gate's.
  testing-alias:
    name: Testing alias
    needs: [analyze]
    if: github.event_name == 'push' && github.ref == 'refs/heads/1.0.14'
    permissions:
      contents: read
      actions: read
      packages: write
      attestations: read
      statuses: write
    uses: ./.github/workflows/testing-alias.yml
