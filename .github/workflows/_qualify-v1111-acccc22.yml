name: Qualify v1.0.11.1 acccc22

on:
  push:
    branches:
      - audit/v1.0.11.1-f500727-qualification
    paths:
      - .github/workflows/_qualify-v1111-acccc22.yml

permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

env:
  CANDIDATE_SHA: acccc222f2f84622413409e0d7733cc2d200b6f8
  CANDIDATE_VERSION: 1.0.11.1
  IMAGE_TAG: local/debridpulse:qual-acccc22
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  source-gates:
    name: Source regression dependency static-security gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: acccc222f2f84622413409e0d7733cc2d200b6f8
          fetch-depth: 2
      - name: Prove exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$CANDIDATE_VERSION"
          test -z "$(git status --porcelain)"
          echo "QUALIFYING_SHA=$(git rev-parse HEAD)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install test and audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff pip-audit bandit
      - name: Syntax static and architecture gates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          find frontend/static -maxdepth 1 -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          cd backend
          ruff check api auth core db services main.py --select F821,F822,F823
          cd ..
          python -m compileall -q backend
          python - <<'PY'
          from pathlib import Path
          s=Path('frontend/static')
          html=(s/'index.html').read_text()
          app=(s/'app.js').read_text()
          runtime=(s/'ui-downloads-runtime.js').read_text()
          css=(s/'ui-downloads-page.css').read_text()
          operator=(s/'operator-title.js').read_text()
          access=(s/'ui-accessibility-runtime.js').read_text()
          errors=(s/'ui-error-semantics.js').read_text()
          retired=(
            'ui-presentation-loader.js','ui-shell-runtime.js','ui-page-finalization.js','ui-page-finalization.css',
            'ui-visual-behavior-fixes.js','ui-help-chrome.js','ui-settings-auth-resilience.js',
            'ui-settings-authentication.js','ui-settings-authentication-polish.js','ui-settings-authentication-polish.css',
            'ui-settings-authentication-oidc.js','ui-settings-authentication-callback.js',
            'ui-dashboard-batch5.css','ui-dashboard-polish.css','ui-dashboard-polish-final.css','ui-dashboard-final.css',
            'ui-settings-authentication-oidc.css')
          for name in retired:
              assert not (s/name).exists(), name
              assert name not in html and name not in (s/'style-v11.css').read_text(), name
          assert 'window.nav =' not in access
          assert access.count('new MutationObserver') == 3
          assert 'MutationObserver' not in errors
          for text in (operator,errors,access):
              for owner in ('window.progress =','window.badge =','window.toast =','window.updateOperatorTitle =','window.updateThemeToggle =','window.toggleTheme ='):
                  assert owner not in text, owner
          assert 'dp-terminal-error-progress' in app
          assert 'window.DPIcons.statusBadge' in app
          assert 'window.DPIcons.toast' in app
          assert 'window.DPIcons.renderThemeGlyph' in app
          settings=(s/'ui-settings-page.js').read_text(); stats=(s/'ui-statistics.js').read_text(); help_page=(s/'ui-help-page.js').read_text(); legal=(s/'ui-help-license-documents.js').read_text()
          assert 'window.DPSettingsPage = Object.freeze({load});' in settings
          assert 'window.DPStatisticsLifecycle = Object.freeze({load: loadDetailedStats, install});' in stats
          assert 'window.DPHelpPage = Object.freeze({load, activateTab});' in help_page
          assert 'debridpulse:help-rendered' in help_page and 'debridpulse:help-rendered' in legal
          assert 'DOMContentLoaded' not in help_page and 'DOMContentLoaded' not in legal and 'requestAnimationFrame' not in legal
          assert (s/'icons/lucide/scale.svg').is_file()
          view=html[html.index('id="view-torrents"'):html.index('<!-- Events -->')]
          assert 'Download Queue' in view
          assert 'class="bulk-bar dp-downloads-bulk-card dp-downloads-bulk-integrated" id="bulk-bar"' in view
          assert view.index('id="torrent-search"') < view.index('id="bulk-bar"') < view.index('class="dp-downloads-table-wrap"')
          assert 'id="torrent-page-size"' not in view
          assert 'Most of them followed instructions.' in runtime
          for bad in ("bar.replaceChildren(header)","insertBefore(bar","bar.classList.add('dp-card'"):
              assert bad not in runtime, bad
          assert 'Canonical integrated multi-selection strip' not in css
          assert 'data-dp-downloads-runtime' not in operator
          assert '/ui-downloads-runtime.js?v=24' in html
          assert '`All Downloads (${torrentTotal})`' not in app
          for fragment in ('debug-status','dash-health-bar','dash-health-recovery','dash-health-deadlock','dash-health-aging'):
              assert fragment not in html and fragment not in app, fragment
          assert 'function dbg(' not in app and 'dbg(' not in app and 'function updateHealthBar(' not in app
          assert 'function runRecovery(' in app and "'/recovery/run'" in app
          for path in ('scripts/_canonicalize_frontend_runtime_css.py','scripts/_repair_canonical_contract_tests.py','.github/workflows/_canonicalize-runtime-css.yml','.github/workflows/_audit-v1111-frontend.yml','v1111-frontend-census.txt','v1111-pytest-failures.txt'):
              assert not Path(path).exists(), path
          PY
      - name: Full regression suite from zero
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python -m pytest tests/ -q --tb=short --junitxml=/tmp/debridpulse-pytest.xml
          python - <<'PY'
          from xml.etree import ElementTree as ET
          root=ET.parse('/tmp/debridpulse-pytest.xml').getroot()
          suites=[root] if root.tag=='testsuite' else list(root.findall('testsuite'))
          total=sum(int(s.attrib.get('tests',0)) for s in suites)
          failures=sum(int(s.attrib.get('failures',0)) for s in suites)
          errors=sum(int(s.attrib.get('errors',0)) for s in suites)
          skipped=sum(int(s.attrib.get('skipped',0)) for s in suites)
          print(f'PYTEST_TOTAL={total} FAILURES={failures} ERRORS={errors} SKIPPED={skipped}')
          if failures or errors: raise SystemExit(1)
          PY
      - name: pip-audit
        run: cd backend && pip-audit -r requirements.txt --progress-spinner off
      - name: Bandit high-confidence high-severity gate
        run: cd backend && bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt

  container-runtime:
    name: Release image runtime non-root and vulnerability gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: acccc222f2f84622413409e0d7733cc2d200b6f8
          fetch-depth: 2
      - name: Prove and build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$CANDIDATE_VERSION"
          test -z "$(git status --porcelain)"
          docker build --pull --build-arg APP_VERSION="$CANDIDATE_VERSION" --build-arg VCS_REF="$CANDIDATE_SHA" --tag "$IMAGE_TAG" .
          test "$(docker image inspect "$IMAGE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$CANDIDATE_SHA"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$CANDIDATE_VERSION"
      - name: Root startup and release smoke
        shell: bash
        run: |
          set -euo pipefail
          c=dp-qual-root-acccc22; trap 'docker rm -f "$c" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$c" -e PUID=0 -e PGID=0 -e CONFIG_PATH=/app/config/config.json -e DB_PATH=/app/data/debridpulse.db "$IMAGE_TAG"
          ok=0; for _ in $(seq 1 30); do if docker exec "$c" curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then ok=1; break; fi; sleep 2; done
          if [ "$ok" -ne 1 ]; then docker logs "$c" || true; exit 1; fi
          health="$(docker exec "$c" curl -fsS http://127.0.0.1:8080/api/health)"
          test "$(jq -r '.version // empty' <<<"$health")" = "$CANDIDATE_VERSION"
          docker exec "$c" test -f /app/LICENSE
          docker exec "$c" test -f /app/NOTICE
          docker exec "$c" test -f /app/licenses/python-runtime.json
          docker exec "$c" test -f /app/licenses/bencode2-MIT.txt
          docker exec "$c" grep -q 'Chris Moore' /app/NOTICE
          docker exec "$c" grep -q '^VERSION_CODENAME=trixie$' /etc/os-release
          docker exec "$c" dpkg-query -W 7zip 7zip-rar aria2 gosu
          docker exec "$c" test -f /usr/share/doc/7zip-rar/copyright
          docker exec "$c" test -f /usr/share/doc/7zip-rar/unRarLicense.txt
          docker exec "$c" sh -c '7z i | grep -qi rar'
      - name: Non-root runtime and writable paths
        shell: bash
        run: |
          set -euo pipefail
          c=dp-qual-nonroot-acccc22; trap 'docker rm -f "$c" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$c" -e PUID=12345 -e PGID=12345 -e CONFIG_PATH=/app/config/config.json -e DB_PATH=/app/data/debridpulse.db "$IMAGE_TAG"
          ok=0; for _ in $(seq 1 30); do if docker exec "$c" curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then ok=1; break; fi; sleep 2; done
          if [ "$ok" -ne 1 ]; then docker logs "$c" || true; exit 1; fi
          test "$(docker exec "$c" awk '/^Uid:/{print $2}' /proc/1/status)" = 12345
          test "$(docker exec "$c" awk '/^Gid:/{print $2}' /proc/1/status)" = 12345
          docker exec --user 12345:12345 "$c" sh -c 'set -eu; touch /app/data/.smoke /app/config/.smoke /download/.smoke; rm -f /app/data/.smoke /app/config/.smoke /download/.smoke'
      - name: Report runtime vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: local/debridpulse:qual-acccc22
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: false
          exit-code: '0'
      - name: Block fixable high or critical runtime vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: local/debridpulse:qual-acccc22
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: acccc222f2f84622413409e0d7733cc2d200b6f8
          fetch-depth: 2
      - name: Prove exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$CANDIDATE_VERSION"
          test -z "$(git status --porcelain)"
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v3
