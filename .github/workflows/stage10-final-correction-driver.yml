name: Stage 10 Final Correction Driver

on:
  push:
    branches: ['1.0.12']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: '1.0.12'
      - name: Apply final corrections
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text(); n=text.count(old)
              if n != 1: raise SystemExit(f"{path}: expected one match, got {n}")
              p.write_text(text.replace(old,new,1))

          replace('backend/api/routes.py', '''    result = public_payload(value)\n    result["current_provider_name"] = _provider_display_name(result.get("current_provider_id"), definitions)\n    result["delivering_provider_name"] = _provider_display_name(result.get("delivering_provider_id"), definitions)\n\n    for attempt in result.get("route_attempts", []) or []:\n        attempt["provider_name"] = _provider_display_name(attempt.get("provider_id"), definitions)\n    for attempt in result.get("execution_attempts", []) or []:\n        attempt["provider_name"] = _provider_display_name(attempt.get("provider_id"), definitions)\n\n    result["original_resource"] = _safe_original_resource(raw_request)\n    return result\n''', '''    result = public_payload(value)\n    if "current_provider_id" in result:\n        result["current_provider_name"] = _provider_display_name(result.get("current_provider_id"), definitions)\n    if "delivering_provider_id" in result:\n        result["delivering_provider_name"] = _provider_display_name(result.get("delivering_provider_id"), definitions)\n\n    for attempt in result.get("route_attempts", []) or []:\n        attempt["provider_name"] = _provider_display_name(attempt.get("provider_id"), definitions)\n    for attempt in result.get("execution_attempts", []) or []:\n        attempt["provider_name"] = _provider_display_name(attempt.get("provider_id"), definitions)\n\n    if raw_request is not None:\n        result["original_resource"] = _safe_original_resource(raw_request)\n    return result\n''')

          replace('backend/tests/test_general_http_stage5_architecture.py', '''    sources_panel = settings_ui.split("function sourcesPanel", 1)[1].split("\\n  function ", 1)[0]\n    assert "general_http" in sources_panel\n    assert "HTTP & HTTPS" in sources_panel\n    assert "General Sources" in sources_panel\n    for forbidden in ("User Agent", "Timeout", "Retry", "Proxy"):\n        assert forbidden not in sources_panel\n''', '''    sources_panel = settings_ui.split("function sourcesPanel", 1)[1].split("\\n  function ", 1)[0]\n    general_http = sources_panel.split("const generalHttpCard", 1)[1].split("const debridServices", 1)[0]\n    assert "general_http" in general_http\n    assert "HTTP & HTTPS" in general_http\n    assert "General Sources" in sources_panel\n    for forbidden in ("User Agent", "Timeout", "Retry", "Proxy"):\n        assert forbidden not in general_http\n''')

          replace('backend/tests/test_ui_settings_chrome_batch_contract.py', '    assert "@media (max-width: 1180px)" in chrome\n', '    assert "@media (max-width: 1699px)" in chrome\n')

          p=Path('backend/tests/test_stage10_provenance_presentation.py')
          text=p.read_text()
          anchor='''def test_original_resource_redacts_userinfo_query_fragment_and_magnet_trackers():\n'''
          addition='''def test_minimal_projection_does_not_add_null_display_fields():\n    result = _public_transfer_presentation({"id": 13, "name": "minimal"}, definitions)\n    assert result == {"id": 13, "name": "minimal"}\n\n\n'''
          if addition not in text:
              if text.count(anchor) != 1: raise SystemExit('stage10 test anchor mismatch')
              p.write_text(text.replace(anchor, addition+anchor, 1))
          PY
      - name: Verify patch
        run: |
          set -euo pipefail
          git diff --check
          python -m compileall -q backend/api backend/tests
          grep -q 'minimal_projection_does_not_add_null_display_fields' backend/tests/test_stage10_provenance_presentation.py
      - name: Commit canonical tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stage10-final-correction-driver.yml
          git add backend/api/routes.py backend/tests/test_general_http_stage5_architecture.py backend/tests/test_ui_settings_chrome_batch_contract.py backend/tests/test_stage10_provenance_presentation.py
          git diff --cached --check
          git commit -m 'fix: preserve Stage 10 presentation compatibility'
          git push origin HEAD:1.0.12
