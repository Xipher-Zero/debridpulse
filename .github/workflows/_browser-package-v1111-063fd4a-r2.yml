name: Browser and package v1.0.11.1 063fd4a r2

on:
  push:
    branches:
      - audit/v1.0.11.1-063fd4a-qualification
    paths:
      - .github/workflows/_browser-package-v1111-063fd4a-r2.yml

permissions:
  contents: read
  actions: write

env:
  CANDIDATE_SHA: 063fd4a89ef627abfd37f8e15dc2764e4c00010e
  CANDIDATE_VERSION: 1.0.11.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  browser:
    name: Corrected direct Statistics browser qualification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 063fd4a89ef627abfd37f8e15dc2764e4c00010e
          fetch-depth: 1
      - name: Prove exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$CANDIDATE_VERSION"
          test -z "$(git status --porcelain)"
      - name: Build and start exact candidate
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --build-arg APP_VERSION="$CANDIDATE_VERSION" --build-arg VCS_REF="$CANDIDATE_SHA" -t local/dp:browser-063fd4a .
          docker run -d --name dp-browser-063fd4a -p 127.0.0.1:18080:8080 -e PUID=12345 -e PGID=12345 -e CONFIG_PATH=/app/config/config.json -e DB_PATH=/app/data/debridpulse.db local/dp:browser-063fd4a
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/api/health >/dev/null && exit 0; sleep 2; done
          docker logs dp-browser-063fd4a || true
          exit 1
      - name: Install browser harness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dp-browser /tmp/dp-browser-evidence
          mkdir -p /tmp/dp-browser /tmp/dp-browser-evidence
          npm --prefix /tmp/dp-browser init -y >/dev/null 2>&1
          npm --prefix /tmp/dp-browser install --no-save puppeteer-core@24.16.0 >/dev/null
      - name: Run corrected comprehensive browser qualification
        shell: bash
        env:
          NODE_PATH: /tmp/dp-browser/node_modules
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          node <<'NODE'
          const assert=require('node:assert/strict');
          const puppeteer=require('puppeteer-core');
          const base='http://127.0.0.1:18080/';
          const views=['dashboard','torrents','events','stats','settings','help'];
          const titles={dashboard:'Dashboard',torrents:'Downloads',events:'Activity Log',stats:'Statistics',settings:'Settings',help:'Help & License'};
          const retired=['/ui-presentation-loader.js','/ui-shell-runtime.js','/ui-page-finalization.js','/ui-visual-behavior-fixes.js','/ui-help-chrome.js','/ui-settings-auth-resilience.js','/ui-settings-authentication.js','/ui-settings-authentication-polish.js','/ui-settings-authentication-oidc.js','/ui-settings-authentication-callback.js','/ui-statistics.css'];
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          async function statsStructure(p){
            return p.evaluate(()=>{
              const view=document.getElementById('view-stats');
              const header=view?.querySelector(':scope > .dp-stats-master-header');
              const body=view?.querySelector(':scope > .dp-stats-master-body');
              const period=document.getElementById('stats-period-tabs');
              const history=body?.querySelector(':scope > .dp-stats-history-grid');
              const chart=body?.querySelector(':scope > .dp-stats-chart');
              const breakdown=body?.querySelector(':scope > .dp-stats-breakdown-grid');
              const cards=breakdown?[...breakdown.querySelectorAll(':scope > .list-card')]:[];
              const titleNodes=cards.map(c=>c.querySelector('.card-title'));
              const active=!!view?.classList.contains('active');
              const headerRect=header?.getBoundingClientRect();
              const titleRect=header?.querySelector('.dp-stats-master-title')?.getBoundingClientRect();
              const periodRect=period?.getBoundingClientRect();
              return {
                active,
                master:view?.classList.contains('dp-statistics-master')||false,
                headerDirect:!!header,
                bodyDirect:!!body,
                heading:header?.querySelector('.dp-stats-heading')?.textContent.trim()||'',
                subtitle:header?.querySelector('.dp-stats-subtitle')?.textContent.trim()||'',
                periodParent:period?.parentElement===header,
                periodActive:period?.querySelector('.ftab.active')?.dataset.period||'',
                periodRight:!!(active&&periodRect&&titleRect&&periodRect.left>titleRect.right),
                primaryCount:body?.querySelectorAll(':scope > #detail-stat-cards > [data-dp-stats-metric]').length||0,
                historyCount:history?.querySelectorAll(':scope > .dash-kpi').length||0,
                queueHealth:!!document.getElementById('i-queue-health')||!!document.getElementById('i-queue-copy'),
                chartDirect:!!chart,
                chartIcon:chart?.querySelector('.scard-header img')?.getAttribute('src')||'',
                chartHeading:chart?.querySelector('.dp-stats-chart-heading')?.textContent.trim()||'',
                chartSubtitle:document.getElementById('chart-title')?.textContent.trim()||'',
                breakdownCount:cards.length,
                splitCount:view?.querySelectorAll('.split-grid').length||0,
                emoji:(view?.textContent||'').includes('📈'),
                cardTop:active?cards.map(c=>Math.round(c.getBoundingClientRect().top)):[],
                titleCentered:active?titleNodes.map((t,i)=>{
                  if(!t)return false;
                  const tr=t.getBoundingClientRect(),cr=cards[i].getBoundingClientRect();
                  return Math.abs((tr.left+tr.width/2)-(cr.left+cr.width/2))<4;
                }):[],
                shellSignature:[
                  view?.className.replace(/\bactive\b/g,'').trim()||'',
                  header?.className||'', body?.className||'', history?.className||'',
                  chart?.className||'', breakdown?.className||'', period?.parentElement?.className||''
                ].join('|'),
                headerWidth:Math.round(headerRect?.width||0),
              };
            });
          }

          function assertStatsStructure(s){
            assert.equal(s.master,true,'Statistics master class missing from base');
            assert.equal(s.headerDirect,true,'Statistics master header is not a direct base child');
            assert.equal(s.bodyDirect,true,'Statistics master body is not a direct base child');
            assert.equal(s.heading,'By the Numbers');
            assert.equal(s.subtitle,'Because vibes are not a performance metric.');
            assert.equal(s.periodParent,true,'Period control is not directly owned by Statistics header');
            assert.equal(s.periodActive,'7d');
            assert.equal(s.primaryCount,5);
            assert.equal(s.historyCount,5);
            assert.equal(s.queueHealth,false);
            assert.equal(s.chartDirect,true);
            assert.equal(s.chartIcon,'/icons/dp/card-download.svg');
            assert.equal(s.chartHeading,'Completions');
            assert.equal(s.breakdownCount,4);
            assert.equal(s.splitCount,0);
            assert.equal(s.emoji,false);
          }

          function assertStatsVisibleGeometry(s,desktop){
            assert.equal(s.active,true,'Statistics must be active for geometry validation');
            assert(s.headerWidth>0,'Statistics header did not obtain visible geometry');
            if(desktop){
              assert.equal(s.periodRight,true,'Period control is not on the right side of visible Statistics header');
              assert.equal(new Set(s.cardTop).size,1,`Statistics breakdown cards are not one desktop row: ${s.cardTop}`);
              assert(s.titleCentered.every(Boolean),'Statistics lower-card headings are not centered');
            }
          }

          async function normal(browser,w,h){
            const desktop=w>=900;
            const p=await browser.newPage();
            await p.setViewport({width:w,height:h});
            await p.setCacheEnabled(false);
            const requests=[],errors=[],badStatic=[];
            p.on('request',r=>{try{requests.push(new URL(r.url()).pathname)}catch(_){}});
            p.on('pageerror',e=>errors.push(String(e)));
            p.on('response',r=>{try{const u=new URL(r.url());if(u.hostname==='127.0.0.1'&&r.status()>=400&&!u.pathname.startsWith('/api/'))badStatic.push(`${r.status()} ${u.pathname}`)}catch(_){}});
            await p.goto(base,{waitUntil:'domcontentloaded',timeout:20000});
            await p.waitForFunction(()=>typeof window.nav==='function'&&window.DPIcons&&document.querySelector('#view-dashboard.active'),{timeout:12000});
            for(const x of retired)assert(!requests.includes(x),`retired runtime requested: ${x}`);

            const beforeStats=await statsStructure(p);
            assertStatsStructure(beforeStats);
            assert.equal(beforeStats.active,false,'Statistics should not be active at initial Dashboard paint');
            const initial=await p.evaluate(()=>({settings:document.getElementById('view-settings').innerHTML.trim(),help:document.getElementById('view-help').innerHTML.trim(),legacyRender:typeof window.renderSettings,legacyForm:typeof window.getFormSettings,legacyTab:typeof window.switchSettingsTab,settingsOwner:typeof window.DPSettingsPage,statsOwner:typeof window.DPStatisticsLifecycle,helpOwner:typeof window.DPHelpPage}));
            assert.equal(initial.settings,'');assert.equal(initial.help,'');
            assert.equal(initial.legacyRender,'undefined');assert.equal(initial.legacyForm,'undefined');assert.equal(initial.legacyTab,'undefined');
            assert.equal(initial.settingsOwner,'object');assert.equal(initial.statsOwner,'object');assert.equal(initial.helpOwner,'object');

            for(const v of views){
              if(v==='settings'||v==='help')await p.evaluate(v=>{const root=document.getElementById(`view-${v}`);window.__first=null;window.__obs?.disconnect?.();window.__obs=new MutationObserver(()=>{if(!window.__first&&root.innerHTML.trim())window.__first=root.innerHTML});window.__obs.observe(root,{childList:true,subtree:true})},v);
              await p.evaluate(v=>document.querySelector(`.nav-item[data-view="${v}"]`).click(),v);
              await p.waitForFunction(v=>document.getElementById(`view-${v}`)?.classList.contains('active'),{timeout:12000},v);
              await p.waitForFunction((v,t)=>document.getElementById('page-title').textContent.trim()===t,{timeout:12000},v,titles[v]);
              if(v==='stats'){
                await p.waitForFunction(()=>document.getElementById('daily-chart')?._ci,{timeout:12000});
                await sleep(150);
                const afterStats=await statsStructure(p);
                assertStatsStructure(afterStats);
                assertStatsVisibleGeometry(afterStats,desktop);
                assert.equal(afterStats.shellSignature,beforeStats.shellSignature,'Statistics runtime changed canonical shell ownership');
                assert.equal(afterStats.chartSubtitle,'Completed downloads in the last 7 days.');
                await p.screenshot({path:`/tmp/dp-browser-evidence/statistics-${w}x${h}.png`,fullPage:true});
              }
              if(v==='settings'||v==='help'){
                await p.waitForFunction(v=>document.getElementById(`view-${v}`).children.length>0,{timeout:12000},v);
                if(v==='settings')await p.waitForFunction(()=>{const s=document.getElementById('view-settings')?.innerHTML||'';return /Sources &amp; Providers|Sources & Providers/.test(s)&&/Authentication/.test(s)},{timeout:12000});
                await sleep(100);
                const r=await p.evaluate(v=>({first:window.__first||'',final:document.getElementById(`view-${v}`).innerHTML}),v);
                assert(r.first.length>0,`${v} did not render directly`);
                if(v==='settings'){
                  assert(/dp-settings-loading|Sources &amp; Providers|Sources & Providers/.test(r.first),'Settings first mutation is not its canonical loading/final owner');
                  assert(/Sources &amp; Providers|Sources & Providers/.test(r.final),'Settings final render is not canonical Settings');
                  assert(/Authentication/.test(r.final),'Settings final render lacks Authentication');
                }else{
                  assert(/Field Manual/.test(r.first),'Help first render is not canonical Help');
                  assert(/dp-help-master-card/.test(r.first),'Help first render lacks canonical master card');
                }
              }
            }

            await p.evaluate(()=>document.querySelector('.dp-help-tab[data-tab="license"]').click());
            await p.waitForFunction(()=>!document.querySelector('#dp-help-panel-license')?.hidden,{timeout:5000});
            const scale=await p.$eval('#dp-help-tab-license img',i=>({src:i.getAttribute('src'),complete:i.complete,width:i.naturalWidth}));
            assert.equal(scale.src,'/icons/lucide/scale.svg');assert(scale.complete&&scale.width>0,'License scale icon failed');
            await p.evaluate(()=>document.querySelector('.dp-help-local-document-button[data-legal-document="gpl"]').click());
            await p.waitForSelector('.dp-help-legal-dialog',{timeout:5000});
            await p.waitForFunction(()=>{const b=document.querySelector('.dp-help-legal-document');return b&&b.textContent.trim()&&b.textContent.trim()!=='Loading…'},{timeout:10000});
            const modal=await p.evaluate(()=>({title:document.getElementById('dp-help-legal-dialog-title')?.textContent||'',body:document.querySelector('.dp-help-legal-document')?.textContent||''}));
            assert(/GNU General Public License|GPL/i.test(modal.title));assert(modal.body.length>500,'Bundled GPL document did not render');
            await p.keyboard.press('Escape');await p.waitForFunction(()=>!document.querySelector('.dp-help-legal-dialog'),{timeout:5000});

            for(let c=0;c<3;c++)for(const v of views.slice().reverse())await p.evaluate(v=>document.querySelector(`.nav-item[data-view="${v}"]`).click(),v);
            await p.evaluate(()=>document.querySelector('.nav-item[data-view="dashboard"]').click());
            await p.waitForFunction(()=>document.querySelector('#view-dashboard.active'),{timeout:12000});
            const light=await p.evaluate(()=>document.body.classList.contains('light'));
            await p.evaluate(()=>document.getElementById('theme-toggle').click());await p.waitForFunction(x=>document.body.classList.contains('light')!==x,{timeout:5000},light);
            await p.evaluate(()=>document.getElementById('theme-toggle').click());await p.waitForFunction(x=>document.body.classList.contains('light')===x,{timeout:5000},light);
            await p.reload({waitUntil:'domcontentloaded',timeout:20000});
            await p.waitForFunction(()=>document.querySelector('#view-dashboard.active'),{timeout:12000});
            const reloadStats=await statsStructure(p);
            assertStatsStructure(reloadStats);
            assert.equal(reloadStats.active,false);
            const reload=await p.evaluate(()=>({settings:document.getElementById('view-settings').innerHTML.trim(),help:document.getElementById('view-help').innerHTML.trim()}));
            assert.equal(reload.settings,'');assert.equal(reload.help,'');
            for(const x of retired)assert(!requests.includes(x),`retired runtime requested after reload: ${x}`);
            assert.deepEqual(errors,[],`browser errors: ${errors.join(' | ')}`);assert.deepEqual(badStatic,[],`bad static responses: ${badStatic.join(' | ')}`);
            await p.close();
          }

          async function missingOwner(browser,target,path){
            const p=await browser.newPage();await p.setRequestInterception(true);
            p.on('request',r=>new URL(r.url()).pathname===path?r.abort():r.continue());
            await p.goto(base,{waitUntil:'domcontentloaded',timeout:20000});await p.waitForFunction(()=>typeof window.nav==='function',{timeout:12000});
            assert.equal(await p.$eval(`#view-${target}`,e=>e.innerHTML.trim()),'');
            await p.evaluate(v=>document.querySelector(`.nav-item[data-view="${v}"]`).click(),target);await sleep(350);
            const s=await p.evaluate(v=>({active:document.getElementById(`view-${v}`).classList.contains('active'),html:document.getElementById(`view-${v}`).innerHTML.trim()}),target);
            assert.equal(s.active,true);assert.equal(s.html,'',`missing ${target} owner exposed fallback substrate`);await p.close();
          }

          async function optionalAsset(browser){
            const p=await browser.newPage();await p.setRequestInterception(true);
            p.on('request',r=>new URL(r.url()).pathname==='/icons/dp/sidebar-wave-accent.svg'?r.abort():r.continue());
            await p.goto(base,{waitUntil:'domcontentloaded',timeout:20000});await p.waitForFunction(()=>document.querySelector('#view-dashboard.active')&&window.DPIcons,{timeout:12000});
            const s=await statsStructure(p);assertStatsStructure(s);assert.equal(s.active,false);
            await p.evaluate(()=>document.querySelector('.nav-item[data-view="help"]').click());await p.waitForFunction(()=>document.querySelector('#view-help.active')?.children.length>0,{timeout:12000});await p.close();
          }

          (async()=>{const b=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});try{await normal(b,1440,1000);await normal(b,390,844);await missingOwner(b,'settings','/ui-settings-page.js');await missingOwner(b,'help','/ui-help-page.js');await optionalAsset(b);console.log('BROWSER_QUALIFICATION=PASS')}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-evidence-v1111-063fd4a-r2
          path: /tmp/dp-browser-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Container logs on failure
        if: failure()
        run: docker logs dp-browser-063fd4a || true

  package:
    name: Package local installable image after corrected browser pass
    needs: browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 063fd4a89ef627abfd37f8e15dc2764e4c00010e
          fetch-depth: 1
      - name: Prove exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$CANDIDATE_VERSION"
      - name: Build exact qualified image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --build-arg APP_VERSION="$CANDIDATE_VERSION" --build-arg VCS_REF="$CANDIDATE_SHA" --tag debridpulse:1.0.11.1-local-063fd4a .
      - name: Export installable artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p local-build
          docker save debridpulse:1.0.11.1-local-063fd4a | gzip -9 > local-build/debridpulse-v1.0.11.1-063fd4a-docker-image.tar.gz
          (cd local-build && sha256sum debridpulse-v1.0.11.1-063fd4a-docker-image.tar.gz > SHA256SUMS)
          cat > local-build/INSTALL.txt <<'EOF'
          DebridPulse v1.0.11.1 local qualification build
          Candidate: 063fd4a89ef627abfd37f8e15dc2764e4c00010e

          Load:
            gunzip -c debridpulse-v1.0.11.1-063fd4a-docker-image.tar.gz | docker load

          Image name after load:
            debridpulse:1.0.11.1-local-063fd4a

          This is a local-test artifact only. It has not been promoted or published as a release image.
          EOF
          printf '%s\n' "$CANDIDATE_SHA" > local-build/CANDIDATE_SHA
          sha256sum local-build/debridpulse-v1.0.11.1-063fd4a-docker-image.tar.gz
      - name: Upload local installable build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: debridpulse-v1.0.11.1-063fd4a-local-build
          path: local-build/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
