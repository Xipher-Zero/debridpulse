name: Frontend Canonicalize Phase 2

on:
  push:
    branches: [1.0.11-hotfix1]
    paths:
      - scripts/_canonicalize_phase2.py
      - scripts/_canonicalize_phase2_resume.py
      - scripts/_canonicalize_phase2_repair.py
      - .github/workflows/frontend-canonicalize-phase2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.0.11-hotfix1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply guarded canonicalization
        id: apply
        shell: bash
        run: |
          set +e
          python scripts/_canonicalize_phase2.py > phase2-transform.log 2>&1
          first=$?
          code=$first
          if [ "$first" -ne 0 ]; then
            echo "phase2 checkpoint exit=$first; resuming from validated checkpoint" >> phase2-transform.log
            python scripts/_canonicalize_phase2_resume.py >> phase2-transform.log 2>&1
            second=$?
            code=$second
            if [ "$second" -ne 0 ]; then
              echo "phase2 resume exit=$second; applying targeted lifecycle repair" >> phase2-transform.log
              python scripts/_canonicalize_phase2_repair.py >> phase2-transform.log 2>&1
              code=$?
            fi
          fi
          git diff > phase2-working-tree.diff
          grep -R -n "MutationObserver" frontend/static/ui-runtime.js frontend/static/ui-downloads-runtime.js frontend/static/ui-settings-*.js > phase2-observers.txt 2>&1
          cat phase2-transform.log
          cat phase2-observers.txt || true
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload transformation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-transform-diagnostics
          path: |
            phase2-transform.log
            phase2-working-tree.diff
            phase2-observers.txt
            frontend/static/ui-settings-authentication-oidc.js
            frontend/static/ui-settings-authentication.js
            frontend/static/ui-settings-authentication-polish.js
            frontend/static/ui-settings-authentication-callback.js
            frontend/static/ui-settings-maintenance-wipe.js
            frontend/static/ui-settings-notifications.js
            frontend/static/ui-downloads-runtime.js
          if-no-files-found: error

      - name: Require successful transformation
        if: steps.apply.outputs.exit_code != '0'
        run: exit 1

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find frontend/static -maxdepth 1 -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Python compile
        run: python -m compileall -q backend

      - name: Diff integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(cat VERSION)" = "1.0.11.1"
          ! grep -R "MutationObserver" frontend/static/ui-runtime.js frontend/static/ui-downloads-runtime.js frontend/static/ui-settings-*.js
          ! grep -q "ui-page-finalization" frontend/static/index.html frontend/static/style-v11.css
          ! grep -q "ui-help-chrome.js" frontend/static/index.html
          ! grep -q "ui-shell-runtime.js" frontend/static/index.html

      - name: Commit canonical tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/_canonicalize_phase2.py scripts/_canonicalize_phase2_resume.py scripts/_canonicalize_phase2_repair.py .github/workflows/frontend-canonicalize-phase2.yml phase2-transform.log phase2-working-tree.diff phase2-observers.txt
          git config user.name "Xipher-Zero"
          git config user.email "68665477+Xipher-Zero@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: remove late frontend correction scaffolding"
          git push origin HEAD:1.0.11-hotfix1
