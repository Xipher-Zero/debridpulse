name: Remediation Group C

on:
  push:
    branches: [1.0.12]
    paths:
      - .github/workflows/remediation-group-c.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 1.0.12
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply DB-001 remediation
        run: python .github/remediation-group-c.py
      - name: Correct runtime-state restart test
        run: python .github/remediation-group-c-testfix.py
      - name: Install test and static dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt ruff
      - name: Generate and verify exact predecessor fixture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dp-v1111 /tmp/predecessor.db /tmp/rebuilt-predecessor.db
          git worktree add --detach /tmp/dp-v1111 f06742847f60b5924e4584714055d0a311172158
          DB_PATH=/tmp/predecessor.db PYTHONPATH=/tmp/dp-v1111/backend python - <<'PY'
          import asyncio
          import db.database as database
          asyncio.run(database.init_db())
          PY
          mkdir -p backend/tests/fixtures
          python - <<'PY'
          import re
          import sqlite3
          from pathlib import Path

          sha = "f06742847f60b5924e4584714055d0a311172158"
          source = Path("/tmp/predecessor.db")
          fixture = Path("backend/tests/fixtures/v1.0.11.1.sql")
          rebuilt = Path("/tmp/rebuilt-predecessor.db")
          with sqlite3.connect(source) as conn:
              dump = "\n".join(conn.iterdump())
          fixture.write_text(
              "-- DebridPulse v1.0.11.1 exact predecessor schema fixture\n"
              f"-- source commit: {sha}\n" + dump + "\n"
          )
          with sqlite3.connect(rebuilt) as conn:
              conn.executescript(fixture.read_text())

          def signature(path):
              with sqlite3.connect(path) as conn:
                  objects = []
                  for kind, name, table, sql in conn.execute(
                      "SELECT type,name,tbl_name,sql FROM sqlite_master "
                      "WHERE name NOT LIKE 'sqlite_%' ORDER BY type,name"
                  ):
                      normalized = re.sub(r"\\s+", " ", sql or "").strip()
                      objects.append((kind, name, table, normalized))
                  columns = {}
                  tables = [row[0] for row in conn.execute(
                      "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name"
                  )]
                  for table in tables:
                      columns[table] = tuple(conn.execute(f"PRAGMA table_info({table})"))
                  return objects, columns

          original_objects, original_columns = signature(source)
          rebuilt_objects, rebuilt_columns = signature(rebuilt)
          assert [o[:3] for o in original_objects] == [o[:3] for o in rebuilt_objects]
          assert original_columns == rebuilt_columns
          print(f"Verified exact predecessor fixture from {sha}: {len(original_columns)} tables")
          PY
      - name: Prove actual predecessor upgrades from pristine backup
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/predecessor.db /tmp/actual-upgrade.db
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          path = Path('/tmp/actual-upgrade.db')
          with sqlite3.connect(path) as conn:
              conn.execute("INSERT INTO torrents(id,hash,name,status) VALUES(901,?,?,?)", ('9'*40, 'actual-predecessor-row', 'downloading'))
              conn.commit()
          PY
          PYTHONPATH=backend python - <<'PY'
          import asyncio
          import sqlite3
          from pathlib import Path
          import db.database as database
          from db.migrations import v112

          path = Path('/tmp/actual-upgrade.db')
          database.DB_PATH = path
          report = asyncio.run(v112.migrate(external_executor=False))
          assert report['migrated'] is True
          backup = Path(report['backup'])
          assert backup.exists()
          with sqlite3.connect(backup) as conn:
              names = {row[0] for row in conn.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              assert 'transfer_requests' not in names
              assert 'route_attempt_provenance' not in names
              assert 'schema_migrations' not in names
              assert conn.execute("SELECT name FROM torrents WHERE id=901").fetchone() == ('actual-predecessor-row',)
          with sqlite3.connect(path) as conn:
              assert conn.execute("SELECT name FROM torrents WHERE id=901").fetchone() == ('actual-predecessor-row',)
              assert conn.execute("SELECT 1 FROM schema_migrations WHERE version='1.0.12'").fetchone() == (1,)
              assert conn.execute("PRAGMA foreign_key_check").fetchall() == []
          print('Actual v1.0.11.1 predecessor upgrade and pristine backup verified')
          PY
      - name: Focused database ownership and surrounding regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=backend pytest -q backend/tests/test_database_* backend/tests/test_universal_migration.py
      - name: Compile and undefined-name checks
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python -m compileall -q db transfers main.py tests/test_database_migration_ownership.py tests/test_universal_migration.py
          ruff check db transfers main.py tests/test_database_migration_ownership.py tests/test_universal_migration.py --select F
          cd ..
          git diff --check
          if grep -q 'await init_db()' backend/main.py; then
            echo 'main.py still invokes generic init_db before migration' >&2
            exit 1
          fi
      - name: Commit coherent DB-001 remediation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/remediation-group-c.py .github/remediation-group-c-testfix.py .github/workflows/remediation-group-c.yml
          git config user.name debridpulse-remediation
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: establish migration-first database ownership'
          git push origin HEAD:1.0.12
