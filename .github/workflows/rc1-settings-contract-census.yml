name: RC1 Settings Contract Census Patch

on:
  push:
    branches:
      - 'audit/v1.0.11-settings-contract-census'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Apply patch
        run: |
          sed -i "s/Stats Snapshot Interval (minutes)/Statistics Snapshot Interval (minutes)/g; s/Stats Snapshot Retention (days)/Keep Statistics Snapshots (days)/g" .github/rc1-settings-contract-census.py
          python .github/rc1-settings-contract-census.py

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install test dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt

      - name: Run targeted contract tests
        run: |
          cd backend
          python -m pytest tests/test_settings_runtime_contract_census.py -v --tb=short

      - name: Check patched JavaScript syntax
        run: node --check frontend/static/ui-settings-page.js

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rc1-settings-contract-census.yml .github/rc1-settings-contract-census.py
          git add backend/services/manager_v2.py frontend/static/ui-settings-page.js backend/tests/test_settings_runtime_contract_census.py
          git diff --cached --check
          git commit -m 'audit: align exposed settings runtime contracts'
          git push origin HEAD:audit/v1.0.11-settings-contract-census
