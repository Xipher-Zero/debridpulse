# Artifact-centric runtime/container security gate for DebridPulse.
# This workflow never rebuilds the candidate. It waits for Fork Image to publish
# the immutable SHA artifact, resolves the exact manifest/child digests, and
# scans those registry objects directly.
name: Container Security

on:
  push:
    branches:
      - main
      - '1.0.11'
      - '1.0.12'
      - 'staging/**'
      - 'audit/**'
    tags:
      - 'v*'
      - 'internal-v*'
  schedule:
    - cron: '31 19 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: ghcr.io/xipher-zero/debridpulse
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SECURITY_PREDICATE_TYPE: https://github.com/Xipher-Zero/debridpulse/attestations/container-security/v1

jobs:
  identity:
    name: Resolve immutable candidate identity
    runs-on: ubuntu-latest
    outputs:
      manifest_digest: ${{ steps.identity.outputs.manifest_digest }}
      amd64_digest: ${{ steps.identity.outputs.amd64_digest }}
      arm64_digest: ${{ steps.identity.outputs.arm64_digest }}
      source_ref: ${{ steps.identity.outputs.source_ref }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for and resolve exact published candidate
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          source_ref="${IMAGE_NAME}:sha-${GITHUB_SHA:0:7}"
          manifest_digest=""
          manifest_json=""

          for attempt in $(seq 1 120); do
            if inspect="$(docker buildx imagetools inspect "$source_ref" 2>/dev/null)" && \
               manifest_json="$(docker buildx imagetools inspect --raw "$source_ref" 2>/dev/null)"; then
              manifest_digest="$(awk '/^Digest:/ {print $2; exit}' <<< "$inspect")"
              if [[ "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                break
              fi
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "Immutable candidate was not published for exact SHA $GITHUB_SHA"
              exit 1
            fi
            sleep 5
          done

          amd64_digest="$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest][0] // empty' <<< "$manifest_json")"
          arm64_digest="$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest][0] // empty' <<< "$manifest_json")"
          for value in "$amd64_digest" "$arm64_digest"; do
            if [[ ! "$value" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Published manifest is missing an expected linux platform child: $value"
              exit 1
            fi
          done
          if [ "$amd64_digest" = "$arm64_digest" ]; then
            echo "Platform child digests unexpectedly collapse to the same artifact"
            exit 1
          fi

          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "manifest_digest=$manifest_digest" >> "$GITHUB_OUTPUT"
          echo "amd64_digest=$amd64_digest" >> "$GITHUB_OUTPUT"
          echo "arm64_digest=$arm64_digest" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest_digest"
          echo "linux/amd64=$amd64_digest"
          echo "linux/arm64=$arm64_digest"

  scan:
    name: Scan exact ${{ matrix.arch }} child
    needs: identity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      CHILD_DIGEST: ${{ matrix.arch == 'amd64' && needs.identity.outputs.amd64_digest || needs.identity.outputs.arm64_digest }}
    steps:
      - name: Report exact-child runtime vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}@${{ env.CHILD_DIGEST }}'
          format: 'table'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: false
          exit-code: '0'

      - name: Block fixable high or critical vulnerabilities on exact child
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}@${{ env.CHILD_DIGEST }}'
          format: 'table'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  evidence:
    name: Attest exact candidate security qualification
    needs: [identity, scan]
    runs-on: ubuntu-latest
    steps:
      - name: Write machine-verifiable security predicate
        shell: bash
        env:
          MANIFEST_DIGEST: ${{ needs.identity.outputs.manifest_digest }}
          AMD64_DIGEST: ${{ needs.identity.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ needs.identity.outputs.arm64_digest }}
        run: |
          set -euo pipefail
          jq -n \
            --arg commit_sha "$GITHUB_SHA" \
            --arg manifest_digest "$MANIFEST_DIGEST" \
            --arg amd64_digest "$AMD64_DIGEST" \
            --arg arm64_digest "$ARM64_DIGEST" \
            '{
              schema_version: 1,
              commit_sha: $commit_sha,
              manifest_digest: $manifest_digest,
              platforms: {
                "linux/amd64": {digest: $amd64_digest, vulnerability_gate: "passed"},
                "linux/arm64": {digest: $arm64_digest, vulnerability_gate: "passed"}
              },
              policy: "no fixable HIGH or CRITICAL runtime vulnerabilities",
              result: "success"
            }' > container-security-evidence.json
          cat container-security-evidence.json

      - name: Upload security evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-security-${{ github.sha }}
          path: container-security-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Log in to GHCR for attestation publication
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign security qualification for exact OCI manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.identity.outputs.manifest_digest }}
          predicate-type: ${{ env.SECURITY_PREDICATE_TYPE }}
          predicate-path: container-security-evidence.json
          push-to-registry: true
          create-storage-record: false
