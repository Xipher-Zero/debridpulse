name: Canonical Dashboard Sparkline Curve Repair

on:
  push:
    branches:
      - 'staging/v1.0.11.1-sparkline-curve'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: staging/v1.0.11.1-sparkline-curve
          fetch-depth: 0

      - name: Replace generic Bezier smoothing with canonical monotone interpolation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('frontend/static/app.js')
          app = app_path.read_text()

          replacement = r'''function dashboardMonotoneSparkPath(points) {
            if (!Array.isArray(points) || points.length < 2) return '';
            const fmt = value => Number(value).toFixed(2);
            const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
            const intervals = points.slice(0, -1).map((point, index) => {
              const next = points[index + 1];
              const width = next.x - point.x;
              return {
                width,
                slope: width > 0 ? (next.y - point.y) / width : 0
              };
            });
            const tangents = new Array(points.length).fill(0);

            if (points.length === 2) {
              tangents[0] = intervals[0].slope;
              tangents[1] = intervals[0].slope;
            } else {
              const endpointTangent = (nearWidth, farWidth, nearSlope, farSlope) => {
                if (!nearWidth || !farWidth || !nearSlope) return 0;
                let tangent = (
                  ((2 * nearWidth + farWidth) * nearSlope) -
                  (nearWidth * farSlope)
                ) / (nearWidth + farWidth);
                if (tangent * nearSlope <= 0) return 0;
                if (
                  nearSlope * farSlope < 0 &&
                  Math.abs(tangent) > Math.abs(3 * nearSlope)
                ) {
                  tangent = 3 * nearSlope;
                }
                return tangent;
              };

              tangents[0] = endpointTangent(
                intervals[0].width,
                intervals[1].width,
                intervals[0].slope,
                intervals[1].slope
              );
              tangents[tangents.length - 1] = endpointTangent(
                intervals[intervals.length - 1].width,
                intervals[intervals.length - 2].width,
                intervals[intervals.length - 1].slope,
                intervals[intervals.length - 2].slope
              );

              for (let index = 1; index < points.length - 1; index++) {
                const left = intervals[index - 1];
                const right = intervals[index];
                if (!left.slope || !right.slope || left.slope * right.slope <= 0) {
                  tangents[index] = 0;
                  continue;
                }
                const leftWeight = 2 * right.width + left.width;
                const rightWeight = right.width + 2 * left.width;
                tangents[index] = (leftWeight + rightWeight) / (
                  (leftWeight / left.slope) + (rightWeight / right.slope)
                );
              }
            }

            let path = `M ${fmt(points[0].x)} ${fmt(points[0].y)}`;
            for (let index = 0; index < points.length - 1; index++) {
              const start = points[index];
              const end = points[index + 1];
              const width = end.x - start.x;
              const lowY = Math.min(start.y, end.y);
              const highY = Math.max(start.y, end.y);
              const cp1 = {
                x: start.x + width / 3,
                y: clamp(start.y + (tangents[index] * width) / 3, lowY, highY)
              };
              const cp2 = {
                x: end.x - width / 3,
                y: clamp(end.y - (tangents[index + 1] * width) / 3, lowY, highY)
              };
              path += ` C ${fmt(cp1.x)} ${fmt(cp1.y)}, ${fmt(cp2.x)} ${fmt(cp2.y)}, ${fmt(end.x)} ${fmt(end.y)}`;
            }
            return path;
          }'''

          pattern = re.compile(
              r"function dashboardSmoothSparkPath\(points\) \{.*?\n\}\n\nfunction renderDashboardMetricHistory",
              re.S,
          )
          updated, count = pattern.subn(
              replacement + '\n\nfunction renderDashboardMetricHistory',
              app,
          )
          if count != 1:
              raise SystemExit(f'expected one canonical sparkline function, found {count}')
          updated = updated.replace(
              'const path = dashboardSmoothSparkPath(coordinates);',
              'const path = dashboardMonotoneSparkPath(coordinates);',
          )
          if updated.count('dashboardMonotoneSparkPath') != 2:
              raise SystemExit('canonical monotone sparkline owner/call mismatch')
          if 'dashboardSmoothSparkPath' in updated or 'const tension = 0.82;' in updated:
              raise SystemExit('legacy generic Bezier sparkline surface remains')
          app_path.write_text(updated)

          test_path = Path('backend/tests/test_dashboard_sparkline_canonical_owner.py')
          test = test_path.read_text()
          test = test.replace(
              'assert "dashboardSmoothSparkPath" in app',
              'assert "dashboardMonotoneSparkPath" in app',
          )
          marker = '    assert " C ${fmt(cp1.x)}" in app\n'
          additions = (
              '    assert "const intervals = points.slice(0, -1).map" in app\n'
              '    assert "left.slope * right.slope <= 0" in app\n'
              '    assert "endpointTangent" in app\n'
              '    assert "clamp(start.y + (tangents[index] * width) / 3" in app\n'
              '    assert "dashboardSmoothSparkPath" not in app\n'
              '    assert "const tension = 0.82;" not in app\n'
          )
          if additions.strip() not in test:
              if marker not in test:
                  raise SystemExit('sparkline architecture test marker not found')
              test = test.replace(marker, marker + additions)
          test_path.write_text(test)
          PY

      - name: Validate canonical curve implementation
        run: |
          node --check frontend/static/app.js
          cd backend
          python -m pytest tests/test_dashboard_sparkline_canonical_owner.py -v --tb=short

      - name: Commit source correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/static/app.js backend/tests/test_dashboard_sparkline_canonical_owner.py
          git diff --cached --check
          git commit -m 'fix: use monotone Dashboard sparkline interpolation [sparkline-canonical]'
          git push origin HEAD:staging/v1.0.11.1-sparkline-curve
