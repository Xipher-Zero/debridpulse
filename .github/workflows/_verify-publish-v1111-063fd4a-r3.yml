name: Verify canonical Downloads material and publish v1.0.11.1 063fd4a

on:
  push:
    branches:
      - audit/v1.0.11.1-063fd4a-qualification
    paths:
      - .github/workflows/_verify-publish-v1111-063fd4a-r3.yml

permissions:
  contents: read
  packages: write

env:
  CANDIDATE_SHA: 063fd4a89ef627abfd37f8e15dc2764e4c00010e
  CANDIDATE_VERSION: 1.0.11.1
  IMAGE: ghcr.io/xipher-zero/debridpulse:sha-063fd4a
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 063fd4a89ef627abfd37f8e15dc2764e4c00010e
          fetch-depth: 1
      - name: Prove exact candidate and source ownership
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$CANDIDATE_VERSION"
          test -z "$(git status --porcelain)"
          grep -q 'class="dp-card dp-downloads-bulk-card dp-downloads-bulk-integrated" id="bulk-bar"' frontend/static/index.html
          ! grep -q 'class="bulk-bar ' frontend/static/index.html
          ! grep -q '^\.bulk-bar' frontend/static/style.css
      - name: Build and start exact candidate
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --build-arg APP_VERSION="$CANDIDATE_VERSION" --build-arg VCS_REF="$CANDIDATE_SHA" -t local/dp:063fd4a .
          test "$(docker image inspect local/dp:063fd4a --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$CANDIDATE_SHA"
          test "$(docker image inspect local/dp:063fd4a --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$CANDIDATE_VERSION"
          docker run -d --name dp-063fd4a -p 127.0.0.1:18080:8080 -e PUID=12345 -e PGID=12345 -e CONFIG_PATH=/app/config/config.json -e DB_PATH=/app/data/debridpulse.db local/dp:063fd4a
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/api/health >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:18080/api/health
      - name: Install browser harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dp-browser
          npm --prefix /tmp/dp-browser init -y >/dev/null 2>&1
          npm --prefix /tmp/dp-browser install --no-save puppeteer-core@24.16.0 >/dev/null
      - name: Verify Downloads bulk row uses canonical card/header material
        shell: bash
        env:
          NODE_PATH: /tmp/dp-browser/node_modules
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          node <<'NODE'
          const assert=require('node:assert/strict');
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const b=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const p=await b.newPage();
              await p.setViewport({width:1600,height:950});
              await p.goto('http://127.0.0.1:18080/',{waitUntil:'domcontentloaded',timeout:20000});
              await p.waitForFunction(()=>typeof window.nav==='function'&&document.querySelector('#view-dashboard.active'),{timeout:12000});
              await p.evaluate(()=>document.querySelector('.nav-item[data-view="torrents"]').click());
              await p.waitForFunction(()=>document.querySelector('#view-torrents.active'),{timeout:12000});
              const r=await p.evaluate(()=>{
                const bar=document.getElementById('bulk-bar');
                bar.classList.add('visible');
                document.getElementById('bulk-count').textContent='6 Selected';
                const toolbar=bar.querySelector('.dp-downloads-bulk-toolbar');
                const realHeader=document.querySelector('#view-torrents > .card > .card-header');
                const probe=document.createElement('div');
                probe.className='dp-card';
                probe.style.cssText='position:fixed;left:-9999px;top:-9999px;width:20px;height:20px';
                document.body.appendChild(probe);
                const s=e=>{const c=getComputedStyle(e);return {bg:c.backgroundImage,bgc:c.backgroundColor,display:c.display}};
                const out={barClass:bar.className,bar:s(bar),probe:s(probe),toolbar:s(toolbar),header:s(realHeader),accent:getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()};
                probe.remove();
                return out;
              });
              console.log(JSON.stringify(r,null,2));
              assert.match(r.barClass,/\bdp-card\b/);
              assert.doesNotMatch(r.barClass,/\bbulk-bar\b/);
              assert.equal(r.bar.display,'block');
              assert.equal(r.bar.bg,r.probe.bg,'bulk row is not using canonical dp-card material');
              assert.equal(r.bar.bgc,r.probe.bgc,'bulk row background color differs from canonical dp-card');
              assert.equal(r.toolbar.bg,r.header.bg,'bulk toolbar is not using canonical card-header material');
              assert.equal(r.toolbar.bgc,r.header.bgc,'bulk toolbar background color differs from canonical card-header');
              assert(!r.bar.bg.includes('rgb(180, 92, 255)'),'legacy accent material leaked into bulk row');
              await p.screenshot({path:'/tmp/downloads-bulk-063fd4a.png',fullPage:true});
              console.log('DOWNLOADS_BULK_MATERIAL=PASS');
            }finally{await b.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload browser evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: downloads-bulk-material-063fd4a
          path: /tmp/downloads-bulk-063fd4a.png
          if-no-files-found: error
      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Push SHA-only local-test image
        shell: bash
        run: |
          set -euo pipefail
          docker tag local/dp:063fd4a "$IMAGE"
          docker push "$IMAGE" | tee /tmp/push.log
          grep -E 'digest: sha256:[0-9a-f]{64}' /tmp/push.log
      - name: Pull back and verify published image
        shell: bash
        run: |
          set -euo pipefail
          docker image rm "$IMAGE"
          docker pull "$IMAGE" | tee /tmp/pull.log
          ACTUAL_REV="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          ACTUAL_VERSION="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          DIGEST="$(docker image inspect "$IMAGE" --format '{{ index .RepoDigests 0 }}')"
          echo "Published image:  $IMAGE"
          echo "Published digest: $DIGEST"
          echo "Image revision:   $ACTUAL_REV"
          echo "Image version:    $ACTUAL_VERSION"
          test "$ACTUAL_REV" = "$CANDIDATE_SHA"
          test "$ACTUAL_VERSION" = "$CANDIDATE_VERSION"
      - name: Container logs on failure
        if: failure()
        run: docker logs dp-063fd4a || true
