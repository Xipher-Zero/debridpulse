name: Publish qualified v1.0.11.1 sparkline test image f067428

on:
  push:
    branches:
      - audit/v1.0.11.1-dashboard-sparklines
    paths:
      - .github/workflows/_publish-v1111-sparklines-f067428.yml

permissions:
  contents: read
  packages: write

env:
  CANDIDATE_SHA: f06742847f60b5924e4584714055d0a311172158
  CANDIDATE_VERSION: 1.0.11.1
  IMAGE: ghcr.io/xipher-zero/debridpulse:sha-f067428
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable qualified candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: f06742847f60b5924e4584714055d0a311172158
          fetch-depth: 2

      - name: Prove exact qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$CANDIDATE_VERSION"
          test -z "$(git status --porcelain)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable SHA test image
        id: publish
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=DebridPulse: AllDebrid + aria2 Download Manager
            org.opencontainers.image.description=AllDebrid-backed download manager for direct links, magnets, and torrent files via aria2
            org.opencontainers.image.version=${{ env.CANDIDATE_VERSION }}
            org.opencontainers.image.source=https://github.com/Xipher-Zero/debridpulse
            org.opencontainers.image.revision=${{ env.CANDIDATE_SHA }}
            org.opencontainers.image.licenses=GPL-2.0-or-later
          build-args: |
            APP_VERSION=${{ env.CANDIDATE_VERSION }}
            VCS_REF=${{ env.CANDIDATE_SHA }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull back and verify published image
        shell: bash
        run: |
          set -euo pipefail
          echo "PUBLISHED_DIGEST=${{ steps.publish.outputs.digest }}"
          docker pull "$IMAGE"
          actual_revision="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          actual_version="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          echo "EXPECTED_REVISION=$CANDIDATE_SHA"
          echo "ACTUAL_REVISION=$actual_revision"
          echo "EXPECTED_VERSION=$CANDIDATE_VERSION"
          echo "ACTUAL_VERSION=$actual_version"
          test "$actual_revision" = "$CANDIDATE_SHA"
          test "$actual_version" = "$CANDIDATE_VERSION"
          docker buildx imagetools inspect "$IMAGE"
