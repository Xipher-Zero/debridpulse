name: Canonicalize Frontend Runtime and CSS

on:
  push:
    branches: [1.0.11-hotfix1]
    paths:
      - scripts/_canonicalize_frontend_runtime_css.py
      - scripts/_repair_canonical_contract_tests.py
      - .github/workflows/_canonicalize-runtime-css.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 1.0.11-hotfix1
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff
      - name: Apply guarded canonicalization
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_canonicalize_frontend_runtime_css.py
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/_repair_canonical_contract_tests.py')
          source = path.read_text(encoding='utf-8')
          start_marker = '    replace_once(\n        "backend/tests/test_extraction_lifecycle.py",\n'
          end_marker = '    write(\n        "backend/tests/test_operator_title_state.py",\n'
          start = source.find(start_marker)
          end = source.find(end_marker, start if start >= 0 else 0)
          if start < 0 or end < 0 or source.count(start_marker) != 2 or source.count(end_marker) != 1:
              raise RuntimeError('extraction contract migration span did not match exactly')
          replacement = '''    sub_once(
              "backend/tests/test_extraction_lifecycle.py",
              r"def test_extraction_state_is_persisted_and_operator_visible\\(\\):\\n.*?\\n(?=@pytest\\.mark\\.asyncio)",
              ''' + "'''" + '''def test_extraction_state_is_persisted_and_operator_visible():
              root = Path(__file__).resolve().parents[2]
              database_source = (root / "backend/db/database.py").read_text()
              routes_source = (root / "backend/api/routes.py").read_text()
              app_source = (root / "frontend/static/app.js").read_text()
              icon_source = (root / "frontend/static/operator-title.js").read_text()
              assert "extraction_status" in database_source
              assert '("extraction_error", "TEXT")' in database_source
              assert "active_operations" in routes_source
              assert "extracting_count" in routes_source
              assert "extracting: {icon: 'packageOpen', label: 'Extracting'" in icon_source
              assert "t.extraction_status" in app_source


              ''' + "'''" + ''',
          )

          '''
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')
          PY
          python scripts/_repair_canonical_contract_tests.py
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/test_extraction_lifecycle.py')
          source = path.read_text(encoding='utf-8')
          bad = '    @pytest.mark.asyncio\nasync def test_extraction_events_form_durable_operator_audit'
          good = '@pytest.mark.asyncio\nasync def test_extraction_events_form_durable_operator_audit'
          if source.count(bad) != 1:
              raise RuntimeError(f'extraction decorator boundary count was {source.count(bad)}, expected 1')
          path.write_text(source.replace(bad, good, 1), encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          for name in (
              'app.js',
              'operator-title.js',
              'ui-error-semantics.js',
              'ui-accessibility-runtime.js',
          ):
              path = Path('frontend/static') / name
              lines = path.read_text(encoding='utf-8').splitlines()
              path.write_text('\n'.join(line.rstrip() for line in lines).rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check
      - name: Frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find frontend/static -maxdepth 1 -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Python undefined names
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          ruff check api auth core db services main.py --select F821,F822,F823
      - name: Full regression suite
        id: regression
        shell: bash
        run: |
          set -o pipefail
          cd backend
          python -m pytest tests/ -q --tb=short 2>&1 | tee ../v1111-pytest-failures.txt
      - name: Persist regression diagnostics
        if: failure() && steps.regression.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Xipher-Zero"
          git config user.email "68665477+Xipher-Zero@users.noreply.github.com"
          git add v1111-pytest-failures.txt
          git commit -m "chore: capture canonicalization test failures"
          git push origin HEAD:1.0.11-hotfix1
      - name: Python compile
        run: python -m compileall -q backend
      - name: Architecture integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "1.0.11.1"
          for retired in ui-dashboard-batch5.css ui-dashboard-polish.css ui-dashboard-polish-final.css ui-dashboard-final.css ui-settings-authentication-oidc.css; do
            test ! -e "frontend/static/$retired"
            ! grep -q "$retired" frontend/static/style-v11.css
          done
          ! grep -q 'window.nav =' frontend/static/ui-accessibility-runtime.js
          test "$(grep -o 'new MutationObserver' frontend/static/ui-accessibility-runtime.js | wc -l)" = 3
          ! grep -q 'MutationObserver' frontend/static/ui-error-semantics.js
          ! grep -Eq 'window\.(progress|badge|toast|updateOperatorTitle|updateThemeToggle|toggleTheme)[[:space:]]*=' frontend/static/operator-title.js frontend/static/ui-error-semantics.js frontend/static/ui-accessibility-runtime.js
          grep -q 'dp-terminal-error-progress' frontend/static/app.js
          grep -q 'window.DPIcons.statusBadge' frontend/static/app.js
          grep -q 'window.DPIcons.toast' frontend/static/app.js
          grep -q 'window.DPIcons.renderThemeGlyph' frontend/static/app.js
      - name: Commit canonical runtime ownership
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            scripts/_canonicalize_frontend_runtime_css.py \
            scripts/_repair_canonical_contract_tests.py \
            .github/workflows/_canonicalize-runtime-css.yml \
            .github/workflows/_audit-v1111-frontend.yml \
            v1111-frontend-census.txt \
            v1111-pytest-failures.txt
          git config user.name "Xipher-Zero"
          git config user.email "68665477+Xipher-Zero@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "refactor: canonicalize frontend runtime ownership"
          git push origin HEAD:1.0.11-hotfix1
