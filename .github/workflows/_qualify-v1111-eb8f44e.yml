name: Qualify v1.0.11.1 eb8f44e

on:
  push:
    branches:
      - audit/v1.0.11.1-f500727-qualification
    paths:
      - .github/workflows/_qualify-v1111-eb8f44e.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

env:
  CANDIDATE_SHA: eb8f44e239d1930fd93aaec70c1f055011d30dff
  CANDIDATE_VERSION: 1.0.11.1
  IMAGE_TAG: local/debridpulse:qual-eb8f44e
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  source-gates:
    name: Source, regression, dependency, and static security gates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: eb8f44e239d1930fd93aaec70c1f055011d30dff
          fetch-depth: 2

      - name: Prove exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$CANDIDATE_VERSION"
          test -z "$(git status --porcelain)"
          echo "QUALIFYING_SHA=$(git rev-parse HEAD)"

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install test and audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff pip-audit bandit

      - name: Diff and frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          find frontend/static -maxdepth 1 -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Python undefined-name and compile gates
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          ruff check api auth core db services main.py --select F821,F822,F823
          cd ..
          python -m compileall -q backend

      - name: Frontend architecture integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "1.0.11.1"
          for retired in \
            ui-presentation-loader.js \
            ui-shell-runtime.js \
            ui-page-finalization.js \
            ui-page-finalization.css \
            ui-visual-behavior-fixes.js \
            ui-help-chrome.js \
            ui-settings-auth-resilience.js \
            ui-settings-authentication.js \
            ui-settings-authentication-polish.js \
            ui-settings-authentication-polish.css \
            ui-settings-authentication-oidc.js \
            ui-settings-authentication-callback.js \
            ui-dashboard-batch5.css \
            ui-dashboard-polish.css \
            ui-dashboard-polish-final.css \
            ui-dashboard-final.css \
            ui-settings-authentication-oidc.css; do
            test ! -e "frontend/static/$retired"
            if grep -q "$retired" frontend/static/index.html frontend/static/style-v11.css 2>/dev/null; then
              echo "Retired frontend layer still referenced: $retired"
              exit 1
            fi
          done
          ! grep -q 'window.nav =' frontend/static/ui-accessibility-runtime.js
          test "$(grep -o 'new MutationObserver' frontend/static/ui-accessibility-runtime.js | wc -l)" = 3
          ! grep -q 'MutationObserver' frontend/static/ui-error-semantics.js
          ! grep -Eq 'window\.(progress|badge|toast|updateOperatorTitle|updateThemeToggle|toggleTheme)[[:space:]]*=' \
            frontend/static/operator-title.js \
            frontend/static/ui-error-semantics.js \
            frontend/static/ui-accessibility-runtime.js
          grep -q 'dp-terminal-error-progress' frontend/static/app.js
          grep -q 'window.DPIcons.statusBadge' frontend/static/app.js
          grep -q 'window.DPIcons.toast' frontend/static/app.js
          grep -q 'window.DPIcons.renderThemeGlyph' frontend/static/app.js
          grep -q 'window.DPSettingsPage = Object.freeze({load});' frontend/static/ui-settings-page.js
          grep -q 'window.DPStatisticsLifecycle = Object.freeze({load: loadDetailedStats, install});' frontend/static/ui-statistics.js
          grep -q 'window.DPHelpPage = Object.freeze({load, activateTab});' frontend/static/ui-help-page.js
          grep -q "debridpulse:help-rendered" frontend/static/ui-help-page.js
          grep -q "debridpulse:help-rendered" frontend/static/ui-help-license-documents.js
          ! grep -q 'DOMContentLoaded' frontend/static/ui-help-page.js
          ! grep -q 'DOMContentLoaded' frontend/static/ui-help-license-documents.js
          ! grep -q 'requestAnimationFrame' frontend/static/ui-help-license-documents.js
          test -f frontend/static/icons/lucide/scale.svg
          test ! -e scripts/_canonicalize_frontend_runtime_css.py
          test ! -e scripts/_repair_canonical_contract_tests.py
          test ! -e .github/workflows/_canonicalize-runtime-css.yml
          test ! -e .github/workflows/_audit-v1111-frontend.yml
          test ! -e v1111-frontend-census.txt
          test ! -e v1111-pytest-failures.txt

      - name: Full regression suite from zero
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python -m pytest tests/ -q --tb=short --junitxml=/tmp/debridpulse-pytest.xml
          python - <<'PY'
          from xml.etree import ElementTree as ET
          root = ET.parse('/tmp/debridpulse-pytest.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
          tests = sum(int(s.attrib.get('tests', 0)) for s in suites)
          failures = sum(int(s.attrib.get('failures', 0)) for s in suites)
          errors = sum(int(s.attrib.get('errors', 0)) for s in suites)
          skipped = sum(int(s.attrib.get('skipped', 0)) for s in suites)
          print(f'PYTEST_TOTAL={tests} FAILURES={failures} ERRORS={errors} SKIPPED={skipped}')
          if failures or errors:
              raise SystemExit(1)
          PY

      - name: pip-audit
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          pip-audit -r requirements.txt --progress-spinner off

      - name: Bandit high-confidence high-severity gate
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt

  container-runtime-browser:
    name: Release image, runtime, non-root, browser, and vulnerability gates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: eb8f44e239d1930fd93aaec70c1f055011d30dff
          fetch-depth: 2

      - name: Prove exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$CANDIDATE_VERSION"
          test -z "$(git status --porcelain)"
          echo "QUALIFYING_SHA=$(git rev-parse HEAD)"

      - name: Build release image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            --build-arg APP_VERSION="$CANDIDATE_VERSION" \
            --build-arg VCS_REF="$CANDIDATE_SHA" \
            --tag "$IMAGE_TAG" \
            .

      - name: Root startup and release smoke
        shell: bash
        run: |
          set -euo pipefail
          container_name="debridpulse-qual-root"
          cleanup() { docker rm -f "$container_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container_name" \
            --env PUID=0 --env PGID=0 \
            --env CONFIG_PATH=/app/config/config.json \
            --env DB_PATH=/app/data/debridpulse.db \
            "$IMAGE_TAG"
          healthy=0
          for _ in $(seq 1 30); do
            if docker exec "$container_name" curl --fail --silent --show-error http://127.0.0.1:8080/api/health >/dev/null; then healthy=1; break; fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_name")" != "true" ]; then break; fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then docker inspect "$container_name" || true; docker logs "$container_name" || true; exit 1; fi
          health_payload="$(docker exec "$container_name" curl --fail --silent --show-error http://127.0.0.1:8080/api/health)"
          test "$(jq -r '.version // empty' <<< "$health_payload")" = "$CANDIDATE_VERSION"
          docker exec "$container_name" test -f /app/LICENSE
          docker exec "$container_name" test -f /app/NOTICE
          docker exec "$container_name" test -f /app/licenses/python-runtime.json
          docker exec "$container_name" test -f /app/licenses/bencode2-MIT.txt
          docker exec "$container_name" grep -q "Chris Moore" /app/NOTICE
          docker exec "$container_name" grep -q '^VERSION_CODENAME=trixie$' /etc/os-release
          docker exec "$container_name" dpkg-query -W 7zip 7zip-rar aria2 gosu
          docker exec "$container_name" test -f /usr/share/doc/7zip-rar/copyright
          docker exec "$container_name" test -f /usr/share/doc/7zip-rar/unRarLicense.txt
          docker exec "$container_name" sh -c '7z i | grep -qi rar'
          docker exec "$container_name" sh -c '
            set -eu
            rm -rf /tmp/debridpulse-7z-smoke
            mkdir -p /tmp/debridpulse-7z-smoke/input /tmp/debridpulse-7z-smoke/output
            printf "debridpulse-7z-smoke\n" > /tmp/debridpulse-7z-smoke/input/payload.txt
            (cd /tmp/debridpulse-7z-smoke/input && 7z a -bd -y ../archive.7z payload.txt)
            7z x -bd -y /tmp/debridpulse-7z-smoke/archive.7z -o/tmp/debridpulse-7z-smoke/output
            grep -q "debridpulse-7z-smoke" /tmp/debridpulse-7z-smoke/output/payload.txt
          '

      - name: Non-root runtime and writable-path validation
        shell: bash
        run: |
          set -euo pipefail
          container_name="debridpulse-qual-nonroot"
          cleanup() { docker rm -f "$container_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container_name" \
            --env PUID=12345 --env PGID=12345 \
            --env CONFIG_PATH=/app/config/config.json \
            --env DB_PATH=/app/data/debridpulse.db \
            "$IMAGE_TAG"
          healthy=0
          for _ in $(seq 1 30); do
            if docker exec "$container_name" curl --fail --silent --show-error http://127.0.0.1:8080/api/health >/dev/null; then healthy=1; break; fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_name")" != "true" ]; then break; fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then docker logs "$container_name" || true; exit 1; fi
          test "$(docker exec "$container_name" awk '/^Uid:/{print $2}' /proc/1/status)" = "12345"
          test "$(docker exec "$container_name" awk '/^Gid:/{print $2}' /proc/1/status)" = "12345"
          docker exec --user 12345:12345 "$container_name" sh -c '
            set -eu
            touch /app/data/.nonroot-smoke /app/config/.nonroot-smoke /download/.nonroot-smoke
            rm -f /app/data/.nonroot-smoke /app/config/.nonroot-smoke /download/.nonroot-smoke
          '

      - name: Report runtime vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: local/debridpulse:qual-eb8f44e
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: false
          exit-code: '0'

      - name: Block fixable high or critical runtime vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: local/debridpulse:qual-eb8f44e
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Browser cold-load, direct render, navigation, theme, responsive, dialogs, and failure paths
        shell: bash
        run: |
          set -euo pipefail
          container_name="debridpulse-qual-browser"
          cleanup() { docker rm -f "$container_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container_name" \
            --publish 127.0.0.1:18080:8080 \
            --env PUID=12345 --env PGID=12345 \
            --env CONFIG_PATH=/app/config/config.json \
            --env DB_PATH=/app/data/debridpulse.db \
            "$IMAGE_TAG"
          healthy=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/api/health >/dev/null; then healthy=1; break; fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then docker logs "$container_name" || true; exit 1; fi
          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome_bin"
          rm -rf /tmp/dp-browser && mkdir -p /tmp/dp-browser
          npm --prefix /tmp/dp-browser init -y >/dev/null 2>&1
          npm --prefix /tmp/dp-browser install --no-save puppeteer-core@24.16.0 >/dev/null
          export CHROME_BIN="$chrome_bin"
          export NODE_PATH=/tmp/dp-browser/node_modules
          node <<'NODE'
          const assert = require('node:assert/strict');
          const puppeteer = require('puppeteer-core');
          const base = 'http://127.0.0.1:18080/';
          const retired = [
            '/ui-presentation-loader.js','/ui-shell-runtime.js','/ui-page-finalization.js',
            '/ui-visual-behavior-fixes.js','/ui-help-chrome.js','/ui-settings-auth-resilience.js',
            '/ui-settings-authentication.js','/ui-settings-authentication-polish.js',
            '/ui-settings-authentication-oidc.js','/ui-settings-authentication-callback.js'
          ];
          const views = ['dashboard','torrents','events','stats','settings','help'];
          const expectedTitles = {dashboard:'Dashboard',torrents:'Downloads',events:'Event Log',stats:'Statistics',settings:'Settings',help:'Help & License'};
          const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function normalPass(browser, width, height) {
            const page = await browser.newPage();
            await page.setViewport({width,height});
            await page.setCacheEnabled(false);
            const requests = [];
            const pageErrors = [];
            const badStaticResponses = [];
            page.on('request', req => { try { requests.push(new URL(req.url()).pathname); } catch (_) {} });
            page.on('pageerror', err => pageErrors.push(String(err)));
            page.on('response', res => {
              try {
                const u = new URL(res.url());
                if (u.hostname === '127.0.0.1' && res.status() >= 400 && !u.pathname.startsWith('/api/')) {
                  badStaticResponses.push(`${res.status()} ${u.pathname}`);
                }
              } catch (_) {}
            });

            await page.goto(base,{waitUntil:'domcontentloaded',timeout:20000});
            await page.waitForFunction(() => typeof window.nav === 'function' && window.DPIcons && document.querySelector('#view-dashboard.active'),{timeout:12000});
            for (const path of retired) assert(!requests.includes(path),`retired runtime requested: ${path}`);
            const initial = await page.evaluate(() => ({
              settings: document.getElementById('view-settings').innerHTML.trim(),
              help: document.getElementById('view-help').innerHTML.trim(),
              renderSettings: typeof window.renderSettings,
              getFormSettings: typeof window.getFormSettings,
              switchSettingsTab: typeof window.switchSettingsTab,
              dpSettings: typeof window.DPSettingsPage,
              dpStatistics: typeof window.DPStatisticsLifecycle,
              dpHelp: typeof window.DPHelpPage
            }));
            assert.equal(initial.settings,'');
            assert.equal(initial.help,'');
            assert.equal(initial.renderSettings,'undefined');
            assert.equal(initial.getFormSettings,'undefined');
            assert.equal(initial.switchSettingsTab,'undefined');
            assert.equal(initial.dpSettings,'object');
            assert.equal(initial.dpStatistics,'object');
            assert.equal(initial.dpHelp,'object');

            for (const view of views) {
              if (view === 'settings' || view === 'help') {
                await page.evaluate(v => {
                  const root = document.getElementById(`view-${v}`);
                  window.__dpFirstCanonicalRender = null;
                  window.__dpRenderObserver?.disconnect?.();
                  window.__dpRenderObserver = new MutationObserver(() => {
                    if (!window.__dpFirstCanonicalRender && root.innerHTML.trim()) window.__dpFirstCanonicalRender = root.innerHTML;
                  });
                  window.__dpRenderObserver.observe(root,{childList:true,subtree:true});
                },view);
              }
              await page.evaluate(v => document.querySelector(`.nav-item[data-view="${v}"]`).click(),view);
              await page.waitForFunction(v => document.getElementById(`view-${v}`)?.classList.contains('active'),{timeout:12000},view);
              await page.waitForFunction((v,title) => document.getElementById('page-title').textContent.trim() === title,{timeout:12000},view,expectedTitles[view]);
              if (view === 'settings' || view === 'help') {
                await page.waitForFunction(v => document.getElementById(`view-${v}`).children.length > 0,{timeout:12000},view);
                await delay(120);
                const render = await page.evaluate(v => ({first:window.__dpFirstCanonicalRender || '',final:document.getElementById(`view-${v}`).innerHTML}),view);
                assert(render.first.length > 0,`${view} did not render directly`);
                if (view === 'settings') {
                  assert(/Sources &amp; Providers|Sources & Providers/.test(render.first),'Settings first render is not canonical Settings');
                  assert(/Authentication/.test(render.first),'Settings first render lacks canonical Authentication section');
                } else {
                  assert(/Field Manual/.test(render.first),'Help first render is not canonical Help');
                  assert(/dp-help-master-card/.test(render.first),'Help first render lacks canonical master card');
                }
              }
            }

            await page.evaluate(() => document.querySelector('.dp-help-tab[data-tab="license"]').click());
            await page.waitForFunction(() => !document.querySelector('#dp-help-panel-license')?.hidden,{timeout:5000});
            const scaleState = await page.$eval('#dp-help-tab-license img', img => ({complete:img.complete,width:img.naturalWidth,src:img.getAttribute('src')}));
            assert.equal(scaleState.src,'/icons/lucide/scale.svg');
            assert(scaleState.complete && scaleState.width > 0,'License scale icon failed to load');
            await page.evaluate(() => document.querySelector('.dp-help-local-document-button[data-legal-document="gpl"]').click());
            await page.waitForSelector('.dp-help-legal-dialog',{timeout:5000});
            await page.waitForFunction(() => {
              const body = document.querySelector('.dp-help-legal-document');
              return body && body.textContent.trim() && body.textContent.trim() !== 'Loading…';
            },{timeout:10000});
            const modal = await page.evaluate(() => ({
              title: document.getElementById('dp-help-legal-dialog-title')?.textContent || '',
              body: document.querySelector('.dp-help-legal-document')?.textContent || ''
            }));
            assert(/GNU General Public License|GPL/i.test(modal.title));
            assert(modal.body.length > 500,'Bundled GPL document did not render');
            await page.keyboard.press('Escape');
            await page.waitForFunction(() => !document.querySelector('.dp-help-legal-dialog'),{timeout:5000});

            for (let cycle=0; cycle<3; cycle++) {
              for (const view of views.slice().reverse()) await page.evaluate(v => document.querySelector(`.nav-item[data-view="${v}"]`).click(),view);
            }
            await page.evaluate(() => document.querySelector('.nav-item[data-view="dashboard"]').click());
            await page.waitForFunction(() => document.querySelector('#view-dashboard.active'),{timeout:12000});
            const beforeLight = await page.evaluate(() => document.body.classList.contains('light'));
            await page.evaluate(() => document.getElementById('theme-toggle').click());
            await page.waitForFunction(before => document.body.classList.contains('light') !== before,{timeout:5000},beforeLight);
            await page.evaluate(() => document.getElementById('theme-toggle').click());
            await page.waitForFunction(before => document.body.classList.contains('light') === before,{timeout:5000},beforeLight);

            await page.reload({waitUntil:'domcontentloaded',timeout:20000});
            await page.waitForFunction(() => document.querySelector('#view-dashboard.active'),{timeout:12000});
            const afterReload = await page.evaluate(() => ({settings:document.getElementById('view-settings').innerHTML.trim(),help:document.getElementById('view-help').innerHTML.trim()}));
            assert.equal(afterReload.settings,'');
            assert.equal(afterReload.help,'');
            for (const path of retired) assert(!requests.includes(path),`retired runtime requested after reload: ${path}`);
            assert.deepEqual(pageErrors,[],`browser page errors: ${pageErrors.join(' | ')}`);
            assert.deepEqual(badStaticResponses,[],`bad local static responses: ${badStaticResponses.join(' | ')}`);
            await page.close();
          }

          async function requiredOwnerFailurePass(browser, target, blockedPath) {
            const page = await browser.newPage();
            await page.setRequestInterception(true);
            page.on('request', req => {
              const path = new URL(req.url()).pathname;
              if (path === blockedPath) req.abort(); else req.continue();
            });
            await page.goto(base,{waitUntil:'domcontentloaded',timeout:20000});
            await page.waitForFunction(() => typeof window.nav === 'function',{timeout:12000});
            const before = await page.$eval(`#view-${target}`,el => el.innerHTML.trim());
            assert.equal(before,'');
            await page.evaluate(v => document.querySelector(`.nav-item[data-view="${v}"]`).click(),target);
            await delay(350);
            const state = await page.evaluate(v => ({active:document.getElementById(`view-${v}`).classList.contains('active'),html:document.getElementById(`view-${v}`).innerHTML.trim()}),target);
            assert.equal(state.active,true);
            assert.equal(state.html,'',`missing canonical ${target} owner exposed a fallback substrate`);
            await page.close();
          }

          async function decorativeAssetFailurePass(browser) {
            const page = await browser.newPage();
            await page.setRequestInterception(true);
            page.on('request', req => {
              const path = new URL(req.url()).pathname;
              if (path === '/icons/dp/sidebar-wave-accent.svg') req.abort(); else req.continue();
            });
            await page.goto(base,{waitUntil:'domcontentloaded',timeout:20000});
            await page.waitForFunction(() => document.querySelector('#view-dashboard.active') && window.DPIcons,{timeout:12000});
            await page.evaluate(() => document.querySelector('.nav-item[data-view="help"]').click());
            await page.waitForFunction(() => document.querySelector('#view-help.active')?.children.length > 0,{timeout:12000});
            await page.close();
          }

          (async () => {
            const browser = await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try {
              await normalPass(browser,1440,1000);
              await normalPass(browser,390,844);
              await requiredOwnerFailurePass(browser,'settings','/ui-settings-page.js');
              await requiredOwnerFailurePass(browser,'help','/ui-help-page.js');
              await decorativeAssetFailurePass(browser);
              console.log('BROWSER_QUALIFICATION=PASS');
            } finally { await browser.close(); }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: eb8f44e239d1930fd93aaec70c1f055011d30dff
          fetch-depth: 2
      - name: Prove exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$CANDIDATE_VERSION"
          test -z "$(git status --porcelain)"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  package-local-image:
    name: Package local installable image
    needs: [source-gates, container-runtime-browser, codeql]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: eb8f44e239d1930fd93aaec70c1f055011d30dff
          fetch-depth: 1
      - name: Prove exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$CANDIDATE_VERSION"
      - name: Build exact qualified image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            --build-arg APP_VERSION="$CANDIDATE_VERSION" \
            --build-arg VCS_REF="$CANDIDATE_SHA" \
            --tag debridpulse:1.0.11.1-local-eb8f44e \
            .
      - name: Export installable artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p local-build
          docker save debridpulse:1.0.11.1-local-eb8f44e | gzip -9 > local-build/debridpulse-v1.0.11.1-eb8f44e-docker-image.tar.gz
          sha256sum local-build/debridpulse-v1.0.11.1-eb8f44e-docker-image.tar.gz > local-build/SHA256SUMS
          cat > local-build/INSTALL.txt <<'EOF'
          DebridPulse v1.0.11.1 local qualification build
          Candidate: eb8f44e239d1930fd93aaec70c1f055011d30dff

          Load:
            gunzip -c debridpulse-v1.0.11.1-eb8f44e-docker-image.tar.gz | docker load

          Image name after load:
            debridpulse:1.0.11.1-local-eb8f44e

          This is a local-test artifact only. It has not been promoted or published as a release image.
          EOF
          printf '%s\n' "$CANDIDATE_SHA" > local-build/CANDIDATE_SHA
          ls -lh local-build
      - name: Upload local installable build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: debridpulse-v1.0.11.1-eb8f44e-local-build
          path: local-build/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
