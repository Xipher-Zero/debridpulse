name: Remediation Group B

on:
  push:
    branches:
      - '1.0.12'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 1.0.12
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply STATE-001 remediation
        run: python .github/remediation-group-b.py
      - name: Install test and static dependencies
        run: |
          pip install -r backend/requirements-dev.txt
          pip install ruff
      - name: Focused cancellation race and lifecycle regression tests
        working-directory: backend
        run: python -m pytest tests/test_audit_remediation_state.py tests/test_universal_lifecycle.py tests/test_item11_multi_provider_slice.py -q --tb=short
      - name: Compile and undefined-name checks
        working-directory: backend
        run: |
          python -m compileall -q transfers application tests/test_audit_remediation_state.py tests/test_universal_lifecycle.py
          ruff check transfers application tests/test_audit_remediation_state.py tests/test_universal_lifecycle.py --select F821,F822,F823
      - name: Commit coherent STATE-001 remediation
        run: |
          git config user.name debridpulse-remediation
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/remediation-group-b.yml .github/remediation-group-b.py
          git add backend/transfers/engine.py backend/transfers/repository.py backend/application/service.py backend/tests/test_audit_remediation_state.py
          git diff --cached --check
          git commit -m 'fix: serialize cancellation against reconciliation'
          git push origin HEAD:1.0.12
