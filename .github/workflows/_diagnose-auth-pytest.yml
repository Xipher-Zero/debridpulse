name: Diagnose Auth Canonicalization Pytest

on:
  push:
    branches: [1.0.11-hotfix1]
    paths:
      - .github/workflows/_diagnose-auth-pytest.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 1.0.11-hotfix1
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          pip install -r requirements-dev.txt

      - name: Apply exact auth ownership transformation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_canonicalize_settings_auth.py
          python scripts/_canonicalize_v1111_followup.py

      - name: Run full backend suite and capture exact failures
        id: pytest
        shell: bash
        run: |
          set +e
          cd backend
          python -m pytest tests/ -v --tb=short > ../auth-pytest-diagnostics.txt 2>&1
          code=$?
          cat ../auth-pytest-diagnostics.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write diagnostics summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Auth canonicalization pytest diagnostics'
            echo
            echo '```text'
            tail -n 220 auth-pytest-diagnostics.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auth-pytest-diagnostics
          path: auth-pytest-diagnostics.txt
          if-no-files-found: error

      - name: Preserve failing status
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1
