name: Second-Pass UIARCH-003 Remediation

on:
  push:
    branches: ['1.0.12']
    paths:
      - '.github/remediation_uiarch003.py'
      - '.github/workflows/remediation-uiarch003.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: debridpulse-uiarch003:${{ github.sha }}
  DP_BASE_URL: http://127.0.0.1:8080

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply canonical Settings spacing remediation
        run: python .github/remediation_uiarch003.py
      - name: Install focused backend test dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run Settings architecture regressions
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_settings_download_engine_spacing.py \
            tests/test_settings_download_engine_ui.py \
            tests/test_settings_architecture_ui.py \
            tests/test_ui_responsiveness.py
      - name: Build exact patched candidate
        run: |
          set -euo pipefail
          docker build \
            --build-arg APP_VERSION="$(cat VERSION)" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            -t "$IMAGE" .
          docker run -d --name dp-uiarch003 -p 127.0.0.1:8080:8080 "$IMAGE"
          ready=0
          for _ in $(seq 1 90); do
            if curl -fsS "$DP_BASE_URL/api/health" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs dp-uiarch003 || true
            exit 1
          fi
      - name: Install and audit locked browser dependencies
        working-directory: frontend/browser
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Run Download Engine browser contract
        working-directory: frontend/browser
        run: npx playwright test settings-download-engine-spacing.spec.js --config=playwright.config.js
      - name: Static and diff checks
        run: |
          set -euo pipefail
          node --check frontend/browser/settings-download-engine-spacing.spec.js
          test ! -e frontend/static/ui-settings-download-engine-spacing.css
          ! grep -R "ui-settings-download-engine-spacing.css" frontend/static backend/tests/test_settings_download_engine_spacing.py
          git diff --check
      - name: Commit coherent UIARCH-003 correction
        run: |
          set -euo pipefail
          rm -rf frontend/browser/node_modules frontend/browser/test-results frontend/browser/playwright-report
          rm .github/remediation_uiarch003.py
          rm .github/workflows/remediation-uiarch003.yml
          git config user.name debridpulse-remediation
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: fold download engine spacing into canonical settings css'
          git push origin HEAD:1.0.12
      - name: Show candidate logs on failure
        if: failure()
        run: docker logs dp-uiarch003 || true
      - name: Stop candidate
        if: always()
        run: docker rm -f dp-uiarch003 >/dev/null 2>&1 || true
