name: Explicit Applicability Fixture Remediation

on:
  push:
    branches: [1.0.12]
    paths:
      - '.github/workflows/remediation-explicit-applicability-fixtures.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Migrate provider fixtures to explicit applicability
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              source = p.read_text(encoding='utf-8')
              if source.count(old) != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {source.count(old)}')
              p.write_text(source.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'backend/tests/fake_integrations.py',
              'from transfers.models import (\n',
              'from transfers.applicability import ProviderApplicability\nfrom transfers.models import (\n',
              'fake integrations applicability import',
          )
          replace_once(
              'backend/tests/fake_integrations.py',
              '        self.release = None\n\n    def candidate(',
              '        self.release = None\n\n    @property\n    def applicability(self):\n        return ProviderApplicability()\n\n    def candidate(',
              'ParcelProvider applicability',
          )

          replace_once(
              'backend/tests/test_general_http_provider.py',
              'from transfers.errors import Category, TransferError\n',
              'from transfers.applicability import ProviderApplicability\nfrom transfers.errors import Category, TransferError\n',
              'HTTP stub applicability import',
          )
          replace_once(
              'backend/tests/test_general_http_provider.py',
              '    async def resolve(self, request):\n',
              '    @property\n    def applicability(self):\n        return ProviderApplicability(generic_schemes=frozenset({"http", "https"}))\n\n    async def resolve(self, request):\n',
              'StubHttpProvider applicability',
          )

          replace_once(
              'backend/tests/test_input_required_lifecycle.py',
              'from transfers import codec\n',
              'from transfers import codec\nfrom transfers.applicability import ProviderApplicability\n',
              'input lifecycle applicability import',
          )
          replace_once(
              'backend/tests/test_input_required_lifecycle.py',
              '        self.continuation_calls = 0\n\n    async def resolve(self, request):\n',
              '        self.continuation_calls = 0\n\n    @property\n    def applicability(self):\n        return ProviderApplicability()\n\n    async def resolve(self, request):\n',
              'AuthParcelProvider applicability',
          )
          replace_once(
              'backend/tests/test_input_required_lifecycle.py',
              '        self.descriptor = IntegrationDescriptor("static-parcel", "Static parcel", frozenset({Capability.RESOLVE}),\n                                                request_types=frozenset({"key-parcel"}))\n\n    async def resolve(self, request):\n',
              '        self.descriptor = IntegrationDescriptor("static-parcel", "Static parcel", frozenset({Capability.RESOLVE}),\n                                                request_types=frozenset({"key-parcel"}))\n\n    @property\n    def applicability(self):\n        return ProviderApplicability()\n\n    async def resolve(self, request):\n',
              'StaticProvider applicability',
          )
          replace_once(
              'backend/tests/test_input_required_lifecycle.py',
              '            self.descriptor = IntegrationDescriptor("mixed", "Mixed", frozenset({Capability.RESOLVE}),\n                                                    request_types=frozenset({"mixed"}))\n        async def resolve(self, request):\n',
              '            self.descriptor = IntegrationDescriptor("mixed", "Mixed", frozenset({Capability.RESOLVE}),\n                                                    request_types=frozenset({"mixed"}))\n\n        @property\n        def applicability(self):\n            return ProviderApplicability()\n\n        async def resolve(self, request):\n',
              'MixedProvider applicability',
          )

          replace_once(
              'backend/tests/test_input_required_acceptance.py',
              'from transfers.engine import TransferEngine\n',
              'from transfers.applicability import ProviderApplicability\nfrom transfers.engine import TransferEngine\n',
              'acceptance applicability import',
          )
          replace_once(
              'backend/tests/test_input_required_acceptance.py',
              '        self.descriptor = IntegrationDescriptor(\n            "acceptance-auth-provider",\n            "Acceptance auth provider",\n            frozenset({Capability.RESOLVE}),\n            request_types=frozenset({"acceptance-auth"}),\n        )\n\n    async def resolve(self, request):\n',
              '        self.descriptor = IntegrationDescriptor(\n            "acceptance-auth-provider",\n            "Acceptance auth provider",\n            frozenset({Capability.RESOLVE}),\n            request_types=frozenset({"acceptance-auth"}),\n        )\n\n    @property\n    def applicability(self):\n        return ProviderApplicability()\n\n    async def resolve(self, request):\n',
              'AcceptanceAuthProvider applicability',
          )
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt ruff
      - name: Focused explicit-applicability regression
        run: |
          set -uo pipefail
          status=0
          PYTHONPATH=backend pytest -q \
            backend/tests/test_applicability_explicit_contract.py \
            backend/tests/test_general_http_provider.py \
            backend/tests/test_input_required_lifecycle.py \
            backend/tests/test_input_required_acceptance.py \
            2>&1 | tee .github/explicit-applicability-fixtures-failure.txt || status=$?
          if [ "$status" -ne 0 ]; then
            git config user.name debridpulse-remediation
            git config user.email actions@users.noreply.github.com
            git add .github/explicit-applicability-fixtures-failure.txt
            git commit -m 'chore: capture explicit applicability fixture failures'
            git push origin HEAD:1.0.12
            exit "$status"
          fi
          rm -f .github/explicit-applicability-fixtures-failure.txt
      - name: Static contract
        run: |
          set -euo pipefail
          ruff check backend/tests/fake_integrations.py backend/tests/test_general_http_provider.py backend/tests/test_input_required_lifecycle.py backend/tests/test_input_required_acceptance.py
          grep -q 'def applicability' backend/tests/fake_integrations.py
          grep -q 'generic_schemes=frozenset({"http", "https"})' backend/tests/test_general_http_provider.py
          git diff --check
      - name: Commit coherent fixture migration
        run: |
          set -euo pipefail
          rm .github/workflows/remediation-explicit-applicability-fixtures.yml
          rm -f .github/explicit-applicability-fixtures-failure.txt
          git config user.name debridpulse-remediation
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'test: declare applicability on provider fixtures'
          git push origin HEAD:1.0.12
