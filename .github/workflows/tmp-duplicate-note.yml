name: Temporary duplicate note correction

on:
  push:
    branches:
      - staging/v1.0.6-mirror-hotfix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: staging/v1.0.6-mirror-hotfix
          fetch-depth: 0

      - name: Apply presentation patch
        run: |
          python tools/tmp_apply_duplicate_note.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          styles = Path('frontend/static/style.css').read_text()
          index = Path('frontend/static/index.html').read_text()
          assert '.badge-duplicate' in styles
          assert '#modal-body tr:has(.badge-duplicate)' in styles
          assert 'color: var(--text3) !important;' in styles
          assert '<link rel="stylesheet" href="/style.css?v=15">' in index
          print('duplicate-note contract OK')
          PY

      - name: Commit clean source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/tmp_apply_duplicate_note.py .github/workflows/tmp-duplicate-note.yml
          git add frontend/static/style.css frontend/static/index.html backend/tests/test_duplicate_note_style.py
          git commit -m "Subdue duplicate mirror operational notes"
          git pull --rebase origin staging/v1.0.6-mirror-hotfix
          git push origin HEAD:staging/v1.0.6-mirror-hotfix
