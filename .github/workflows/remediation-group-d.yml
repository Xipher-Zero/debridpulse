name: Remediation Group D

on:
  push:
    branches: [1.0.12]
    paths:
      - '.github/remediation-group-d.py'
      - '.github/workflows/remediation-group-d.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 1.0.12
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply UIARCH-002 remediation
        run: python .github/remediation-group-d.py
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt ruff
      - name: Provider status authority tests
        run: |
          set -euo pipefail
          PYTHONPATH=backend pytest -q \
            backend/tests/test_alldebrid_status_contract.py \
            backend/tests/test_ui_provider_status_contract.py \
            backend/tests/test_alldebrid_provider_contract.py \
            backend/tests/test_alldebrid_host_runtime.py \
            backend/tests/test_alldebrid_host_runtime_acceptance.py \
            backend/tests/test_application_runtime.py
      - name: Static and frontend checks
        run: |
          set -euo pipefail
          cd backend
          python -m compileall -q providers/alldebrid api/settings_validation_routes.py tests/test_alldebrid_status_contract.py tests/test_ui_provider_status_contract.py
          ruff check providers/alldebrid api/settings_validation_routes.py tests/test_alldebrid_status_contract.py tests/test_ui_provider_status_contract.py --select F
          cd ..
          node --check frontend/static/app.js
          git diff --check
          if grep -q "setDot('api', 'ok', 'AllDebrid: online')" frontend/static/app.js; then
            echo 'generic stats still synthesizes AllDebrid health' >&2
            exit 1
          fi
          if grep -q 'AllDebrid dot is already set by loadStats' frontend/static/app.js; then
            echo 'legacy generic-health ownership comment remains' >&2
            exit 1
          fi
      - name: Commit coherent UIARCH-002 remediation
        run: |
          set -euo pipefail
          rm .github/remediation-group-d.py .github/workflows/remediation-group-d.yml
          git config user.name debridpulse-remediation
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: make provider status truth provider-owned'
          git push origin HEAD:1.0.12
