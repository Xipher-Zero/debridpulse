name: Temporary direct-link live-path correction

on:
  push:
    branches:
      - 'staging/v1.0.6-mirror-hotfix'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@fbc6f3992d24d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: staging/v1.0.6-mirror-hotfix
          fetch-depth: 0

      - name: Apply live-path ownership correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          manager_path = Path('backend/services/manager_v2.py')
          manager = manager_path.read_text(encoding='utf-8')

          old_setup = '''            output_root = Path(cfg.download_folder)\n            reusable_source_urls: Set[str] = set()\n\n            async with get_db() as db:\n                current = await db.fetchone(\n                    "SELECT status, name FROM torrents WHERE id=?", (torrent_id,)\n                )\n                if not current or current["status"] in {"completed", "deleted"}:\n                    return\n                if normalized:\n'''
          new_setup = '''            output_root = Path(cfg.download_folder)\n            reusable_source_urls: Set[str] = set()\n            protected_live_paths: Set[str] = set()\n\n            async with get_db() as db:\n                current = await db.fetchone(\n                    "SELECT status, name FROM torrents WHERE id=?", (torrent_id,)\n                )\n                if not current or current["status"] in {"completed", "deleted"}:\n                    return\n                live_path_rows = await db.fetchall(\n                    """SELECT DISTINCT f.local_path\n                         FROM download_files f\n                         JOIN torrents t ON t.id=f.torrent_id\n                        WHERE t.status!='deleted'\n                          AND t.id!=?\n                          AND f.local_path IS NOT NULL\n                          AND f.local_path!=''""",\n                    (torrent_id,),\n                )\n                protected_live_paths = {\n                    str(row["local_path"] or "").strip().lower()\n                    for row in live_path_rows\n                    if str(row["local_path"] or "").strip()\n                }\n                if normalized:\n'''
          if manager.count(old_setup) != 1:
              raise SystemExit(f'Expected one direct-link setup block, found {manager.count(old_setup)}')
          manager = manager.replace(old_setup, new_setup, 1)

          old_reserved = '''            results = await asyncio.gather(*[_unlock(row) for row in file_rows])\n            reserved_paths: Set[str] = set()\n            succeeded = 0\n'''
          new_reserved = '''            results = await asyncio.gather(*[_unlock(row) for row in file_rows])\n            # A deleted transfer releases its old filename, but any non-deleted\n            # transfer still owns its persisted local path. This prevents stale\n            # deleted-source history from bypassing a live filename collision.\n            reserved_paths: Set[str] = set(protected_live_paths)\n            succeeded = 0\n'''
          if manager.count(old_reserved) != 1:
              raise SystemExit(f'Expected one direct-link reserved-path block, found {manager.count(old_reserved)}')
          manager = manager.replace(old_reserved, new_reserved, 1)
          manager_path.write_text(manager, encoding='utf-8')

          tests_path = Path('backend/tests/test_direct_links.py')
          tests = tests_path.read_text(encoding='utf-8')
          marker = '''        self.assertEqual(protected.name, "archive (2).zip")\n        self.assertEqual(reusable.name, "archive.zip")\n\n\nclass DelayedAllDebridTests'''
          addition = '''        self.assertEqual(protected.name, "archive (2).zip")\n        self.assertEqual(reusable.name, "archive.zip")\n\n    def test_live_owner_blocks_deleted_history_path_reuse(self):\n        manager = TorrentManager()\n        with tempfile.TemporaryDirectory() as temp_dir:\n            root = Path(temp_dir)\n            existing = root / "archive.zip"\n            existing.write_bytes(b"current transfer payload")\n            live_paths = {str(existing).lower()}\n\n            selected = manager._unique_direct_link_path(\n                root,\n                "archive.zip",\n                live_paths,\n                reuse_existing=True,\n            )\n\n        self.assertEqual(selected.name, "archive (2).zip")\n\n    def test_direct_link_preparation_seeds_non_deleted_live_paths(self):\n        repo_backend = Path(__file__).resolve().parents[1]\n        manager_source = (repo_backend / "services/manager_v2.py").read_text()\n        self.assertIn("protected_live_paths: Set[str] = set()", manager_source)\n        self.assertIn("WHERE t.status!='deleted'", manager_source)\n        self.assertIn("AND t.id!=?", manager_source)\n        self.assertIn(\n            "reserved_paths: Set[str] = set(protected_live_paths)",\n            manager_source,\n        )\n\n\nclass DelayedAllDebridTests'''
          if tests.count(marker) != 1:
              raise SystemExit(f'Expected one filename-reuse test marker, found {tests.count(marker)}')
          tests = tests.replace(marker, addition, 1)
          tests_path.write_text(tests, encoding='utf-8')
          PY

      - name: Run focused direct-link tests
        shell: bash
        run: |
          cd backend
          python -m pytest tests/test_direct_links.py tests/test_direct_link_mirror_dedupe.py tests/test_direct_link_result_authority.py -q
          python -m compileall -q services/manager_v2.py tests/test_direct_links.py

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/services/manager_v2.py backend/tests/test_direct_links.py
          git diff --cached --check
          git commit -m "Protect live direct-link output paths"
          git push origin HEAD:staging/v1.0.6-mirror-hotfix
