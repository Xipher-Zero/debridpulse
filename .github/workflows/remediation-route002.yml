name: Second-Pass ROUTE-002 Remediation

on:
  push:
    branches: ['1.0.12']
    paths:
      - '.github/remediation_route002.py'
      - '.github/workflows/remediation-route002.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply persisted route continuation remediation
        run: python .github/remediation_route002.py
      - name: Install backend test dependencies
        run: |
          cd backend
          python -m pip install -r requirements.txt -r requirements-dev.txt ruff
      - name: Run deterministic ROUTE-002 and routing/input regressions
        run: |
          set -euo pipefail
          cd backend
          python -m pytest -q \
            tests/test_second_pass_route002.py \
            tests/test_input_required_lifecycle.py \
            tests/test_url_applicability_classifier.py \
            tests/test_url_routing_matrix.py \
            tests/test_persisted_route_isolation.py
      - name: Static checks
        run: |
          set -euo pipefail
          ruff check backend/transfers/engine.py backend/transfers/registry.py backend/tests/test_second_pass_route002.py --select F821,F822,F823
          python -m compileall -q backend/transfers backend/tests/test_second_pass_route002.py
          git diff --check
      - name: Commit coherent ROUTE-002 correction
        run: |
          set -euo pipefail
          rm .github/remediation_route002.py
          rm .github/workflows/remediation-route002.yml
          git config user.name debridpulse-remediation
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: bind input continuation to persisted provider route'
          git push origin HEAD:1.0.12
