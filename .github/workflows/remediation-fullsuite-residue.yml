name: Full Suite Residue Remediation

on:
  push:
    branches:
      - '1.0.12'
    paths:
      - '.github/remediation_fullsuite_residue.py'
      - '.github/workflows/remediation-fullsuite-residue.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation trigger revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Apply residue migration
        run: python .github/remediation_fullsuite_residue.py

      - name: Install focused dependencies
        run: |
          cd backend
          python -m pip install -r requirements.txt -r requirements-dev.txt ruff

      - name: Reproduce and verify all nine former failures
        run: |
          set -euo pipefail
          cd backend
          python -m pytest -q \
            tests/test_application_runtime.py \
            tests/test_universal_contracts.py::test_routing_requires_enabled_healthy_capability_and_request_support \
            tests/test_ui_cross_page_consistency_contract.py::test_downloads_footer_has_no_separator_and_uses_shared_bottom_datum \
            tests/test_ui_cross_page_consistency_contract.py::test_provider_status_is_three_centered_shell_zones \
            tests/test_ui_release_cleanup_contract.py::test_release_docs_record_permanent_browser_validation_without_legacy_live_layers \
            tests/test_v106_audit_contracts.py::test_dashboard_has_one_mixed_submission_control

      - name: Re-run post-audit architecture contracts
        run: |
          set -euo pipefail
          cd backend
          mapfile -t cases < <(grep -Ev '^[[:space:]]*(#|$)' tests/post_audit_qualification.txt)
          python -m pytest "${cases[@]}" -q
          python -m pytest -q \
            tests/test_uiarch001_e1_ownership.py \
            tests/test_uiarch001_e2_ownership.py \
            tests/test_ui_runtime_architecture_contract.py \
            tests/test_post_audit_architecture_documentation.py

      - name: Static residue checks
        run: |
          set -euo pipefail
          ruff check backend/tests/test_application_runtime.py backend/tests/test_universal_contracts.py backend/tests/test_ui_cross_page_consistency_contract.py backend/tests/test_ui_release_cleanup_contract.py backend/tests/test_v106_audit_contracts.py --select F821,F822,F823
          node --check frontend/static/ui-accessibility-runtime.js
          test ! -e frontend/static/ui-runtime.js
          test ! -e frontend/static/ui-downloads-runtime.js
          ! grep -q 'v1.0.11 cross-cutting interaction accessibility' frontend/static/ui-accessibility-runtime.js
          ! grep -q "removeProperty('border-top')" frontend/static/ui-accessibility-runtime.js
          ! grep -q 'normalizeProviderPremiumLabel' frontend/static/ui-accessibility-runtime.js
          git diff --check

      - name: Commit coherent residue correction
        run: |
          set -euo pipefail
          rm .github/remediation_fullsuite_residue.py
          rm .github/workflows/remediation-fullsuite-residue.yml
          git config user.name debridpulse-remediation
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'test: align residual contracts with post-audit ownership'
          git push origin HEAD:1.0.12
