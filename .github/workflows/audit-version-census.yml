name: Audit Version Census

on:
  push:
    branches:
      - 'audit/v1.0.11-version-census'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Find RC identifiers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== all rc1 occurrences ==='
          grep -RIni --exclude-dir=.git --exclude='audit-version-census.yml' 'rc1' . || true
