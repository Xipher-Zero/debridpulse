name: Item 7 Native Pattern Correction

on:
  push:
    branches: ["1.0.12"]
    paths:
      - ".github/workflows/item7-native-pattern-correction.yml"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.0.12
          fetch-depth: 0
      - name: Apply provider-local pattern correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/providers/alldebrid/host_runtime.py")
          source = path.read_text(encoding="utf-8")

          old_import = "from transfers.applicability import HostClaim, HostClaimScope, ProviderApplicability\n"
          new_import = "from transfers.applicability import (\n    HostClaim, HostClaimScope, ProviderApplicability, parse_url_applicability,\n)\n"
          if old_import not in source:
              raise SystemExit("expected applicability import not found")
          source = source.replace(old_import, new_import, 1)

          snapshot_block = '''@dataclass(frozen=True)\nclass AllDebridHostSnapshot:\n    hosts: tuple[AllDebridHost, ...]\n    source: str = HOST_SOURCE\n\n    @property\n    def claims(self) -> tuple[HostClaim, ...]:\n        """Translate structural host support into neutral Item 6 facts only."""\n        domains = sorted({domain for host in self.hosts for domain in host.domains})\n        return tuple(\n            HostClaim(\n                domain,\n                HostClaimScope.EXACT,\n                frozenset({"http", "https"}),\n            )\n            for domain in domains\n        )\n\n\n'''
          request_aware = snapshot_block + '''class AllDebridRequestApplicability:\n    """Evaluate native URL regexps locally and emit only neutral Item 6 facts.\n\n    AllDebrid documents ``regexps`` as the supported-link validators. Host-only\n    claims cannot express path/query restrictions, so native expressions stay\n    here and only an already-matched request hostname crosses the boundary.\n    """\n\n    def __init__(self, snapshot: AllDebridHostSnapshot | None) -> None:\n        self._compiled = tuple(\n            (host, tuple(re.compile(pattern) for pattern in host.regexps))\n            for host in (() if snapshot is None else snapshot.hosts)\n        )\n\n    @staticmethod\n    def _within_domain(hostname: str, domain: str) -> bool:\n        return hostname == domain or hostname.endswith("." + domain)\n\n    def __call__(self, request) -> ProviderApplicability:\n        view = parse_url_applicability(request)\n        if view is None or view.scheme not in {"http", "https"}:\n            return ProviderApplicability()\n        raw = request.payload if isinstance(request.payload, str) else ""\n        if not raw or len(raw) > _MAX_PATTERN_LENGTH:\n            return ProviderApplicability()\n\n        for host, patterns in self._compiled:\n            if not any(self._within_domain(view.hostname, domain) for domain in host.domains):\n                continue\n            if not any(pattern.search(raw) for pattern in patterns):\n                continue\n            return ProviderApplicability(\n                specialized_hosts=(\n                    HostClaim(view.hostname, HostClaimScope.EXACT, frozenset({view.scheme})),\n                )\n            )\n        return ProviderApplicability()\n\n\n'''
          if snapshot_block not in source:
              raise SystemExit("expected host snapshot block not found")
          source = source.replace(snapshot_block, request_aware, 1)

          old_apply = '''    @staticmethod\n    def _apply_claims(provider, claims: tuple[HostClaim, ...]) -> None:\n        provider.applicability = ProviderApplicability(\n            specialized_hosts=tuple(claims)\n        )\n'''
          new_apply = '''    @staticmethod\n    def _apply_snapshot(provider, snapshot: AllDebridHostSnapshot | None) -> None:\n        claims = snapshot.claims if snapshot is not None else ()\n        provider.applicability = ProviderApplicability(\n            specialized_hosts=tuple(claims)\n        )\n        provider.applicability_for = AllDebridRequestApplicability(snapshot)\n'''
          if old_apply not in source:
              raise SystemExit("expected applicability publication block not found")
          source = source.replace(old_apply, new_apply, 1)
          source = source.replace("self._apply_claims(provider, ())", "self._apply_snapshot(provider, None)")
          source = source.replace("self._apply_claims(provider, snapshot.claims)", "self._apply_snapshot(provider, snapshot)")

          if "_apply_claims(" in source:
              raise SystemExit("legacy host-only publication call remains")
          path.write_text(source, encoding="utf-8")

          doc = Path("docs/architecture/ALLDEBRID_HOST_RUNTIME.md")
          text = doc.read_text(encoding="utf-8")
          section = '''\n## Native regexp applicability and the neutral contract gap\n\nAllDebrid documents `regexps` as validators for supported URLs. A host-only claim cannot safely represent those path-sensitive native semantics: flattening `example.com/path-shape` to an unconditional `example.com` claim can suppress the generic HTTP provider for URLs AllDebrid does not actually support.\n\nItem 7 therefore uses the provider-neutral `RequestApplicabilitySource` contract only where a provider must interpret validated native semantics that the static host claim cannot express. AllDebrid executes its own cached native regexps locally and returns a normal `ProviderApplicability` containing only the exact hostname/scheme that already matched. The registry and classifier never receive, persist, parse, or execute AllDebrid regex syntax. Domain-boundary checks are applied before a native regexp result can become a neutral claim, preventing substring lookalikes. This path is in-memory and performs no network I/O; maintenance remains the only host-inventory refresh path.\n'''
          if "## Native regexp applicability and the neutral contract gap" not in text:
              doc.write_text(text.rstrip() + "\n" + section, encoding="utf-8")
          PY
          python -m py_compile backend/providers/alldebrid/host_runtime.py backend/transfers/contracts.py backend/transfers/registry.py
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/providers/alldebrid/host_runtime.py docs/architecture/ALLDEBRID_HOST_RUNTIME.md
          git diff --cached --check
          git commit -m "item7: interpret native host patterns inside AllDebrid"
          git push origin HEAD:1.0.12
