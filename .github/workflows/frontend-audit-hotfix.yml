name: Frontend canonicalization audit

on:
  push:
    branches: ['1.0.11-hotfix1']
    paths: ['.github/workflows/frontend-audit-hotfix.yml']

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install tests
        run: cd backend && pip install -r requirements-dev.txt
      - name: Ownership debt inventory
        run: |
          echo '=== MutationObserver ==='
          grep -RIn --include='*.js' 'MutationObserver' frontend/static || true
          echo '=== window/global replacement suspects ==='
          grep -RIn --include='*.js' -E 'window\.(load|render|set|toast|confirm|api|[A-Za-z0-9_]+)[A-Za-z0-9_]*[[:space:]]*=' frontend/static || true
          echo '=== historical file identities ==='
          find frontend/static -maxdepth 1 -type f | grep -E '(batch|polish|finalization|resilience|fixes|completion)' || true
          echo '=== loader references ==='
          grep -RIn 'ui-presentation-loader' frontend backend docs || true
      - name: JavaScript syntax all frontend
        run: find frontend/static -maxdepth 1 -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Python static
        run: |
          cd backend
          python -m compileall -q .
          python -m ruff check api auth core db services main.py --select F821,F822,F823
      - name: Repository tests
        run: cd backend && python -m pytest tests/ -q --tb=short