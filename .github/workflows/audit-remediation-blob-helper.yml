name: Audit Remediation Blob Helper

on:
  push:
    branches:
      - '1.0.12'

permissions:
  contents: write

jobs:
  build-blobs:
    if: github.event.head_commit.message == 'Prepare exact-source audit remediation blobs'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout exact helper commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Build exact-source replacement blobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import pathlib
          import subprocess
          import urllib.request

          root = pathlib.Path.cwd()

          def replace_exact(path: str, old: str, new: str, *, count: int = 1) -> None:
              target = root / path
              source = target.read_text(encoding="utf-8")
              actual = source.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} exact match(es), found {actual}")
              target.write_text(source.replace(old, new), encoding="utf-8")

          replace_exact(
              "frontend/static/app.js",
              "Math.min(Math.max(parseInt(v)||25,15),100)",
              "Math.min(Math.max(parseInt(v)||25,1),100)",
          )
          replace_exact(
              "frontend/static/app.js",
              "Math.min(Math.max(parseInt(torrentPageSize)||25,15),100)",
              "Math.min(Math.max(parseInt(torrentPageSize)||25,1),100)",
          )

          old_pager = "\n".join([
              "    const measuredLimit = Math.max(1, Number(torrentPageSize) || 1);",
              "    const incomingLimit = Math.max(1, Number(limit) || measuredLimit);",
              "    const useMeasured = window.matchMedia(DESKTOP_QUERY).matches && measuredLimit < 15 && incomingLimit >= 15;",
              "    const normalizedLimit = useMeasured ? measuredLimit : incomingLimit;",
              "    const normalizedOffset = useMeasured",
              "      ? Math.max(0, (Math.max(1, Number(torrentPage) || 1) - 1) * normalizedLimit)",
              "      : Math.max(0, Number(offset) || 0);",
          ])
          new_pager = "\n".join([
              "    const normalizedLimit = Math.max(1, Number(limit) || Number(torrentPageSize) || 1);",
              "    const normalizedOffset = Math.max(0, Number(offset) || 0);",
          ])
          replace_exact("frontend/static/ui-correction-batch1.js", old_pager, new_pager)

          app = (root / "frontend/static/app.js").read_text(encoding="utf-8")
          runtime = (root / "frontend/static/ui-correction-batch1.js").read_text(encoding="utf-8")
          if "parseInt(v)||25,15" in app or "parseInt(torrentPageSize)||25,15" in app:
              raise SystemExit("legacy minimum-15 request clamp remains")
          if "useMeasured" in runtime or "measuredLimit < 15" in runtime:
              raise SystemExit("legacy pager compatibility ownership remains")

          subprocess.run(["node", "--check", "frontend/static/app.js"], check=True)
          subprocess.run(["node", "--check", "frontend/static/ui-correction-batch1.js"], check=True)

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          for path in (
              "frontend/static/app.js",
              "frontend/static/ui-correction-batch1.js",
          ):
              payload = json.dumps({
                  "content": base64.b64encode((root / path).read_bytes()).decode("ascii"),
                  "encoding": "base64",
              }).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs",
                  data=payload,
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              print(f"BLOB\t{path}\t{result['sha']}")
          PY
