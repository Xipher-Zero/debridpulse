name: Second-Pass STATE-002 Remediation

on:
  push:
    branches:
      - '1.0.12'
    paths:
      - '.github/remediation_state002.py'
      - '.github/workflows/remediation-state002.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact remediation trigger
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Apply durable executor cleanup remediation
        run: python .github/remediation_state002.py

      - name: Preserve authoritative executor cancel outcome contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/transfers/engine.py')
          text = path.read_text()
          old = '''                confirmed = await executor.observe(handle)\n                if not isinstance(confirmed, ExecutionObservation) or confirmed.handle != handle:\n                    raise TransferError(self._error(\n                        Category.INVALID_ADAPTER_RESPONSE, Stage.CLEANUP, domain=Domain.EXECUTOR,\n                        retryability=Retryability.NEVER, recovery=Recovery.REQUIRE_OPERATOR,\n                    ))\n                await self.repository.execution(confirmed)\n                if confirmed.state not in {\n                    ExecutionState.ABSENT, ExecutionState.CANCELLED,\n                    ExecutionState.SUCCEEDED, ExecutionState.FAILED,\n                }:\n                    raise TransferError(self._error(\n                        Category.REMOTE_CLEANUP_FAILED, Stage.CLEANUP, domain=Domain.CLEANUP,\n                        retryability=Retryability.BACKOFF, recovery=Recovery.RETRY,\n                    ))\n                await self.repository.execution_cleanup_complete(handle.attempt_id)\n'''
          new = '''                # A successful/cancelled executor outcome is the executor contract's\n                # termination acknowledgement. Do not require a second observation: a\n                # concurrent late-completion observation is history, not grounds to reopen\n                # cleanup or the already-terminal logical transfer.\n                await self.repository.execution_cleanup_complete(handle.attempt_id)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one confirmation block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install backend test dependencies
        run: |
          cd backend
          python -m pip install -r requirements.txt -r requirements-dev.txt ruff

      - name: Run deterministic STATE-002 and cancellation regression tests
        run: |
          set -euo pipefail
          cd backend
          python -m pytest -q \
            tests/test_second_pass_state002.py \
            tests/test_audit_remediation_state.py \
            tests/test_universal_lifecycle.py \
            tests/test_aria2_executor_contract.py

      - name: Static checks
        run: |
          set -euo pipefail
          ruff check backend/transfers/engine.py backend/transfers/repository.py backend/tests/test_second_pass_state002.py --select F821,F822,F823
          python -m compileall -q backend/transfers backend/tests/test_second_pass_state002.py
          git diff --check

      - name: Commit coherent STATE-002 correction
        run: |
          set -euo pipefail
          rm .github/remediation_state002.py
          rm .github/workflows/remediation-state002.yml
          git config user.name debridpulse-remediation
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: make executor cancellation cleanup durable'
          git push origin HEAD:1.0.12
