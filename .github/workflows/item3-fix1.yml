name: Item 3 Final Presentation and Docs

on:
  push:
    branches: ["1.0.12"]
    paths:
      - "dev/item3_finalize_patch.py"
      - ".github/workflows/item3-fix1.yml"

permissions:
  contents: write

jobs:
  apply-and-focus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.0.12
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Apply final presentation and docs patch
        run: python dev/item3_finalize_patch.py
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile and focused architecture tests
        shell: bash
        run: |
          python -m compileall -q backend
          cd backend
          pytest -q \
            tests/test_input_required_lifecycle.py \
            tests/test_input_required_api.py \
            tests/test_input_required_acceptance.py \
            tests/test_input_required_architecture.py \
            tests/test_ui_transfer_contract.py \
            tests/test_universal_contracts.py \
            tests/test_universal_boundaries.py
      - name: JavaScript syntax
        shell: bash
        run: |
          node --check frontend/static/app.js
          node --check frontend/browser/input-required.spec.js
      - name: Commit canonical finalization
        shell: bash
        run: |
          git config user.name "debridpulse-item3-bot"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md docs backend/tests/test_ui_transfer_contract.py frontend/static/ui-transfer-contract.css
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "docs: finalize input-required architecture and presentation"
          git push origin HEAD:1.0.12
