name: Item 3 Development Scaffolding Cleanup

on:
  push:
    branches: ["1.0.12"]
    paths:
      - ".github/workflows/item3-fix1.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.0.12
          fetch-depth: 0
      - name: Remove all Item 3 development scaffolding
        shell: bash
        run: |
          git config user.name "debridpulse-item3-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm \
            .github/workflows/item3-dev-patch.yml \
            .github/workflows/item3-fix1.yml \
            dev/item3-validation-marker.txt \
            dev/item3_finalize_patch.py \
            dev/item3_fix1.py \
            dev/item3_fix2.py \
            dev/item3_fix3.py \
            dev/item3_patch.py
          git diff --cached --check
          git commit -m "chore: remove Item 3 development scaffolding"
          git push origin HEAD:1.0.12
