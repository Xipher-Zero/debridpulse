name: Item 3 Capacity and API Hardening

on:
  push:
    branches: ["1.0.12"]
    paths:
      - "dev/item3_fix3.py"
      - ".github/workflows/item3-fix1.yml"

permissions:
  contents: write

jobs:
  apply-and-focus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.0.12
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Apply capacity and API hardening
        run: python dev/item3_fix3.py
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile and undefined-name checks
        shell: bash
        run: |
          python -m compileall -q backend
          python -m pip install ruff
          cd backend
          ruff check api application auth core db executors integrations postprocessors providers services transfers main.py --select F821,F822,F823
      - name: Focused Item 3 tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_input_required_lifecycle.py \
            tests/test_input_required_api.py \
            tests/test_provider_runtime_state_maintenance.py \
            tests/test_provider_runtime_state_transactions.py \
            tests/test_database_schema.py \
            tests/test_universal_contracts.py \
            tests/test_universal_boundaries.py \
            tests/test_universal_lifecycle.py \
            tests/test_universal_hardening.py \
            tests/test_transfer_integrity.py
      - name: Commit canonical hardening
        shell: bash
        run: |
          git config user.name "debridpulse-item3-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: enforce input continuation capacity and API bounds"
          git push origin HEAD:1.0.12
