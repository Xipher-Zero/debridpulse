name: Item 3 Schema Correction

on:
  push:
    branches: ["1.0.12"]
    paths:
      - "dev/item3_fix1.py"
      - ".github/workflows/item3-fix1.yml"

permissions:
  contents: write

jobs:
  fix-and-focus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.0.12
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Apply schema correction
        run: python dev/item3_fix1.py
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile and undefined-name checks
        shell: bash
        run: |
          python -m compileall -q backend
          python -m pip install ruff
          cd backend
          ruff check api application auth core db executors integrations postprocessors providers services transfers main.py --select F821,F822,F823
      - name: Focused correction tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_provider_runtime_state_maintenance.py tests/test_input_required_lifecycle.py tests/test_provider_runtime_state_transactions.py tests/test_database_schema.py
      - name: Commit canonical correction
        shell: bash
        run: |
          git config user.name "debridpulse-item3-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: canonicalize input challenge schema ownership"
          git push origin HEAD:1.0.12
