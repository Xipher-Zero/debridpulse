name: WS1 P2 provider ownership consolidation

on:
  push:
    branches: [ws1-p2-consolidation-work2]

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ws1-p2-consolidation-work2
          fetch-depth: 0
      - name: Apply consolidation
        run: python tools/ws1_p2_consolidate.py
      - name: Commit consolidated tree
        run: |
          git config user.name "Xipher-Zero"
          git config user.email "68665477+Xipher-Zero@users.noreply.github.com"
          git add -A
          git commit -m "ui: consolidate provider status ownership"
          git push origin HEAD:ws1-p2-consolidation-work2
