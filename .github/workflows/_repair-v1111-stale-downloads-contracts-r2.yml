name: Complete Downloads contract consolidation

on:
  push:
    branches:
      - audit/v1.0.11.1-f500727-qualification
    paths:
      - .github/workflows/_repair-v1111-stale-downloads-contracts-r2.yml

permissions:
  contents: write

env:
  BASE_SHA: 5d44c2a52b88f027501c8091913e4a8d546910b9
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout guarded working candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 1.0.11-hotfix1
          fetch-depth: 2

      - name: Prove base and load audit helper
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = 1.0.11.1
          test -z "$(git status --porcelain)"
          git fetch origin audit/v1.0.11.1-f500727-qualification
          git show FETCH_HEAD:scripts/_repair_v1111_stale_downloads_contracts.py > /tmp/repair.py

      - name: Apply direct-owner consolidation
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/repair.py
          python - <<'PY'
          from pathlib import Path
          tests = Path('backend/tests')
          changed = 0
          for path in tests.glob('test_*.py'):
              text = path.read_text(encoding='utf-8')
              new = text.replace('ui-downloads-page.css?v=27', 'ui-downloads-page.css?v=28')
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed += 1
          assert changed >= 1, 'expected at least one no-leading-slash stale Downloads cache contract'
          for path in tests.glob('test_*.py'):
              assert 'ui-downloads-page.css?v=27' not in path.read_text(encoding='utf-8'), path
          PY
          git diff --check
          find frontend/static -maxdepth 1 -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          pip install -r requirements-dev.txt

      - name: Full regression before commit
        shell: bash
        env:
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          cd backend
          python -m pytest tests/ -q --tb=short

      - name: Commit working candidate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain)"
          git config user.name Xipher-Zero
          git config user.email 68665477+Xipher-Zero@users.noreply.github.com
          git add frontend/static/app.js backend/tests
          git commit -m "test: align Downloads contracts with canonical owner"
          git push origin HEAD:1.0.11-hotfix1
          echo "NEW_CANDIDATE_SHA=$(git rev-parse HEAD)"
