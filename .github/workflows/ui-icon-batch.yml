name: UI Icon Batch Helper

on:
  push:
    branches:
      - ci-ops/icon-batch-ccee540

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install test dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt

      - name: Apply approved batch fail-closed
        shell: bash
        env:
          TARGET_BRANCH: staging/v1.0.11-ui
          EXPECTED_BASE: ccee5405432877947986c23044109e4afb55e645
        run: |
          set -euo pipefail

          git fetch origin "$TARGET_BRANCH"
          actual_base="$(git rev-parse "origin/$TARGET_BRANCH")"
          if [ "$actual_base" != "$EXPECTED_BASE" ]; then
            echo "Target branch moved: expected $EXPECTED_BASE, got $actual_base"
            exit 1
          fi

          git checkout --detach "$EXPECTED_BASE"
          git show "ci-ops/icon-batch-ccee540:.github/scripts/ui_icon_batch.py" > /tmp/ui_icon_batch.py
          git show "ci-ops/icon-batch-ccee540:.github/scripts/ui_icon_batch_contracts.py" > /tmp/ui_icon_batch_contracts.py
          python3 /tmp/ui_icon_batch.py
          python3 /tmp/ui_icon_batch_contracts.py

          test "$(tr -d '\r\n' < VERSION)" = "1.0.10"
          git diff --check
          (cd backend && python -m pytest tests/ -q)
          node --check frontend/static/ui-runtime.js
          node --check frontend/static/operator-title.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/static/ui-runtime.js \
                  frontend/static/index.html \
                  frontend/static/operator-title.js \
                  frontend/static/ui-dashboard-control-polish.css \
                  frontend/static/ui-shell-provider-status-v2.css \
                  frontend/static/ui-feature-icon-contract.css \
                  frontend/static/style-v11.css \
                  backend/tests/test_ui_shell_contract.py \
                  backend/tests/test_ui_frontend_deep_audit_contract.py \
                  backend/tests/test_ui_activity_log_page_contract.py \
                  backend/tests/test_ui_feature_icon_contract.py \
                  backend/tests/test_dashboard_startup_surface.py \
                  backend/tests/test_operator_title_state.py \
                  backend/tests/test_ui_dashboard_contract.py \
                  backend/tests/test_ui_dashboard_polish_contract.py \
                  backend/tests/test_ui_desktop_downloads_batch_contract.py \
                  backend/tests/test_ui_progress_weight_contract.py
          git diff --cached --check
          git commit -m "Normalize shared icon presentation"

          git fetch origin "$TARGET_BRANCH"
          current="$(git rev-parse "origin/$TARGET_BRANCH")"
          if [ "$current" != "$EXPECTED_BASE" ]; then
            echo "Target branch moved before push: expected $EXPECTED_BASE, got $current"
            exit 1
          fi

          git push origin HEAD:"refs/heads/$TARGET_BRANCH"
