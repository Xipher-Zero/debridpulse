name: Temporary STATE-003 remediation harness

on:
  push:
    branches:
      - 'audit/state003-remediation-work'

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.head_commit.message == 'chore: repair state003 remediation harness'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify exact remediation ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8e73b7d5d82db6b5ff2ecfd4ea9fb580ce38b1f5 HEAD

      - name: Apply bounded STATE-003 correction
        run: python scripts/tmp_state003_patch.py

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install focused test dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Run focused STATE-003 and architecture tests
        run: |
          set -euo pipefail
          cd backend
          ruff check transfers/engine.py transfers/repository.py tests/test_second_pass_state002.py --select F821,F822,F823
          python -m pytest tests/test_second_pass_state002.py tests/test_post_audit_architecture_documentation.py -v --tb=short
          python -m compileall -q transfers tests/test_second_pass_state002.py tests/test_post_audit_architecture_documentation.py

      - name: Commit verified staging patch
        run: |
          set -euo pipefail
          git config user.name "debridpulse-remediation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/transfers/engine.py backend/transfers/repository.py backend/tests/test_second_pass_state002.py backend/tests/test_post_audit_architecture_documentation.py docs/architecture/UNIVERSAL_TRANSFER_CORE.md
          git diff --cached --check
          git commit -m "fix: preserve executor cleanup reconciliation liveness"
          git push origin HEAD:audit/state003-remediation-work
