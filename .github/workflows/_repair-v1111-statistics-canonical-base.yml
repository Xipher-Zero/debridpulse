name: Repair v1.0.11.1 Statistics canonical base
on:
  push:
    branches:
      - audit/v1.0.11.1-stats-canonicalization
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v1.0.11.1-stats-canonicalization
          path: helper
      - uses: actions/checkout@v4
        with:
          ref: 1.0.11-hotfix1
          fetch-depth: 0
          path: repo
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: repo/backend/requirements-dev.txt
      - name: Install regression dependencies
        working-directory: repo/backend
        shell: bash
        run: pip install -r requirements-dev.txt
      - name: Guard candidate base
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "070f30a67390a45d8c9dea5ffd61553888109ccb"
          test "$(cat VERSION)" = "1.0.11.1"
      - name: Apply canonical Statistics repair
        shell: bash
        run: |
          set -euo pipefail
          python helper/scripts/_repair_stats_canonical_base.py repo
          python helper/scripts/_repair_stats_contract_followup.py repo
          python helper/scripts/_repair_stats_contract_followup2.py repo
      - name: Canonical Statistics architecture assertions
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "ensureStatisticsArchitecture\|moveDashboardKpisToStatistics\|decorateHistoricalKpis" frontend/static/ui-statistics.js frontend/static/ui-runtime.js
          ! grep -R "dash-kpi-strip--dashboard" frontend/static/index.html frontend/static/ui-dashboard.css frontend/static/ui-runtime.js
          ! grep -R "ui-statistics.css" frontend/static/style-v11.css frontend/static/index.html
          test ! -e frontend/static/ui-statistics.css
          node --check frontend/static/ui-statistics.js
          node --check frontend/static/ui-runtime.js
          node --check frontend/static/app.js
          python -m compileall -q backend
          git diff --check
      - name: Targeted Statistics and architecture regression
        working-directory: repo
        shell: bash
        env:
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          python -m pytest -q \
            backend/tests/test_ui_statistics_contract.py \
            backend/tests/test_v1111_canonical_frontend_contract.py \
            backend/tests/test_ui_dashboard_contract.py \
            backend/tests/test_v1_scope.py \
            backend/tests/test_ui_runtime_architecture_contract.py \
            backend/tests/test_ui_frontend_deep_audit_contract.py \
            backend/tests/test_ui_cross_page_consistency_contract.py
      - name: Full regression from candidate source
        working-directory: repo
        shell: bash
        env:
          PYTHONPATH: backend
        run: python -m pytest -q
      - name: Commit repaired canonical Statistics base
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name "Xipher-Zero"
          git config user.email "68665477+Xipher-Zero@users.noreply.github.com"
          git add -A frontend/static backend/tests
          git commit -m "fix: encode canonical Statistics composition"
          git push origin HEAD:1.0.11-hotfix1