# PR regression and security validation.
name: Tests

on:
  push:
    branches:
      - main
      - '1.0.11'
      - '1.0.12'
      - 'staging/**'
      - 'audit/**'
    tags:
      - 'v*'
      - 'internal-v*'
  pull_request:
    branches:
      - main
      - '1.0.11'
      - '1.0.12'
      - 'staging/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Apply temporary STATE-003 patch on staging branch
        if: github.ref == 'refs/heads/audit/state003-remediation-work' && github.event.head_commit.message == 'chore: run state003 inline staging'
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8e73b7d5d82db6b5ff2ecfd4ea9fb580ce38b1f5 HEAD
          python scripts/tmp_state003_patch.py

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install downloader regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aria2 openssl
          aria2c --version
          openssl version

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Check undefined Python names
        run: |
          cd backend
          ruff check api application auth core db executors integrations postprocessors providers services transfers main.py --select F821,F822,F823

      - name: Run v1.0.12 post-audit six-finding qualification
        run: |
          set -o pipefail
          cd backend
          mapfile -t cases < <(grep -Ev '^[[:space:]]*(#|$)' tests/post_audit_qualification.txt)
          python -m pytest "${cases[@]}" -v --tb=short 2>&1 | tee "$RUNNER_TEMP/post-audit.log"

      - name: Upload post-audit qualification output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-audit-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/post-audit.log
          if-no-files-found: error
          retention-days: 14

      - name: Run v1.0.12 two-provider canonical qualification
        run: |
          set -o pipefail
          cd backend
          mapfile -t cases < <(grep -Ev '^[[:space:]]*(#|$)' tests/two_provider_checkpoint_qualification.txt)
          python -m pytest "${cases[@]}" -v --tb=short 2>&1 | tee "$RUNNER_TEMP/two-provider.log"

      - name: Upload two-provider qualification output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: two-provider-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/two-provider.log
          if-no-files-found: error
          retention-days: 14

      - name: Run all tests
        run: |
          set -o pipefail
          cd backend
          python -m pytest tests/ -v --tb=short 2>&1 | tee "$RUNNER_TEMP/pytest.log"

      - name: Upload pytest qualification output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/pytest.log
          if-no-files-found: error
          retention-days: 14

      - name: Check Python syntax
        run: |
          cd backend
          python -m compileall -q .
          echo "All Python modules compile"

      - name: Check frontend JavaScript syntax
        run: |
          find frontend/static -maxdepth 1 -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          node --check frontend/browser/playwright.config.js
          find frontend/browser -maxdepth 1 -name '*.spec.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Commit verified STATE-003 patch on staging branch
        if: github.ref == 'refs/heads/audit/state003-remediation-work' && github.event.head_commit.message == 'chore: run state003 inline staging'
        run: |
          set -euo pipefail
          git config user.name "debridpulse-remediation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/transfers/engine.py backend/transfers/repository.py backend/tests/test_second_pass_state002.py backend/tests/test_post_audit_architecture_documentation.py docs/architecture/UNIVERSAL_TRANSFER_CORE.md
          git diff --cached --check
          git commit -m "fix: preserve executor cleanup reconciliation liveness"
          git push origin HEAD:audit/state003-remediation-work

  security:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies + audit tools
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: pip-audit (known CVEs in dependencies)
        run: |
          cd backend
          pip-audit -r requirements.txt --progress-spinner off

      - name: bandit (Python security linting)
        run: |
          cd backend
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt
