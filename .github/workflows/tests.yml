# PR regression and security validation.
name: Tests

on:
  push:
    branches:
      - main
      - 'staging/**'
  pull_request:
    branches:
      - main
      - 'staging/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: staging/v1.0.6-mirror-hotfix

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Apply mirror failover patch
        run: |
          if [ -f tools/tmp_apply_mirror_failover.py ]; then
            python tools/tmp_apply_mirror_failover.py
          else
            echo "Mirror failover patch already committed"
          fi
          git diff --check

      - name: Check undefined Python names
        run: |
          cd backend
          ruff check api auth core db services main.py --select F821,F822,F823

      - name: Run all tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Check Python syntax
        run: |
          cd backend
          python -m compileall -q .
          echo "All Python modules compile"

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/static/app.js
          node --check frontend/static/auth.js
          node --check frontend/static/auth-settings.js
          node --check frontend/static/auth-help.js
          node --check frontend/static/auth-ux.js
          node --check frontend/static/operator-title.js

      - name: Commit mirror failover
        if: github.event_name == 'push'
        run: |
          if [ ! -f tools/tmp_apply_mirror_failover.py ]; then
            echo "Mirror failover already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/tmp_apply_mirror_failover.py
          git add \
            backend/db/database.py \
            backend/services/dispatch_coordinator.py \
            backend/services/manager_v2.py \
            backend/services/direct_link_result_guard.py \
            backend/tests/test_direct_link_mirror_failover.py
          git commit -m "Add automatic mirror source failover"
          git pull --rebase origin staging/v1.0.6-mirror-hotfix
          git push origin HEAD:staging/v1.0.6-mirror-hotfix

  security:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: staging/v1.0.6-mirror-hotfix

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies + audit tools
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: pip-audit (known CVEs in dependencies)
        run: |
          cd backend
          pip-audit -r requirements.txt --progress-spinner off

      - name: bandit (Python security linting)
        run: |
          cd backend
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt
