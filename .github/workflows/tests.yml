# PR regression and security validation.
name: Tests

on:
  push:
    branches:
      - main
      - 'staging/**'
  pull_request:
    branches:
      - main
      - 'staging/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Check undefined Python names
        run: |
          cd backend
          ruff check api auth core db services main.py --select F821,F822,F823

      - name: Run all tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Check Python syntax
        run: |
          cd backend
          python -m compileall -q .
          echo "All Python modules compile"

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/static/app.js
          node --check frontend/static/auth.js
          node --check frontend/static/auth-settings.js
          node --check frontend/static/auth-help.js
          node --check frontend/static/auth-ux.js
          node --check frontend/static/operator-title.js
          node --check frontend/static/ui-runtime.js
          node --check frontend/static/ui-downloads-runtime.js
          node --check frontend/static/ui-accessibility-runtime.js
          node --check frontend/static/ui-theme-bootstrap.js
          node --check frontend/static/ui-presentation-loader.js
          node --check frontend/static/ui-shell-runtime.js
          node --check frontend/static/ui-help-page.js
          node --check frontend/static/ui-help-chrome.js
          node --check frontend/static/ui-settings-page.js
          node --check frontend/static/ui-settings-auth-resilience.js
          node --check frontend/static/ui-settings-authentication.js
          node --check frontend/static/ui-settings-authentication-polish.js
          node --check frontend/static/ui-settings-authentication-oidc.js
          node --check frontend/static/ui-settings-authentication-callback.js
          node --check frontend/static/ui-visual-behavior-fixes.js
          node --check frontend/static/ui-statistics-orchestrator.js
          node --check frontend/static/ui-statistics-batch3.js
          node --check frontend/static/ui-statistics-batch4.js
          node --check frontend/static/ui-statistics-batch5.js
          node --check frontend/static/ui-error-semantics.js

  security:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies + audit tools
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: pip-audit (known CVEs in dependencies)
        run: |
          cd backend
          pip-audit -r requirements.txt --progress-spinner off

      - name: bandit (Python security linting)
        run: |
          cd backend
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt
