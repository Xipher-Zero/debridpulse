# PR regression and security validation.
name: Tests

on:
  push:
    branches:
      - main
      - 'staging/**'
  pull_request:
    branches:
      - main
      - 'staging/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - name: Apply filename allocation correction
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: python
        run: |
          from pathlib import Path

          manager_path = Path("backend/services/manager_v2.py")
          source = manager_path.read_text()
          lines = source.splitlines()

          def find_exact(value, start=0):
              for idx in range(start, len(lines)):
                  if lines[idx] == value:
                      return idx
              raise SystemExit(f"Could not find expected line: {value!r}")

          fn_start = find_exact("    @staticmethod")
          while fn_start < len(lines) - 1 and lines[fn_start + 1] != "    def _unique_direct_link_path(":
              fn_start = find_exact("    @staticmethod", fn_start + 1)
          fn_end = find_exact("        return candidate", fn_start) + 1
          lines[fn_start:fn_end] = [
              "    @staticmethod",
              "    def _unique_direct_link_path(",
              "        root: Path,",
              "        filename: str,",
              "        reserved: Set[str],",
              "    ) -> Path:",
              "        \"\"\"Choose a direct-link target without overwriting unrelated content.\"\"\"",
              "        candidate = root / safe_name(filename)",
              "        stem = candidate.stem or \"download\"",
              "        suffix = candidate.suffix",
              "        counter = 2",
              "        while str(candidate).lower() in reserved or candidate.exists():",
              "            candidate = root / f\"{stem} ({counter}){suffix}\"",
              "            counter += 1",
              "        reserved.add(str(candidate).lower())",
              "        return candidate",
          ]

          reuse_decl = find_exact("            reusable_source_urls: Set[str] = set()")
          del lines[reuse_decl]

          live_query = find_exact("                        WHERE t.status!='deleted'")
          lines[live_query] = "                        WHERE t.status NOT IN ('completed','deleted','error')"

          hist_start = find_exact("                if normalized:", live_query)
          hist_end = find_exact("                await db.execute(", hist_start)
          del lines[hist_start:hist_end]

          call_start = find_exact("                    local_path = self._unique_direct_link_path(", hist_start)
          reuse_line = find_exact("                        reuse_existing=(", call_start)
          if (
              lines[reuse_line + 1].strip() != 'result["source_url"] in reusable_source_urls'
              or lines[reuse_line + 2].strip() != "),"
          ):
              raise SystemExit("Unexpected reuse_existing call shape")
          del lines[reuse_line:reuse_line + 3]

          comment_start = find_exact("            # A deleted transfer releases its old filename, but any non-deleted")
          if lines[comment_start + 1].startswith("            # transfer still owns") and lines[comment_start + 2].startswith("            # deleted-source"):
              lines[comment_start:comment_start + 3] = [
                  "            # Only in-flight transfers reserve future target paths. Terminal history",
                  "            # does not influence naming; an actual file on disk is protected by",
                  "            # _unique_direct_link_path() itself.",
              ]

          manager_path.write_text("\n".join(lines) + "\n")

          tests_path = Path("backend/tests/test_direct_links.py")
          test_lines = tests_path.read_text().splitlines()
          test_start = next(
              i for i, line in enumerate(test_lines)
              if line.startswith("    def test_removed_source_can_reuse_its_original_target_path")
          )
          test_end = next(
              i for i, line in enumerate(test_lines[test_start:], start=test_start)
              if line == "class DelayedAllDebridTests(unittest.IsolatedAsyncioTestCase):"
          )
          replacement = '''    def test_existing_file_always_reserves_target_path(self):
        manager = TorrentManager()
        with tempfile.TemporaryDirectory() as temp_dir:
            root = Path(temp_dir)
            existing = root / "archive.zip"
            existing.write_bytes(b"existing payload")
            selected = manager._unique_direct_link_path(root, "archive.zip", set())
        self.assertEqual(selected.name, "archive (2).zip")

    def test_active_owner_reserves_target_before_file_exists(self):
        manager = TorrentManager()
        with tempfile.TemporaryDirectory() as temp_dir:
            root = Path(temp_dir)
            claimed = root / "archive.zip"
            selected = manager._unique_direct_link_path(
                root, "archive.zip", {str(claimed).lower()}
            )
        self.assertEqual(selected.name, "archive (2).zip")

    def test_unclaimed_absent_target_keeps_original_name(self):
        manager = TorrentManager()
        with tempfile.TemporaryDirectory() as temp_dir:
            root = Path(temp_dir)
            selected = manager._unique_direct_link_path(root, "archive.zip", set())
        self.assertEqual(selected.name, "archive.zip")

    def test_direct_link_preparation_reserves_only_nonterminal_paths(self):
        repo_backend = Path(__file__).resolve().parents[1]
        manager_source = (repo_backend / "services/manager_v2.py").read_text()
        self.assertIn("protected_live_paths: Set[str] = set()", manager_source)
        self.assertIn(
            "WHERE t.status NOT IN ('completed','deleted','error')",
            manager_source,
        )
        self.assertIn("AND t.id!=?", manager_source)
        self.assertIn(
            "reserved_paths: Set[str] = set(protected_live_paths)",
            manager_source,
        )
        self.assertNotIn("reusable_source_urls", manager_source)
        self.assertNotIn("reuse_existing", manager_source)


'''.splitlines()
          test_lines[test_start:test_end] = replacement
          tests_path.write_text("\n".join(test_lines) + "\n")

      - name: Commit filename allocation correction
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git diff --check
          python -m py_compile backend/services/manager_v2.py backend/tests/test_direct_links.py
          if git diff --quiet; then
            echo "No correction required"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/services/manager_v2.py backend/tests/test_direct_links.py
            git commit -m "Fix direct-link filename reservation semantics"
            git push origin HEAD:staging/v1.0.6-mirror-hotfix
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Check undefined Python names
        run: |
          cd backend
          ruff check api auth core db services main.py --select F821,F822,F823

      - name: Run all tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Check Python syntax
        run: |
          cd backend
          python -m compileall -q .
          echo "All Python modules compile"

      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/static/app.js
          node --check frontend/static/auth.js
          node --check frontend/static/auth-settings.js
          node --check frontend/static/auth-help.js
          node --check frontend/static/auth-ux.js
          node --check frontend/static/operator-title.js

  security:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies + audit tools
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: pip-audit (known CVEs in dependencies)
        run: |
          cd backend
          pip-audit -r requirements.txt --progress-spinner off

      - name: bandit (Python security linting)
        run: |
          cd backend
          bandit -r . --exclude ./tests --severity-level high --confidence-level high -f txt
