name: Final Blocked Wording Qualification

on:
  push:
    branches:
      - audit/file-filter-wording-final-20260831

permissions:
  contents: write

jobs:
  qualify:
    if: "${{ github.event.head_commit.message != 'audit: finalize retired filter runtime cleanup' }}"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Apply wording cleanup
        run: python .github/scripts/finalize_blocked_wording.py

      - name: Install test dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Full qualification
        run: |
          cd backend
          ruff check api auth core db services main.py --select F821,F822,F823
          python -m pytest tests/ -v --tb=short
          python -m compileall -q .
          cd ..
          node --check frontend/static/ui-settings-page.js
          node --check frontend/static/ui-settings-downloads-completion.js
          git diff --check

      - name: Verify retirement and preserved explicit semantics
        run: |
          ! git grep -nE 'is_blocked|blocked_items|filtered/blocked|_send_partial_summary' -- \
            backend/services/manager_v2.py \
            backend/services/transfer_integrity.py \
            backend/services/transfer_runtime_guard.py
          git grep -n 'All files were blocked — marked completed' -- backend/services/manager_v2.py
          git grep -nE '/torrents/\{torrent_id\}/files/\{file_id\}/block|/torrents/\{torrent_id\}/label' -- backend/api/routes.py

      - name: Commit disposable candidate
        run: |
          git config user.name 'Xipher-Zero'
          git config user.email '68665477+Xipher-Zero@users.noreply.github.com'
          git add backend/services/manager_v2.py backend/tests/test_settings_runtime_contract_census.py
          git commit -m 'audit: finalize retired filter runtime cleanup'
          git push origin HEAD:audit/file-filter-wording-final-20260831
