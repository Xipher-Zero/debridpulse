name: Checkpoint Bootstrap

on:
  push:
    branches:
      - '1.0.12'

permissions:
  contents: write

jobs:
  apply-canonical-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Apply staged canonical patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/.checkpoint-patch-{01,02,03,04,05,06,07,08,09} > "$RUNNER_TEMP/checkpoint.patch.gz.b64"
          echo "staged-bytes=$(wc -c < "$RUNNER_TEMP/checkpoint.patch.gz.b64")"
          base64 -d "$RUNNER_TEMP/checkpoint.patch.gz.b64" > "$RUNNER_TEMP/checkpoint.patch.gz"
          gzip -t "$RUNNER_TEMP/checkpoint.patch.gz"
          gzip -dc "$RUNNER_TEMP/checkpoint.patch.gz" > "$RUNNER_TEMP/checkpoint.patch"
          git apply --check "$RUNNER_TEMP/checkpoint.patch"
          git apply "$RUNNER_TEMP/checkpoint.patch"

          # The GitHub Actions token may not create/update workflow files. Preserve
          # the currently registered workflow set for this transport commit; the
          # canonical workflow edits are applied immediately afterward through the
          # connected repository API, which has workflow-write permission.
          git checkout HEAD -- \
            .github/workflows/browser-runtime.yml \
            .github/workflows/fork-image.yml \
            .github/workflows/tests.yml \
            .github/workflows/checkpoint-bootstrap.yml

          rm -f .github/checkpoint-canonical.patch.gz.b64
          rm -f .github/.checkpoint-patch-{01,02,03,04,05,06,07,08,09}

          git diff --check
          test ! -e .github/checkpoint-canonical.patch.gz.b64
          test -z "$(find .github -maxdepth 1 -name '.checkpoint-patch-*' -print -quit)"
          git diff --quiet -- \
            .github/workflows/browser-runtime.yml \
            .github/workflows/fork-image.yml \
            .github/workflows/tests.yml \
            .github/workflows/checkpoint-bootstrap.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "chore: canonicalize v1.0.12 two-provider checkpoint"
          git push origin HEAD:1.0.12
