name: Checkpoint Bootstrap

on:
  push:
    branches:
      - '1.0.12'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Record snapshot metadata
        run: |
          git rev-parse HEAD > checkpoint-head.txt
          git rev-parse HEAD^{tree} > checkpoint-tree.txt
          git status --porcelain=v1 > checkpoint-status.txt

      - name: Upload repository snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkpoint-source-${{ github.sha }}
          path: |
            .
            !.git/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
