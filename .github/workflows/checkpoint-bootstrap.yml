name: Checkpoint Bootstrap

on:
  push:
    branches:
      - '1.0.12'

permissions:
  contents: write

jobs:
  apply-canonical-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Apply staged canonical patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/checkpoint-canonical.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/checkpoint.patch"
          git apply --check "$RUNNER_TEMP/checkpoint.patch"
          git apply "$RUNNER_TEMP/checkpoint.patch"
          rm -f .github/checkpoint-canonical.patch.gz.b64
          rm -f .github/workflows/checkpoint-bootstrap.yml
          git diff --check
          test ! -e .github/checkpoint-canonical.patch.gz.b64
          test ! -e .github/workflows/checkpoint-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "chore: canonicalize v1.0.12 two-provider checkpoint"
          git push origin HEAD:1.0.12
