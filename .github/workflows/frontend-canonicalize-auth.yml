name: Canonicalize Settings Authentication

on:
  push:
    branches: [1.0.11-hotfix1]
    paths:
      - scripts/_canonicalize_settings_auth.py
      - .github/workflows/frontend-canonicalize-auth.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonicalize-auth:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 1.0.11-hotfix1
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Apply guarded ownership collapse
        id: transform
        shell: bash
        run: |
          set +e
          python scripts/_canonicalize_settings_auth.py > auth-canonicalize.log 2>&1
          code=$?
          git diff > auth-working-tree.diff
          cat auth-canonicalize.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload transformation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auth-canonicalize-diagnostics
          path: |
            auth-canonicalize.log
            auth-working-tree.diff
            frontend/static/ui-settings-page.js
            frontend/static/ui-settings-authentication.css
            frontend/static/ui-settings-authentication-oidc.css
            frontend/static/index.html
            frontend/static/style-v11.css
          if-no-files-found: error

      - name: Require successful transformation
        if: steps.transform.outputs.exit_code != '0'
        run: exit 1

      - name: Frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find frontend/static -maxdepth 1 -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Python undefined names
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          ruff check api auth core db services main.py --select F821,F822,F823

      - name: Full backend regression suite
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python -m pytest tests/ -v --tb=short

      - name: Python compile
        run: python -m compileall -q backend

      - name: Architecture and diff integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(cat VERSION)" = "1.0.11.1"
          for retired in \
            ui-settings-auth-resilience.js \
            ui-settings-authentication.js \
            ui-settings-authentication-polish.js \
            ui-settings-authentication-oidc.js \
            ui-settings-authentication-callback.js; do
            ! grep -q "$retired" frontend/static/index.html
          done
          ! grep -q "ui-settings-authentication-polish.css" frontend/static/style-v11.css
          grep -q 'data-context-action="authentication" data-action="verify-oidc"' frontend/static/ui-settings-page.js
          grep -q 'data-action="copy-oidc-callback"' frontend/static/ui-settings-page.js
          grep -q 'function fallbackAuthFromSettings(settings)' frontend/static/ui-settings-page.js
          grep -q 'function probeOidcRuntime(auth, generation)' frontend/static/ui-settings-page.js
          python - <<'PY'
          from pathlib import Path
          import re
          static = Path('frontend/static')
          style = (static / 'style-v11.css').read_text()
          missing = [m.group(1) for m in re.finditer(r"@import url\('/([^?']+)", style) if not (static / m.group(1)).exists()]
          if missing:
              raise SystemExit('missing style imports: ' + ', '.join(missing))
          PY

      - name: Commit canonical authentication owner
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/_canonicalize_settings_auth.py .github/workflows/frontend-canonicalize-auth.yml auth-canonicalize.log auth-working-tree.diff
          git config user.name "Xipher-Zero"
          git config user.email "68665477+Xipher-Zero@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: make settings authentication canonical"
          git push origin HEAD:1.0.11-hotfix1
