name: DBARCH Fixture Completion

on:
  push:
    branches: ['1.0.12']
    paths:
      - '.github/remediation_dbarch_fixture_completion.py'
      - '.github/workflows/remediation-dbarch-fixture-completion.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install downloader regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aria2 openssl
      - name: Apply remaining bootstrap-owner fixture corrections
        run: python .github/remediation_dbarch_fixture_completion.py
      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install ruff
      - name: Run two-provider canonical checkpoint from zero
        working-directory: backend
        run: |
          set -o pipefail
          mapfile -t cases < <(grep -Ev '^[[:space:]]*(#|$)' tests/two_provider_checkpoint_qualification.txt)
          python -m pytest "${cases[@]}" -v --tb=short
      - name: Run complete backend suite from zero
        working-directory: backend
        run: python -m pytest -q
      - name: Static checks
        run: |
          set -euo pipefail
          ruff check backend --select F821,F822,F823
          python -m compileall -q backend
          git diff --check
      - name: Commit completed DBARCH test-boundary correction
        run: |
          set -euo pipefail
          rm .github/remediation_dbarch_fixture_completion.py
          rm .github/workflows/remediation-dbarch-fixture-completion.yml
          git config user.name debridpulse-remediation
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'test: enter runtime persistence through database bootstrap'
          git push origin HEAD:1.0.12
