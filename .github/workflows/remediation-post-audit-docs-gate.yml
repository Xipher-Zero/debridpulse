name: Post Audit Documentation and Gate Remediation

on:
  push:
    branches: [1.0.12]
    paths:
      - '.github/workflows/remediation-post-audit-docs-gate.yml'
      - '.github/remediation_post_audit.py'
      - '.github/remediation_post_audit_patch.py'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Preserve existing development version wording
        run: python .github/remediation_post_audit_patch.py
      - name: Apply post-audit documentation and permanent gate changes
        run: python .github/remediation_post_audit.py
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt ruff
      - name: Run permanent post-audit gate and architecture contracts
        run: |
          set -euo pipefail
          cd backend
          mapfile -t cases < <(grep -Ev '^[[:space:]]*(#|$)' tests/post_audit_qualification.txt)
          python -m pytest "${cases[@]}" -v --tb=short
          python -m pytest -q \
            tests/test_ui_frontend_deep_audit_contract.py \
            tests/test_two_provider_checkpoint_documentation.py
      - name: Static residue gate
        run: |
          set -euo pipefail
          test ! -e frontend/static/ui-runtime.js
          test ! -e frontend/static/ui-downloads-runtime.js
          test ! -e frontend/static/ui-shell-provider-status-v2.css
          ! grep -R --line-number --fixed-strings 'ui-shell-provider-status-v2.css' frontend/static frontend/static/index.html
          ! grep -R --line-number --fixed-strings 'v1.0.11 visual system overlay' frontend/static/style-v11.css docs/UI_FRONTEND_ARCHITECTURE.md
          ruff check backend/tests/test_post_audit_architecture_documentation.py backend/tests/test_ui_frontend_deep_audit_contract.py --select F821,F822,F823
          python -m compileall -q backend/tests/test_post_audit_architecture_documentation.py backend/tests/test_ui_frontend_deep_audit_contract.py
          git diff --check
      - name: Commit coherent post-audit docs and permanent gate
        run: |
          set -euo pipefail
          rm .github/workflows/remediation-post-audit-docs-gate.yml
          rm .github/remediation_post_audit.py
          rm .github/remediation_post_audit_patch.py
          git config user.name debridpulse-remediation
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'docs: record post-audit architecture invariants'
          git push origin HEAD:1.0.12
