name: Item 3 Development Patch

on:
  push:
    branches: ["1.0.12"]
    paths:
      - "dev/item3_patch.py"
      - ".github/workflows/item3-dev-patch.yml"

permissions:
  contents: write

jobs:
  patch-and-focus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1.0.12
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Apply canonical Item 3 patch
        run: python dev/item3_patch.py
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Python compile
        run: python -m compileall -q backend
      - name: Focused Item 3 tests
        working-directory: backend
        run: pytest -q tests/test_input_required_lifecycle.py tests/test_universal_contracts.py tests/test_universal_boundaries.py tests/test_canonical_runtime_architecture.py
      - name: Commit generated canonical changes
        shell: bash
        run: |
          git config user.name "debridpulse-item3-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: add neutral input-required lifecycle"
          git push origin HEAD:1.0.12
