name: v1.0.11.1 audit security qualification

on:
  push:
    branches:
      - audit/v1.0.11.1-post-release-remediation

permissions:
  contents: read

jobs:
  security-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install aria2 and test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y aria2
          cd backend
          pip install -r requirements-dev.txt
      - name: Run downloader security regressions
        run: |
          set -euo pipefail
          cd backend
          python -m pytest \
            tests/test_v1111_aria2_security_boundary.py \
            tests/test_v106_external_aria2_ownership.py \
            tests/test_v106_audit_contracts.py \
            -q --tb=short
      - name: Static source checks
        run: |
          set -euo pipefail
          python -m compileall -q backend/services
          grep -n -A20 -B3 'def _aria2_job_options' backend/services/manager_v2.py
          grep -RInE 'follow-torrent|follow-metalink|proxy-method|DEBRIDPULSE_EXTERNAL_ARIA2_EGRESS_PROXY' \
            backend/services backend/tests/test_v1111_aria2_security_boundary.py
