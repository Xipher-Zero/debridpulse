name: Fork Image

on:
  push:
    branches:
      - main
      - '1.0.11'
      - '1.0.12'
      - 'staging/**'
    tags:
      - 'v*'
      - 'internal-v*'
  pull_request:
    branches:
      - main
      - '1.0.11'
      - '1.0.12'
      - 'staging/**'
  workflow_dispatch:
    inputs:
      publish_sha:
        description: Publish an immutable SHA image from an approved branch
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/xipher-zero/debridpulse
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-smoke-test:
    name: Build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Read application version
        id: version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Generate test image metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        with:
          images: local/debridpulse
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=DebridPulse: Universal Transfer Manager
            org.opencontainers.image.description=Universal transfer orchestration with AllDebrid and General HTTP(S) providers plus aria2 execution
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-2.0-or-later

      - name: Build test image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: local/debridpulse:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha

      - name: Smoke test image
        shell: bash
        run: |
          set -euo pipefail

          container_name="debridpulse-smoke"
          trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT

          docker run --detach \
            --name "$container_name" \
            --env PUID=0 \
            --env PGID=0 \
            --env CONFIG_PATH=/app/config/config.json \
            --env DB_PATH=/app/data/debridpulse.db \
            "local/debridpulse:${GITHUB_SHA}"

          healthy=0
          for _ in $(seq 1 30); do
            if docker exec "$container_name" \
              curl --fail --silent --show-error \
              http://127.0.0.1:8080/api/health >/dev/null; then
              healthy=1
              break
            fi

            if [ "$(docker inspect --format '{{.State.Running}}' "$container_name")" != "true" ]; then
              break
            fi

            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo "Container failed to become healthy"
            docker inspect "$container_name" --format 'running={{.State.Running}} status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' || true
            docker logs "$container_name" || true
            exit 1
          fi

          expected_version="${{ steps.version.outputs.version }}"
          expected_revision="${GITHUB_SHA}"
          expected_title="DebridPulse: Universal Transfer Manager"
          image_ref="local/debridpulse:${GITHUB_SHA}"

          image_version="$(docker image inspect "$image_ref" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          image_revision="$(docker image inspect "$image_ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          image_title="$(docker image inspect "$image_ref" --format '{{ index .Config.Labels "org.opencontainers.image.title" }}')"
          image_license="$(docker image inspect "$image_ref" --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}')"
          health_payload="$(docker exec "$container_name" curl --fail --silent --show-error http://127.0.0.1:8080/api/health)"
          health_version="$(jq -r '.version // empty' <<< "$health_payload")"

          if [ "$image_version" != "$expected_version" ]; then
            echo "OCI version mismatch: expected $expected_version, got $image_version"
            exit 1
          fi

          if [ "$image_revision" != "$expected_revision" ]; then
            echo "OCI revision mismatch: expected $expected_revision, got $image_revision"
            exit 1
          fi

          if [ "$image_title" != "$expected_title" ]; then
            echo "OCI title mismatch: expected $expected_title, got $image_title"
            exit 1
          fi

          if [ "$image_license" != "GPL-2.0-or-later" ]; then
            echo "OCI license mismatch: expected GPL-2.0-or-later, got $image_license"
            exit 1
          fi

          docker exec "$container_name" test -f /app/LICENSE
          docker exec "$container_name" test -f /app/NOTICE
          docker exec "$container_name" test -f /app/licenses/python-runtime.json
          docker exec "$container_name" test -f /app/licenses/bencode2-MIT.txt
          docker exec "$container_name" grep -q "Chris Moore" /app/NOTICE

          echo "Checking Debian Trixie base"
          docker exec "$container_name" grep -q '^VERSION_CODENAME=trixie$' /etc/os-release

          echo "Checking required Debian packages"
          docker exec "$container_name" dpkg-query -W 7zip 7zip-rar aria2 gosu

          echo "Checking 7zip-rar notices"
          docker exec "$container_name" test -f /usr/share/doc/7zip-rar/copyright
          docker exec "$container_name" test -f /usr/share/doc/7zip-rar/unRarLicense.txt

          echo "Checking RAR codec registration"
          if ! docker exec "$container_name" sh -c '7z i | grep -qi rar'; then
            docker exec "$container_name" sh -c '7z i' || true
            exit 1
          fi

          echo "Checking 7z create/extract round-trip"
          docker exec "$container_name" sh -c '
            set -eu
            rm -rf /tmp/debridpulse-7z-smoke
            mkdir -p /tmp/debridpulse-7z-smoke/input /tmp/debridpulse-7z-smoke/output
            printf "debridpulse-7z-smoke\n" > /tmp/debridpulse-7z-smoke/input/payload.txt
            (cd /tmp/debridpulse-7z-smoke/input && 7z a -bd -y ../archive.7z payload.txt)
            7z x -bd -y /tmp/debridpulse-7z-smoke/archive.7z -o/tmp/debridpulse-7z-smoke/output
            grep -q "debridpulse-7z-smoke" /tmp/debridpulse-7z-smoke/output/payload.txt
          '

          if [ "$health_version" != "$expected_version" ]; then
            echo "Health version mismatch: expected $expected_version, got $health_version"
            exit 1
          fi

  publish:
    name: Publish immutable image
    needs: build-and-smoke-test
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.publish_sha &&
        (
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/heads/feature/') ||
          startsWith(github.ref, 'refs/heads/fix/') ||
          startsWith(github.ref, 'refs/heads/chore/')
        )
      )
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Read application version
        id: version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable SHA tag
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=DebridPulse: Universal Transfer Manager
            org.opencontainers.image.description=Universal transfer orchestration with AllDebrid and General HTTP(S) providers plus aria2 execution
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-2.0-or-later

      - name: Verify generated image metadata and immutable tag policy
        shell: bash
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
          GENERATED_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          expected_version="${{ steps.version.outputs.version }}"
          expected_revision="${GITHUB_SHA}"
          expected_title="DebridPulse: Universal Transfer Manager"
          generated_version="$(jq -r '.labels["org.opencontainers.image.version"] // empty' <<< "$METADATA_JSON")"
          generated_revision="$(jq -r '.labels["org.opencontainers.image.revision"] // empty' <<< "$METADATA_JSON")"
          generated_title="$(jq -r '.labels["org.opencontainers.image.title"] // empty' <<< "$METADATA_JSON")"
          generated_license="$(jq -r '.labels["org.opencontainers.image.licenses"] // empty' <<< "$METADATA_JSON")"

          if [ "$generated_version" != "$expected_version" ]; then
            echo "Generated OCI version mismatch: expected $expected_version, got $generated_version"
            exit 1
          fi
          if [ "$generated_revision" != "$expected_revision" ]; then
            echo "Generated OCI revision mismatch: expected $expected_revision, got $generated_revision"
            exit 1
          fi
          if [ "$generated_title" != "$expected_title" ]; then
            echo "Generated OCI title mismatch: expected $expected_title, got $generated_title"
            exit 1
          fi
          if [ "$generated_license" != "GPL-2.0-or-later" ]; then
            echo "Generated OCI license mismatch: expected GPL-2.0-or-later, got $generated_license"
            exit 1
          fi

          mapfile -t generated_tags < <(printf '%s\n' "$GENERATED_TAGS" | sed '/^[[:space:]]*$/d')
          if [ "${#generated_tags[@]}" -ne 1 ]; then
            printf 'Immutable publication must generate exactly one tag; got:\n%s\n' "$GENERATED_TAGS"
            exit 1
          fi
          if [[ "${generated_tags[0]}" != "${IMAGE_NAME}:sha-"* ]]; then
            echo "Publication tag is not SHA-only: ${generated_tags[0]}"
            exit 1
          fi
          if [[ "${generated_tags[0]}" == *":latest" || "${generated_tags[0]}" == *":v"* || "${generated_tags[0]}" == *":internal-v"* ]]; then
            echo "Mutable/version publication tag generated unexpectedly: ${generated_tags[0]}"
            exit 1
          fi

      - name: Build and publish
        id: publish
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify published digest and OCI identity
        shell: bash
        env:
          GENERATED_TAGS: ${{ steps.meta.outputs.tags }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail

          expected_version="${{ steps.version.outputs.version }}"
          expected_revision="${GITHUB_SHA}"
          digest="$PUBLISHED_DIGEST"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid or missing published digest: $digest"
            exit 1
          fi

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            remote_digest=""
            for attempt in $(seq 1 12); do
              inspect_output=""
              if inspect_output="$(docker buildx imagetools inspect "$tag" 2>&1)"; then
                remote_digest="$(awk '/^Digest:/ {print $2; exit}' <<< "$inspect_output")"
                if [ "$remote_digest" = "$digest" ]; then
                  break
                fi
                echo "Registry digest not converged for $tag on attempt ${attempt}/12: expected $digest, got ${remote_digest:-<empty>}"
              else
                echo "Registry visibility check failed for $tag on attempt ${attempt}/12"
              fi

              if [ "$attempt" -lt 12 ]; then
                sleep 5
              fi
            done

            if [ "$remote_digest" != "$digest" ]; then
              echo "Published tag digest mismatch for $tag after retries: expected $digest, got ${remote_digest:-<empty>}"
              exit 1
            fi
          done <<< "$GENERATED_TAGS"

          pulled=0
          for attempt in $(seq 1 12); do
            if docker pull "${IMAGE_NAME}@${digest}"; then
              pulled=1
              break
            fi
            echo "Published digest pull failed on attempt ${attempt}/12"
            if [ "$attempt" -lt 12 ]; then
              sleep 5
            fi
          done
          if [ "$pulled" -ne 1 ]; then
            echo "Unable to pull published digest after retries: ${IMAGE_NAME}@${digest}"
            exit 1
          fi

          image_version="$(docker image inspect "${IMAGE_NAME}@${digest}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          image_revision="$(docker image inspect "${IMAGE_NAME}@${digest}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [ "$image_version" != "$expected_version" ]; then
            echo "Published OCI version mismatch: expected $expected_version, got $image_version"
            exit 1
          fi
          if [ "$image_revision" != "$expected_revision" ]; then
            echo "Published OCI revision mismatch: expected $expected_revision, got $image_revision"
            exit 1
          fi

          echo "Published digest: $digest"
          printf 'Published tags:\n%s\n' "$GENERATED_TAGS"
