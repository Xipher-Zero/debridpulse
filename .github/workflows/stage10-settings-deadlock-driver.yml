name: Stage 10 Settings Deadlock Driver

on:
  push:
    branches: ['1.0.12']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: '1.0.12'
      - name: Apply settings admission correction
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/main.py'); text=p.read_text()
          old='''_MUTATING_HTTP_METHODS = {"POST", "PUT", "PATCH", "DELETE"}\n_DATABASE_WIPE_PATH = "/api/admin/database/wipe"\n_AUTH_MUTATION_PATHS = {\n'''
          new='''_MUTATING_HTTP_METHODS = {"POST", "PUT", "PATCH", "DELETE"}\n_DATABASE_WIPE_PATH = "/api/admin/database/wipe"\n# These routes own a stronger maintenance admission inside the endpoint. Wrapping\n# them in application_operation() here would put the outer request and downstream\n# endpoint in different Starlette tasks and make maintenance wait on its own request.\n_SELF_MAINTAINED_MUTATION_PATHS = {"/api/settings"}\n_AUTH_MUTATION_PATHS = {\n'''
          if text.count(old) != 1: raise SystemExit('main constants anchor mismatch')
          text=text.replace(old,new,1)
          old2='''        and request.url.path != _DATABASE_WIPE_PATH\n        and request.url.path not in _AUTH_MUTATION_PATHS\n'''
          new2='''        and request.url.path != _DATABASE_WIPE_PATH\n        and request.url.path not in _SELF_MAINTAINED_MUTATION_PATHS\n        and request.url.path not in _AUTH_MUTATION_PATHS\n'''
          if text.count(old2) != 1: raise SystemExit('middleware predicate anchor mismatch')
          p.write_text(text.replace(old2,new2,1))

          test=Path('backend/tests/test_stage10_settings_admission.py')
          test.write_text('''"""Roadmap Item 10 Settings maintenance-admission regression contract."""\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[2]\n\n\ndef test_settings_put_is_not_double_admitted_across_starlette_task_boundary():\n    main = (ROOT / "backend/main.py").read_text()\n    routes = (ROOT / "backend/api/routes.py").read_text()\n    assert '_SELF_MAINTAINED_MUTATION_PATHS = {"/api/settings"}' in main\n    middleware = main.split("async def application_mutation_admission_middleware", 1)[1].split("@app.exception_handler", 1)[0]\n    assert "request.url.path not in _SELF_MAINTAINED_MUTATION_PATHS" in middleware\n    settings_route = routes.split('@router.put("/settings")', 1)[1].split("# ── Avatar", 1)[0]\n    assert "async with application.configuration_admission():" in settings_route\n    assert "application.application_operation()" not in settings_route\n''')
          PY
      - name: Verify patch
        run: |
          set -euo pipefail
          git diff --check
          python -m compileall -q backend/main.py backend/tests/test_stage10_settings_admission.py
      - name: Commit canonical tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stage10-settings-deadlock-driver.yml
          git add backend/main.py backend/tests/test_stage10_settings_admission.py
          git diff --cached --check
          git commit -m 'fix: avoid settings maintenance self-deadlock'
          git push origin HEAD:1.0.12
