name: Canonicalize Dashboard sparkline state r2

on:
  push:
    branches:
      - audit/v1.0.11.1-dashboard-sparklines
    paths:
      - .github/workflows/_repair-v1111-dashboard-sparklines-r2.yml

permissions:
  contents: write

env:
  BASE_SHA: 8a678c26bcf87c9ea00835fc2c37f74935463ace
  TARGET_BRANCH: 1.0.11.1-hotfix1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout guarded working branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 1.0.11.1-hotfix1
          fetch-depth: 2
          path: target

      - name: Checkout audit helper
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: audit/v1.0.11.1-dashboard-sparklines
          fetch-depth: 1
          path: audit

      - name: Prove exact base
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = 1.0.11.1
          test -z "$(git status --porcelain)"
          grep -R -n -E 'METRIC_HISTORY|makeSparkline|dashboard-stats-rendered|dp-card-spark' frontend/static backend/tests || true

      - name: Apply canonical Dashboard correction
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          python ../audit/scripts/_repair_dashboard_sparklines.py
          git diff --check
          node --check frontend/static/app.js
          node --check frontend/static/ui-runtime.js
          if grep -R -n -E 'METRIC_HISTORY_KEY|makeSparkline|installMetricHistoryHook|dpDashboardMetricLifecycle' frontend/static/ui-runtime.js; then
            echo 'Retired presentation-runtime sparkline owner remains'
            false
          fi
          test "$(grep -o 'class="dp-card-spark"' frontend/static/index.html | wc -l)" -eq 6
          test "$(grep -o 'class="dp-card-spark-line"' frontend/static/index.html | wc -l)" -eq 6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: target/backend/requirements-dev.txt

      - name: Full regression before commit
        shell: bash
        working-directory: target
        env:
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          pip install -r backend/requirements-dev.txt
          cd backend
          python -m pytest tests/ -q --tb=short

      - name: Commit canonical correction
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'Xipher-Zero'
          git config user.email '68665477+Xipher-Zero@users.noreply.github.com'
          git status --short
          git add frontend/static/index.html frontend/static/app.js frontend/static/ui-runtime.js frontend/static/ui-dashboard.css backend/tests/test_dashboard_sparkline_canonical_owner.py
          git commit -m 'fix: canonicalize Dashboard sparkline state'
          git push origin HEAD:${TARGET_BRANCH}
          echo "NEW_CANDIDATE_SHA=$(git rev-parse HEAD)"
