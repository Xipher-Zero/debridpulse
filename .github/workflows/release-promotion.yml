name: Release Promotion

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'internal-v*'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact fully qualified commit SHA to verify and promote
        required: true
        type: string
      target_tag:
        description: Mutable release tag to update (latest, v*, or internal-v*)
        required: true
        type: string
      dry_run:
        description: Verify the complete promotion contract without changing a mutable tag
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  packages: write
  attestations: read

env:
  IMAGE_NAME: ghcr.io/xipher-zero/debridpulse
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SECURITY_PREDICATE_TYPE: https://github.com/Xipher-Zero/debridpulse/attestations/container-security/v1
  RUNTIME_PREDICATE_TYPE: https://github.com/Xipher-Zero/debridpulse/attestations/candidate-runtime/v1

jobs:
  promote:
    name: Verify exact qualified digest and promote mutable tag
    runs-on: ubuntu-latest

    steps:
      - name: Resolve candidate and target
        id: release
        shell: bash
        env:
          DISPATCH_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_TARGET: ${{ inputs.target_tag }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            candidate_sha="$DISPATCH_SHA"
            target_tag="$DISPATCH_TARGET"
            dry_run="$DISPATCH_DRY_RUN"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            candidate_sha="$GITHUB_SHA"
            target_tag="latest"
            dry_run="false"
          elif [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/tags/internal-v* ]]; then
            candidate_sha="$GITHUB_SHA"
            target_tag="$GITHUB_REF_NAME"
            dry_run="false"
          else
            echo "Unsupported promotion trigger: $GITHUB_REF"
            exit 1
          fi

          if [[ ! "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Candidate must be a full 40-character lowercase commit SHA: $candidate_sha"
            exit 1
          fi
          if [[ ! "$target_tag" =~ ^(latest|v[0-9A-Za-z._-]+|internal-v[0-9A-Za-z._-]+)$ ]]; then
            echo "Refusing unsupported mutable target tag: $target_tag"
            exit 1
          fi
          if [ "$dry_run" != "true" ] && [ "$dry_run" != "false" ]; then
            echo "Invalid dry_run value: $dry_run"
            exit 1
          fi

          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "target_tag=$target_tag" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "source_tag=sha-${candidate_sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.release.outputs.candidate_sha }}

      - name: Read expected application version
        id: version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Verify all qualification workflows succeeded for exact SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate_sha }}
        run: |
          set -euo pipefail

          required=(
            "Tests"
            "Browser Runtime"
            "CodeQL"
            "Container Security"
            "Candidate Runtime Qualification"
            "Fork Image"
          )

          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${CANDIDATE_SHA}&per_page=100"
          missing=()
          for attempt in $(seq 1 120); do
            payload="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")"

            missing=()
            for workflow in "${required[@]}"; do
              if jq -e \
                --arg name "$workflow" \
                --arg sha "$CANDIDATE_SHA" \
                '.workflow_runs[] | select(.name == $name and .head_sha == $sha and .status == "completed" and .conclusion == "success")' \
                <<< "$payload" >/dev/null; then
                echo "QUALIFIED: $workflow @ $CANDIDATE_SHA"
              else
                missing+=("$workflow")
              fi
            done

            if [ "${#missing[@]}" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "Timed out waiting for successful exact-SHA qualification: ${missing[*]}"
              exit 1
            fi
            echo "Waiting for exact-SHA qualification: ${missing[*]}"
            sleep 15
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable source manifest and child identities
        id: source
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate_sha }}
          SOURCE_TAG: ${{ steps.release.outputs.source_tag }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          source_ref="${IMAGE_NAME}:${SOURCE_TAG}"
          source_digest=""
          manifest_json=""
          for attempt in $(seq 1 12); do
            if inspect="$(docker buildx imagetools inspect "$source_ref" 2>/dev/null)" && \
               manifest_json="$(docker buildx imagetools inspect --raw "$source_ref" 2>/dev/null)"; then
              source_digest="$(awk '/^Digest:/ {print $2; exit}' <<< "$inspect")"
              if [[ "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                break
              fi
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          if [[ ! "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unable to resolve immutable source digest for $source_ref"
            exit 1
          fi

          amd64_digest="$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest][0] // empty' <<< "$manifest_json")"
          arm64_digest="$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest][0] // empty' <<< "$manifest_json")"
          for value in "$amd64_digest" "$arm64_digest"; do
            [[ "$value" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Missing platform child digest: $value"; exit 1; }
          done

          docker pull --platform linux/amd64 "${IMAGE_NAME}@${amd64_digest}"
          image_version="$(docker image inspect "${IMAGE_NAME}@${amd64_digest}" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          image_revision="$(docker image inspect "${IMAGE_NAME}@${amd64_digest}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [ "$image_version" != "$EXPECTED_VERSION" ]; then
            echo "Source OCI version mismatch: expected $EXPECTED_VERSION, got $image_version"
            exit 1
          fi
          if [ "$image_revision" != "$CANDIDATE_SHA" ]; then
            echo "Source OCI revision mismatch: expected $CANDIDATE_SHA, got $image_revision"
            exit 1
          fi

          echo "source_digest=$source_digest" >> "$GITHUB_OUTPUT"
          echo "amd64_digest=$amd64_digest" >> "$GITHUB_OUTPUT"
          echo "arm64_digest=$arm64_digest" >> "$GITHUB_OUTPUT"
          echo "Verified immutable source: $source_ref@$source_digest"

      - name: Verify signed security and runtime attestations target exact source digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate_sha }}
          SOURCE_DIGEST: ${{ steps.source.outputs.source_digest }}
          AMD64_DIGEST: ${{ steps.source.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.source.outputs.arm64_digest }}
        run: |
          set -euo pipefail
          subject="oci://${IMAGE_NAME}@${SOURCE_DIGEST}"

          gh attestation verify "$subject" \
            -R "$GITHUB_REPOSITORY" \
            --predicate-type "$SECURITY_PREDICATE_TYPE" \
            --format json > security-attestations.json

          gh attestation verify "$subject" \
            -R "$GITHUB_REPOSITORY" \
            --predicate-type "$RUNTIME_PREDICATE_TYPE" \
            --format json > runtime-attestations.json

          jq -e \
            --arg sha "$CANDIDATE_SHA" \
            --arg manifest "$SOURCE_DIGEST" \
            --arg amd64 "$AMD64_DIGEST" \
            --arg arm64 "$ARM64_DIGEST" \
            'any(.[]; .verificationResult.statement.predicate as $p |
              $p.commit_sha == $sha and
              $p.manifest_digest == $manifest and
              $p.platforms["linux/amd64"].digest == $amd64 and
              $p.platforms["linux/amd64"].vulnerability_gate == "passed" and
              $p.platforms["linux/arm64"].digest == $arm64 and
              $p.platforms["linux/arm64"].vulnerability_gate == "passed" and
              $p.result == "success")' security-attestations.json >/dev/null

          jq -e \
            --arg sha "$CANDIDATE_SHA" \
            --arg manifest "$SOURCE_DIGEST" \
            --arg amd64 "$AMD64_DIGEST" \
            --arg arm64 "$ARM64_DIGEST" \
            'any(.[]; .verificationResult.statement.predicate as $p |
              $p.commit_sha == $sha and
              $p.manifest_digest == $manifest and
              $p.platforms["linux/amd64"].digest == $amd64 and
              $p.platforms["linux/amd64"].runtime == "passed" and
              $p.platforms["linux/amd64"].non_root == "passed" and
              $p.platforms["linux/arm64"].digest == $arm64 and
              $p.platforms["linux/arm64"].runtime == "passed" and
              $p.platforms["linux/arm64"].non_root == "passed" and
              $p.result == "success")' runtime-attestations.json >/dev/null

          echo "QUALIFIED_DIGEST == PROMOTED_SOURCE_DIGEST: $SOURCE_DIGEST"

      - name: Dry-run promotion contract
        if: steps.release.outputs.dry_run == 'true'
        shell: bash
        run: |
          echo "Dry run complete. Exact-SHA workflows, OCI digest, child digests, and signed qualification attestations are valid."
          echo "No mutable image tag was changed."

      - name: Promote verified digest to mutable release tag
        if: steps.release.outputs.dry_run == 'false'
        shell: bash
        env:
          SOURCE_DIGEST: ${{ steps.source.outputs.source_digest }}
          TARGET_TAG: ${{ steps.release.outputs.target_tag }}
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate_sha }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          source_ref="${IMAGE_NAME}@${SOURCE_DIGEST}"
          target_ref="${IMAGE_NAME}:${TARGET_TAG}"
          docker buildx imagetools create --tag "$target_ref" "$source_ref"

          target_digest=""
          for attempt in $(seq 1 12); do
            if inspect="$(docker buildx imagetools inspect "$target_ref" 2>/dev/null)"; then
              target_digest="$(awk '/^Digest:/ {print $2; exit}' <<< "$inspect")"
              if [ "$target_digest" = "$SOURCE_DIGEST" ]; then break; fi
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          if [ "$target_digest" != "$SOURCE_DIGEST" ]; then
            echo "Promotion digest mismatch: source $SOURCE_DIGEST, target ${target_digest:-<empty>}"
            exit 1
          fi

          docker pull --platform linux/amd64 "$target_ref"
          target_version="$(docker image inspect "$target_ref" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          target_revision="$(docker image inspect "$target_ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$target_version" = "$EXPECTED_VERSION"
          test "$target_revision" = "$CANDIDATE_SHA"

          echo "Promoted $target_ref -> $SOURCE_DIGEST"
