name: Temporary Settings Behavior Tests

on:
  push:
    branches:
      - work/settings-behavior-confirm

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/settings-behavior-confirm
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff
      - name: Check undefined Python names
        run: |
          cd backend
          ruff check api auth core db services main.py --select F821,F822,F823
      - name: Run all tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short
      - name: Check Python syntax
        run: |
          cd backend
          python -m compileall -q .
      - name: Check Settings JavaScript syntax
        run: node --check frontend/static/ui-settings-page.js
