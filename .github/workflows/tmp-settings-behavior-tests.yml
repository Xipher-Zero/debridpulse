name: Temporary Settings Behavior Tests

on:
  push:
    branches:
      - work/settings-behavior-confirm

permissions:
  contents: write

jobs:
  test:
    if: github.event.head_commit.message != 'chore: capture pytest failure output'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: work/settings-behavior-confirm
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install ruff
      - name: Check undefined Python names
        run: |
          cd backend
          ruff check api auth core db services main.py --select F821,F822,F823
      - name: Run all tests and capture output
        id: pytest
        continue-on-error: true
        run: |
          cd backend
          set +e
          python -m pytest tests/ -v --tb=short 2>&1 | tee ../.tmp/pytest-failure.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit failure output for inspection
        if: steps.pytest.outputs.status != '0'
        run: |
          git config user.name 'Xipher-Zero'
          git config user.email '68665477+Xipher-Zero@users.noreply.github.com'
          git add .tmp/pytest-failure.txt
          git commit -m 'chore: capture pytest failure output'
          git push origin HEAD:work/settings-behavior-confirm
      - name: Fail if pytest failed
        if: steps.pytest.outputs.status != '0'
        run: exit 1
      - name: Check Python syntax
        if: steps.pytest.outputs.status == '0'
        run: |
          cd backend
          python -m compileall -q .
      - name: Check Settings JavaScript syntax
        if: steps.pytest.outputs.status == '0'
        run: node --check frontend/static/ui-settings-page.js
