name: Runtime Modernization PR Generator

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/v1.0.6-runtime-modernization'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Probe published v1.0.6 archive runtime
        continue-on-error: true
        shell: bash
        run: |
          set -u
          image="ghcr.io/xipher-zero/debridpulse:v1.0.6"
          docker pull "$image"
          docker run --rm "$image" aria2c --version | head -n 1
          if docker run --rm "$image" sh -lc '7z i 2>/dev/null | grep -Eiq "(^|[[:space:]])rar([[:space:]]|$)"'; then
            echo "published_rar_codec=present"
          else
            echo "published_rar_codec=absent"
          fi
          if docker run --rm "$image" dpkg-query -W p7zip-rar >/dev/null 2>&1; then
            echo "published_p7zip_rar_package=present"
          else
            echo "published_p7zip_rar_package=absent"
          fi

      - name: Apply runtime source and dependency inputs
        run: python tools/runtime_modernization_generate_v2.py apply

      - name: Regenerate Python lockfiles with pip-tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-tools==7.6.0
          pip-compile --output-file=backend/requirements.txt --strip-extras backend/requirements.in
          pip-compile --output-file=backend/requirements-dev.txt --strip-extras backend/requirements-dev.in

      - name: Refresh vendored Chart.js
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          pushd "$tmp" >/dev/null
          npm pack chart.js@4.5.1 --ignore-scripts >/dev/null
          tar -xzf chart.js-4.5.1.tgz
          cp package/dist/chart.umd.min.js "$GITHUB_WORKSPACE/frontend/static/vendor/chart.umd.min.js"
          cp package/LICENSE.md "$GITHUB_WORKSPACE/licenses/Chart.js-MIT.txt"
          popd >/dev/null

      - name: Reconcile dependency license inventory
        run: python tools/runtime_modernization_generate_v2.py licenses

      - name: Validate generated dependency state
        shell: bash
        run: |
          python -m pip install -r backend/requirements-dev.txt
          cd backend
          python -m pytest tests/test_runtime_modernization.py tests/test_license_policy.py tests/test_extractor.py -q
          python -m compileall -q .
          cd ..
          node --check frontend/static/app.js

      - name: Commit generated modernization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Dockerfile \
            README.md \
            CHANGELOG.md \
            backend/core/config.py \
            backend/services/extractor.py \
            backend/services/manager_v2.py \
            backend/requirements.in \
            backend/requirements.txt \
            backend/requirements-dev.in \
            backend/requirements-dev.txt \
            backend/tests/test_extractor.py \
            backend/tests/test_runtime_modernization.py \
            docs/DEPENDENCY_LICENSES.md \
            licenses/python-runtime.json \
            licenses/Chart.js-MIT.txt \
            frontend/static/vendor/chart.umd.min.js \
            .github/workflows/fork-image.yml
          git diff --cached --check
          git commit -m "Modernize v1.0.6 runtime dependencies"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
