name: Cohort Retry Remediation Helper

on:
  push:
    branches:
      - '1.0.12'

permissions:
  contents: write

jobs:
  build-blobs:
    if: github.event.head_commit.message == 'Prepare cohort retry remediation blobs'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout exact helper commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
      - name: Build exact-source replacement blobs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import pathlib
          import py_compile
          import urllib.request

          root = pathlib.Path.cwd()

          def replace_exact(path: str, old: str, new: str, *, count: int = 1) -> None:
              target = root / path
              source = target.read_text(encoding="utf-8")
              actual = source.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} exact match(es), found {actual}")
              target.write_text(source.replace(old, new), encoding="utf-8")

          replace_exact(
              "backend/tests/test_direct_link_collection_affinity.py",
              """    assert [str(item.payload) for item in specialized.calls] == [\n        str(item.payload) for item in submitted\n    ]\n""",
              """    assert sorted(str(item.payload) for item in specialized.calls) == sorted(\n        str(item.payload) for item in submitted\n    )\n""",
          )

          replace_exact(
              "backend/transfers/cohorts.py",
              """async def _proof_disposition(request_id: str, disposition: str, reason: str, *,\n                             clear_retry=False, preserve_reason=False) -> None:\n""",
              """async def _proof_terminal(request_id: str) -> bool:\n    async with get_db() as db:\n        row = await db.fetchone(\n            \"SELECT equivalence_disposition FROM transfer_requests WHERE id=?\",\n            (request_id,),\n        )\n    disposition = str(row.get(\"equivalence_disposition\") or \"\") if row else \"\"\n    return disposition in {\"released\", \"independent\", \"contradictory\", \"exhausted\"}\n\n\nasync def _proof_disposition(request_id: str, disposition: str, reason: str, *,\n                             clear_retry=False, preserve_reason=False) -> None:\n""",
          )

          replace_exact(
              "backend/transfers/cohorts.py",
              """                    equivalence_disposition=CASE\n                        WHEN equivalence_disposition='pending' THEN 'released'\n                        ELSE equivalence_disposition END,\n""",
              """                    equivalence_disposition=CASE\n                        WHEN equivalence_disposition IN ('recovered','exhausted','contradictory','independent')\n                            THEN equivalence_disposition\n                        ELSE 'released' END,\n""",
          )

          replace_exact(
              "backend/transfers/cohorts.py",
              """    incoming = _normalized_candidates(record, candidates)\n    if not incoming:\n        return False\n\n    canonicals = tuple(\n""",
              """    incoming = _normalized_candidates(record, candidates)\n    if not incoming:\n        return False\n    # Once a cohort is conservatively released, every sibling must stay on the\n    # independent materialization path for this submission. Without this durable\n    # guard a later concurrently scheduled sibling can re-enter equivalence proof\n    # after another member exhausts, producing order-dependent partial attachment.\n    if await _proof_terminal(record.id):\n        return False\n\n    canonicals = tuple(\n""",
          )

          replace_exact(
              "backend/tests/test_equivalence_retry_remediation.py",
              """    assert float(failed[\"retry_at\"] or 0) == 0\n    assert all(row[\"state\"] != \"materializing\" for row in rows)\n""",
              """    assert float(failed[\"retry_at\"] or 0) == 0\n    assert sum(row[\"equivalence_disposition\"] == \"exhausted\" for row in rows) == 1\n    assert sum(row[\"equivalence_disposition\"] == \"released\" for row in rows) == 6\n    assert all(row[\"state\"] != \"materializing\" for row in rows)\n""",
          )

          paths = (
              "backend/transfers/cohorts.py",
              "backend/tests/test_direct_link_collection_affinity.py",
              "backend/tests/test_equivalence_retry_remediation.py",
          )
          for path in paths:
              py_compile.compile(str(root / path), doraise=True)

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          for path in paths:
              payload = json.dumps({
                  "content": base64.b64encode((root / path).read_bytes()).decode("ascii"),
                  "encoding": "base64",
              }).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs",
                  data=payload,
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              print(f"BLOB\t{path}\t{result['sha']}")
          PY
