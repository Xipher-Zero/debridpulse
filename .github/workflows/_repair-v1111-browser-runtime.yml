name: Repair v1.0.11.1 browser runtime defects

on:
  push:
    branches:
      - audit/v1.0.11.1-f500727-qualification
    paths:
      - .github/workflows/_repair-v1111-browser-runtime.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_BASE_SHA: f50072764619338bbcee5378008af859f4fc2655
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout hotfix candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 1.0.11-hotfix1
          fetch-depth: 2

      - name: Prove expected base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "1.0.11.1"
          test -z "$(git status --porcelain)"

      - name: Apply guarded browser-runtime repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "frontend/static/app.js",
              "  if (v === 'settings')  loadSettings();\n  if (v === 'aria2queue') loadAria2QueueView();",
              "  if (v === 'settings')  loadSettings();\n  if (v === 'help')      loadHelp();\n  if (v === 'aria2queue') loadAria2QueueView();",
          )

          replace_exact(
              "frontend/static/ui-help-page.js",
              "  function render() {\n    const view = root();\n    if (!view) return;\n\n    view.classList.add('dp-help-clean-view');",
              "  function render() {\n    const view = root();\n    if (!view) return;\n    if (view.dataset.dpHelpRendered === '1') {\n      activateTab(state.activeTab);\n      return;\n    }\n\n    view.classList.add('dp-help-clean-view');",
          )

          replace_exact(
              "frontend/static/ui-help-page.js",
              "    bindEvents(view);\n    activateTab(state.activeTab);\n  }\n\n  function init() {\n    if (!root()) return;\n    render();\n  }\n\n  if (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', init, { once: true });\n  } else {\n    init();\n  }\n})();",
              "    view.dataset.dpHelpRendered = '1';\n    bindEvents(view);\n    activateTab(state.activeTab);\n    document.dispatchEvent(new CustomEvent('debridpulse:help-rendered', {detail: {view: 'help'}}));\n  }\n\n  function load() {\n    render();\n  }\n\n  // app.js owns generic navigation and calls this canonical Help entry point.\n  window.loadHelp = load;\n  try { loadHelp = load; } catch (_) {}\n  window.DPHelpPage = Object.freeze({load, activateTab});\n})();",
          )

          replace_exact(
              "frontend/static/ui-help-license-documents.js",
              "(function () {\n  'use strict';\n\n  function focusableElements(dialog) {",
              "(function () {\n  'use strict';\n\n  let activeBackdrop = null;\n  let activeOpener = null;\n  const helpRoot = () => document.getElementById('view-help');\n\n  function focusableElements(dialog) {",
          )

          replace_exact(
              "frontend/static/ui-help-license-documents.js",
              "  function init() {\n    if (enhance()) return;\n    if (typeof window.requestAnimationFrame === 'function') {\n      window.requestAnimationFrame(enhance);\n    }\n  }\n\n  if (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', init, {once: true});\n  } else {\n    init();\n  }\n})();",
              "  // The Help owner emits this only after its canonical markup exists.\n  document.addEventListener('debridpulse:help-rendered', enhance);\n})();",
          )

          replace_exact(
              "frontend/static/index.html",
              '<script src="/ui-help-page.js?v=2" defer></script>\n<script src="/ui-help-license-documents.js?v=2" defer></script>',
              '<script src="/ui-help-page.js?v=3" defer></script>\n<script src="/ui-help-license-documents.js?v=3" defer></script>',
          )

          scale = Path("frontend/static/icons/lucide/scale.svg")
          if scale.exists():
              raise SystemExit("scale.svg unexpectedly already exists")
          scale.write_text('''<svg\n  xmlns="http://www.w3.org/2000/svg"\n  width="24"\n  height="24"\n  viewBox="0 0 24 24"\n  fill="none"\n  stroke="currentColor"\n  stroke-width="2"\n  stroke-linecap="round"\n  stroke-linejoin="round"\n>\n  <path d="M12 3v18" />\n  <path d="m19 8 3 8a5 5 0 0 1-6 0zV7" />\n  <path d="M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1" />\n  <path d="m5 8 3 8a5 5 0 0 1-6 0zV7" />\n  <path d="M7 21h10" />\n</svg>\n''', encoding="utf-8")

          test_path = Path("backend/tests/test_v1111_canonical_frontend_contract.py")
          test_text = test_path.read_text(encoding="utf-8")
          old = '''    assert "dp-help-master-card" in source\n    assert "dp-help-section-card" in source\n    assert "new MutationObserver" not in source\n'''
          new = '''    assert "dp-help-master-card" in source\n    assert "dp-help-section-card" in source\n    assert "window.loadHelp = load;" in source\n    assert "window.DPHelpPage = Object.freeze({load, activateTab});" in source\n    assert "debridpulse:help-rendered" in source\n    assert "DOMContentLoaded" not in source\n    assert "new MutationObserver" not in source\n    assert "if (v === 'help')      loadHelp();" in read(APP)\n    assert (STATIC / "icons" / "lucide" / "scale.svg").is_file()\n'''
          if test_text.count(old) != 1:
              raise SystemExit("canonical Help test insertion guard failed")
          test_text = test_text.replace(old, new)
          old = '''    assert "/api/legal-documents/" in legal\n    assert "credentials: 'same-origin'" in legal\n    assert "trapDialogKeydown" in legal\n'''
          new = '''    assert "/api/legal-documents/" in legal\n    assert "credentials: 'same-origin'" in legal\n    assert "trapDialogKeydown" in legal\n    assert "const helpRoot = () => document.getElementById('view-help');" in legal\n    assert "let activeBackdrop = null;" in legal\n    assert "let activeOpener = null;" in legal\n    assert "debridpulse:help-rendered" in legal\n    assert "requestAnimationFrame" not in legal\n    assert "DOMContentLoaded" not in legal\n'''
          if test_text.count(old) != 1:
              raise SystemExit("Help legal test insertion guard failed")
          test_path.write_text(test_text.replace(old, new), encoding="utf-8")
          PY

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do node --check "$file"; done < <(find frontend/static -maxdepth 1 -type f -name '*.js' -print | sort)

      - name: Targeted canonical Help regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -r backend/requirements.txt -r backend/requirements-dev.txt
          pytest -q \
            backend/tests/test_v1111_canonical_frontend_contract.py \
            backend/tests/test_ui_help_clean_rewrite_contract.py \
            backend/tests/test_ui_help_final_polish_contract.py \
            backend/tests/test_ui_help_full_content_overhaul_contract.py \
            backend/tests/test_ui_help_local_legal_overlay_contract.py \
            backend/tests/test_ui_help_quickstart_content_contract.py \
            backend/tests/test_help_local_legal_documents.py

      - name: Commit repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Xipher-Zero"
          git config user.email "68665477+Xipher-Zero@users.noreply.github.com"
          git add frontend/static/app.js \
                  frontend/static/index.html \
                  frontend/static/ui-help-page.js \
                  frontend/static/ui-help-license-documents.js \
                  frontend/static/icons/lucide/scale.svg \
                  backend/tests/test_v1111_canonical_frontend_contract.py
          test -n "$(git status --porcelain)"
          git commit -m "fix: canonicalize Help navigation lifecycle"
          git push origin HEAD:1.0.11-hotfix1
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
