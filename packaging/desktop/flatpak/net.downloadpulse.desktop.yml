# DownloadPulse as a Flatpak (flatpak-builder 1.4.4, the pinned Debian package).
# The application is the layout packaging/desktop/assemble.py builds on Linux
# x86_64 (bundled CPython 3.12.14, the hash-locked requirements, Neutralino
# v6.10.0, the bundled tools), installed as-is under /app. Build:
#   python3 packaging/desktop/assemble.py --out build/layout --usenet
#   tar -C build -czf build/layout.tar.gz layout
#   <prepare-sources.sh output> -> build/flatpak-sources/   (the macOS recipes' prepared sources)
#   flatpak-builder --user --repo=build/repo build/app packaging/desktop/flatpak/net.downloadpulse.desktop.yml
#   flatpak build-bundle build/repo DownloadPulse-<version>-linux-x86_64.flatpak net.downloadpulse.desktop
# The native helpers are built here, against this runtime (build-tools.sh),
# into /app/lib/downloadpulse/tools, where the supervisor puts them on PATH.
app-id: net.downloadpulse.desktop
runtime: org.gnome.Platform     # WebKitGTK 4.1, which Neutralino's Linux webview loads
runtime-version: '49'
sdk: org.gnome.Sdk
command: downloadpulse
finish-args:
  - --share=network             # downloads; the backend listens on loopback only
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Only this session-bus name is reachable besides the desktop portals and
  # the application's own ID (xdg-dbus-proxy): the tray's StatusNotifierWatcher.
  # Notices go through the notification portal. No systemd, no other service
  # -- so a Media Downloads helper that may use AF_UNIX cannot have a session
  # service start an unconfined process for it (WS4 finding F-4).
  - --talk-name=org.kde.StatusNotifierWatcher
  # See, never talk to, the org.kde.* names: the tray's actions are taken
  # only from a caller that owns an org.kde.StatusNotifierHost-* name
  # (desktop/supervisor.py SessionBus). Flatpak has no --see-name option;
  # this is build-finish's own --metadata writing the [Session Bus Policy]
  # "see" entry. xdg-dbus-proxy patterns end at a dot, so org.kde.* is the
  # narrowest key that covers StatusNotifierHost-<pid> names.
  - --metadata=Session Bus Policy=org.kde.*=see
  # The user picks the download folder in the setup wizard; DownloadPulse's own
  # folder browser lists what the sandbox exposes: the Downloads folder and
  # removable media. Its data stays in the app's own XDG data directory.
  - --filesystem=xdg-download
  - --filesystem=/run/media
  - --filesystem=/media
modules:
  # The native shell: Neutralino 6.10.0 built from its pinned source (the tag's
  # tree, commit 4361b63eb1157fc7dedb29b92815a08ec0002767) with DownloadPulse's
  # one Linux patch (packaging/desktop/neutralino/linux-gtk-main-thread.patch:
  # window methods and the tray run on the GTK main loop, where GTK requires
  # them; the released binary calls GTK from its WebSocket thread), against
  # this runtime. The downloadpulse module installs it as the shell.
  - name: neutralino
    buildsystem: simple
    build-options:
      no-debuginfo: true
    sources:
      - type: git
        url: https://github.com/neutralinojs/neutralinojs.git
        tag: v6.10.0
        commit: 4361b63eb1157fc7dedb29b92815a08ec0002767
      - type: patch
        path: ../neutralino/linux-gtk-main-thread.patch
        options: ["-p1"]
      # The same patch's bytes, for its digest in the shell's provenance.
      - type: file
        path: ../neutralino/linux-gtk-main-thread.patch
    build-commands:
      # Neutralino's CMake links the legacy libstdc++fs, which this toolchain
      # (GCC with std::filesystem inside libstdc++) no longer ships: an empty
      # archive of that name satisfies the link and contributes no code.
      - mkdir -p stubs && ar rc stubs/libstdc++fs.a
      - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS="-L$PWD/stubs"
      - cmake --build build -j "$FLATPAK_BUILDER_N_JOBS"
      - strip bin/neutralino-linux_x64
      - install -Dm755 bin/neutralino-linux_x64 /app/lib/neutralino/downloadpulse-shell
      # Its provenance, in the schema of packaging/desktop/neutralino/build-macos.sh
      # (the commit is the one flatpak-builder verified for the tag).
      - >-
        printf '{"neutralino": "v6.10.0", "commit": "4361b63eb1157fc7dedb29b92815a08ec0002767",
        "patches": {"linux-gtk-main-thread.patch": "%s"}, "architecture": "%s", "cmake": "%s",
        "compiler": "%s", "sdk": "%s", "binary_sha256": "%s"}\n'
        "$(sha256sum linux-gtk-main-thread.patch | cut -d' ' -f1)" "$(uname -m)" "$(cmake --version | head -1)"
        "$(gcc --version | head -1)" "$(. /etc/os-release && echo "$NAME $VERSION_ID")"
        "$(sha256sum /app/lib/neutralino/downloadpulse-shell | cut -d' ' -f1)" > /app/lib/neutralino/PROVENANCE.json
  - name: tools
    buildsystem: simple
    # build-tools.sh strips what it builds; flatpak-builder's own strip and
    # debuginfo pass is not run over it (nor over the layout, below).
    build-options:
      no-debuginfo: true
      strip: false
    sources:
      - type: dir
        path: ../../../build/flatpak-sources
      - type: file
        path: build-tools.sh
      - type: file
        path: ../../ffmpeg/build-package.sh
      # The official Linux releases, unmodified (7-Zip: GitHub's published
      # asset digest; RARLAB publishes none: pinned to the file first verified
      # for DownloadPulse, as its macOS release is).
      - type: file
        url: https://github.com/ip7z/7zip/releases/download/25.01/7z2501-linux-x64.tar.xz
        sha256: 4ca3b7c6f2f67866b92622818b58233dc70367be2f36b498eb0bdeaaa44b53f4
      - type: file
        url: https://www.rarlab.com/rar/rarlinux-x64-723.tar.gz
        sha256: 759b4b6aa0d9f77131882162951193f3a0e54bf60e1d8dc4255aa308accab588
    build-commands:
      - bash build-tools.sh /app/lib/downloadpulse/tools
  - name: downloadpulse
    buildsystem: simple
    # The layout is installed exactly as assemble.py built it: its interpreter
    # (python-build-standalone, shipped stripped) and wheels are prebuilt, and
    # flatpak-builder's strip/debuginfo pass would rewrite them -- it leaves
    # the interpreter unable to start ("symbol lookup error").
    build-options:
      no-debuginfo: true
      strip: false
    sources:
      - type: archive
        path: ../../../build/layout.tar.gz
      - type: file
        path: net.downloadpulse.desktop.desktop
      - type: file
        path: net.downloadpulse.desktop.metainfo.xml
      - type: script
        dest-filename: downloadpulse
        commands:
          - exec /app/lib/downloadpulse/runtime/python/bin/python3 -I /app/lib/downloadpulse/desktop/supervisor.py "$@"
    build-commands:
      - mkdir -p /app/lib/downloadpulse /app/bin
      - cp -a . /app/lib/downloadpulse/
      - rm -f /app/lib/downloadpulse/downloadpulse /app/lib/downloadpulse/net.downloadpulse.desktop.*
      # The shell built above, in place of the layout's released binary.
      - install -m755 /app/lib/neutralino/downloadpulse-shell /app/lib/downloadpulse/desktop/shell/downloadpulse-shell
      # BUILD-INFO.json records the shell installed, not the layout's released one:
      # its provenance, once the installed executable is the binary it names.
      - >-
        /app/lib/downloadpulse/runtime/python/bin/python3 -I -c 'import hashlib, json, pathlib, sys;
        root = pathlib.Path("/app/lib/downloadpulse"); info = json.loads((root / "BUILD-INFO.json").read_text());
        shell = json.loads(pathlib.Path("/app/lib/neutralino/PROVENANCE.json").read_text());
        installed = hashlib.sha256((root / "desktop/shell/downloadpulse-shell").read_bytes()).hexdigest();
        installed == shell["binary_sha256"] or sys.exit(f"the installed shell {installed} is not the built one");
        info["shell"] = shell; (root / "BUILD-INFO.json").write_text(json.dumps(info, indent=1) + "\n")'
      - rm -r /app/lib/neutralino
      - install -Dm755 downloadpulse /app/bin/downloadpulse
      - install -Dm644 net.downloadpulse.desktop.desktop /app/share/applications/net.downloadpulse.desktop.desktop
      - install -Dm644 net.downloadpulse.desktop.metainfo.xml /app/share/metainfo/net.downloadpulse.desktop.metainfo.xml
      - install -Dm644 desktop/shell/resources/icons/app.png /app/share/icons/hicolor/512x512/apps/net.downloadpulse.desktop.png
      - install -Dm644 desktop/shell/resources/icons/app-256.png /app/share/icons/hicolor/256x256/apps/net.downloadpulse.desktop.png
